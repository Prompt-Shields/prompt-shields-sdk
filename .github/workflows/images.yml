name: Images

# Container images for the gateway and the collector.
#
# Pull requests: build both images, Trivy-scan them (CRITICAL fails) and
# smoke-test them under the chart's restrictions (scripts/image-smoke-test.sh).
# Nothing is pushed.
#
# Push to main and `v*` tags: the same build, scan and smoke test gate the
# push to GHCR; the pushed digest is then signed with cosign (keyless, GitHub
# OIDC), gets a syft SPDX SBOM attestation (cosign) and a SLSA build
# provenance attestation (GitHub artifact attestations, also pushed to GHCR).
#
#   ghcr.io/prompt-shields/prompt-shields-sdk/gateway
#   ghcr.io/prompt-shields/prompt-shields-sdk/collector
#
# Tags: `main` and `sha-<short>` from main; `<version>`, `<major>.<minor>`
# and (non-pre-release only) `latest` from a `v<version>` tag.
#
# Verify a pulled image:
#   cosign verify <image>@<digest> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/Prompt-Shields/prompt-shields-sdk/\.github/workflows/images\.yml@'
#   cosign verify-attestation --type spdxjson <same flags> <image>@<digest>
#   gh attestation verify oci://<image>@<digest> --owner Prompt-Shields
#
# Third-party actions are pinned to full commit SHAs (tag in the comment).

on:
  pull_request:
    paths:
      - "gateway/**"
      - "packages/collector/**"
      - "packages/db/**"
      - ".dockerignore"
      - "scripts/image-smoke-test.sh"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/prompt-shields/prompt-shields-sdk

jobs:
  build:
    name: Build and scan ${{ matrix.image }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: gateway
            file: gateway/Dockerfile
          - image: collector
            context: .
            file: packages/collector/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (read-only, non-root, no capabilities)
        run: scripts/image-smoke-test.sh "${{ matrix.image }}" "local/${{ matrix.image }}:ci"

  publish:
    name: Publish ${{ matrix.image }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing, provenance
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: gateway
            file: gateway/Dockerfile
          - image: collector
            context: .
            file: packages/collector/Dockerfile
    env:
      IMAGE: ghcr.io/prompt-shields/prompt-shields-sdk/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Gate: build locally, scan and smoke-test before anything is pushed.
      - name: Build for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (read-only, non-root, no capabilities)
        run: scripts/image-smoke-test.sh "${{ matrix.image }}" "local/${{ matrix.image }}:ci"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - id: push
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same layers as the scanned image (cache from the build above).
          cache-from: type=gha,scope=${{ matrix.image }}
          # Provenance and SBOM come from the attestations below instead of
          # buildx's own, so the pushed tag is a plain single-platform image.
          provenance: false
          sbom: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
      - name: Attest SBOM (cosign)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SBOM: sbom-${{ matrix.image }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "$SBOM" "${IMAGE}@${DIGEST}"
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}@${DIGEST}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
