  /v1/mcp/{server}:
    parameters:
      - name: server
        in: path
        required: true
        description: Id of an MCP server configured in `mcp_servers`
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'
      - name: MCP-Protocol-Version
        in: header
        required: false
        description: |
          MCP protocol revision. From `2026-07-28` on, `Mcp-Method` (and
          `Mcp-Name` for `tools/call`, `prompts/get` and `resources/read`)
          are required and must match the body.
        schema:
          type: string
          example: '2026-07-28'
      - name: Mcp-Session-Id
        in: header
        required: false
        description: Session id of a `2025-11-25` server, passed through.
        schema:
          type: string
    post:
      operationId: mcpPost
      tags: [MCP]
      summary: Send one JSON-RPC message to an MCP server
      description: |
        Enforcing MCP Streamable HTTP proxy (#63). The body is one JSON-RPC
        2.0 request, notification or response (no batches). The gateway:
        checks `Mcp-Method` / `Mcp-Name` against the body (`-32020` on a
        mismatch); applies the server's tool allowlist or denylist to
        `tools/call` (`-32010`) and filters `tools/list` results; refuses a
        pinned tool whose definition changed (`-32012`); runs the server's
        input and output guardrails on tool arguments and results
        (`-32011`, fail closed); and forwards the request to the configured
        URL with the server's own credentials. The caller's `Authorization`
        header is never forwarded. Policy refusals of a request are JSON-RPC
        errors with HTTP 200. SSE responses stream. See
        `gateway/docs/mcp-proxy.md`.
      security:
        - McpToken: []
      parameters:
        - name: Mcp-Method
          in: header
          required: false
          schema:
            type: string
        - name: Mcp-Name
          in: header
          required: false
          description: Plain or `=?base64?...?=` encoded.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcMessage'
      responses:
        '200':
          description: JSON-RPC response, as JSON or as an SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcMessage'
            text/event-stream:
              schema:
                type: string
        '202':
          description: Notification or response accepted by the MCP server
        '400':
          $ref: '#/components/responses/McpError'
        '401':
          $ref: '#/components/responses/McpError'
        '404':
          $ref: '#/components/responses/McpError'
        '413':
          $ref: '#/components/responses/McpError'
        '415':
          $ref: '#/components/responses/McpError'
        '502':
          $ref: '#/components/responses/McpError'
        '503':
          $ref: '#/components/responses/McpError'
        '504':
          $ref: '#/components/responses/McpError'
    get:
      operationId: mcpGetStream
      tags: [MCP]
      summary: Open the server-to-client SSE stream (2025-11-25)
      description: |
        Passed through to a `2025-11-25` server with the session id. A
        `2026-07-28` server answers 405.
      security:
        - McpToken: []
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/McpError'
    delete:
      operationId: mcpDeleteSession
      tags: [MCP]
      summary: End a session (2025-11-25)
      security:
        - McpToken: []
      responses:
        '200':
          description: Session ended
        default:
          $ref: '#/components/responses/McpError'

  /v1/proxy/{path}:
    parameters:
      - $ref: '#/components/parameters/ProxyPath'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
    post:
      operationId: proxyPostLegacy
      tags: [Proxy]
      summary: Proxy a POST to the provider (deprecated prefix)
      deprecated: true
      description: |
        Same as `POST /v1/{path}`; the `/v1/proxy` prefix is cut before the
        provider path is built. See the `/v1/{path}` description for
        guardrail behaviour.
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      requestBody:
        $ref: '#/components/requestBodies/ProxyBody'
      responses:
        '200':
          $ref: '#/components/responses/ProxySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '446':
          $ref: '#/components/responses/GuardrailDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/{path}:
    parameters:
      - $ref: '#/components/parameters/ProxyPath'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
    get:
      operationId: proxyGet
      tags: [Proxy]
      summary: Proxy a GET to the provider
      description: |
        Catch-all for any `/v1` path not listed above (the path may contain
        `/`; `/v1/realtime` is excluded). The path after `/v1` is appended to
        the provider's base URL. Client headers other than `x-portkey-*`,
        `content-length` and `expect` are forwarded.
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      responses:
        '200':
          $ref: '#/components/responses/ProxySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'
    post:
      operationId: proxyPost
      tags: [Proxy]
      summary: Proxy a POST to the provider
      description: |
        Catch-all for any `/v1` POST path not listed above. JSON,
        multipart and `audio/*` bodies are accepted.

        **Guardrails on proxy routes fail closed.** When the resolved config
        has guardrails or hooks on any target, a proxied request that is
        recognisably Chat Completions, Completions, Messages, Responses or
        Embeddings (path suffix and body shape) runs the hooks for that
        endpoint type (446 on deny). Any other proxied request is refused
        with a 400 `unsupported_guardrail` before any upstream is called.
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      requestBody:
        $ref: '#/components/requestBodies/ProxyBody'
      responses:
        '200':
          $ref: '#/components/responses/ProxySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '446':
          $ref: '#/components/responses/GuardrailDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'
    delete:
      operationId: proxyDelete
      tags: [Proxy]
      summary: Proxy a DELETE to the provider
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      responses:
        '200':
          $ref: '#/components/responses/ProxySuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

components:
  securitySchemes:
    ProviderBearer:
      type: http
      scheme: bearer
      description: |
        The provider's API key (`Authorization: Bearer <key>`), forwarded to
        the provider. Not a gateway credential.
    ProviderApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Anthropic-style provider API key, forwarded to the provider.
    MetricsToken:
      type: http
      scheme: bearer
      description: The `PS_METRICS_TOKEN` value, required on `/metrics` when it is set.
    McpToken:
      type: http
      scheme: bearer
      description: |
        The `PS_MCP_TOKEN` value. Required on `/v1/mcp/{server}`; without it
        the route answers 503 unless `PS_MCP_ALLOW_UNAUTHENTICATED=true`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Provider object id (file, batch or response)
      schema:
        type: string
    JobIdPath:
      name: jobId
      in: path
      required: true
      description: Provider fine-tuning job id
      schema:
        type: string
    ProxyPath:
      name: path
      in: path
      required: true
      description: Provider path, appended to the provider base URL. May contain `/`.
      schema:
        type: string
      example: chat/completions
    AnthropicVersion:
      name: anthropic-version
      in: header
      required: false
      description: Anthropic API version. On `GET /v1/models` it selects the Anthropic list shape.
      schema:
        type: string
      example: '2023-06-01'

    # --- Prompt Shields headers (x-ps-*) ---------------------------------
    XPsRoute:
      name: x-ps-route
      in: header
      required: false
      description: |
        Pins a routing group, bypassing the cost-aware router's hints
        (needs `PS_ROUTER_ENABLED=true`). An unknown group falls back to the
        default group.
        Never sent upstream.
      schema:
        type: string
      example: frontier
      x-ps-sent-upstream: never
    XPsQuality:
      name: x-ps-quality
      in: header
      required: false
      description: Routing intent; the router maps it to a model group. Never sent upstream.
      schema:
        type: string
        enum: [draft, balanced, critical]
      x-ps-sent-upstream: never
    XPsMaxCost:
      name: x-ps-max-cost
      in: header
      required: false
      description: |
        Per-call cost ceiling in USD. The router downgrades within the group
        to stay under it. Never sent upstream.
      schema:
        type: string
        pattern: '^[0-9]*\.?[0-9]+$'
      example: '0.02'
      x-ps-sent-upstream: never
    XPsCache:
      name: x-ps-cache
      in: header
      required: false
      description: |
        Per-request cache mode, overriding `PS_CACHE_DEFAULT`: `on`, `off`,
        or `refresh` (serve from upstream and overwrite the entry). Never sent
        upstream.
      schema:
        type: string
        enum: ['on', 'off', refresh]
      x-ps-sent-upstream: never
    XPsBusinessUnit:
      name: x-ps-business-unit
      in: header
      required: false
      description: Business unit for telemetry, OTel spans and the `business_unit` metrics label. Never sent upstream.
      schema:
        type: string
      example: HR
      x-ps-sent-upstream: never
    XPsUseCase:
      name: x-ps-use-case
      in: header
      required: false
      description: Use-case name for telemetry and OTel spans. Never sent upstream.
      schema:
        type: string
      example: interview-screening
      x-ps-sent-upstream: never
    XPsOwner:
      name: x-ps-owner
      in: header
      required: false
      description: Owner email for telemetry and OTel spans. Never sent upstream.
      schema:
        type: string
        format: email
      x-ps-sent-upstream: never
    XPsDataClassification:
      name: x-ps-data-classification
      in: header
      required: false
      description: Data classification for telemetry and OTel spans. Never sent upstream.
      schema:
        type: string
      example: confidential
      x-ps-sent-upstream: never
    XPsEnvironment:
      name: x-ps-environment
      in: header
      required: false
      description: |
        Deployment environment for telemetry, the `environment` metrics
        label and the OTel `deployment.environment.name` attribute. Never sent
        upstream.
      schema:
        type: string
      example: production
      x-ps-sent-upstream: never

    # --- Portkey-compatible headers (x-portkey-*), never sent upstream ----
    XPortkeyProvider:
      name: x-portkey-provider
      in: header
      required: false
      description: |
        Target provider slug (e.g. `openai`, `anthropic`, `azure-openai`,
        `bedrock`, `vertex-ai`). Either this or `x-portkey-config` is
        required on every route except `/`, `/v1/health` and `/metrics`
        (400 otherwise). Never sent upstream.
      schema:
        type: string
      example: openai
      x-ps-sent-upstream: never
    XPortkeyConfig:
      name: x-portkey-config
      in: header
      required: false
      description: |
        Gateway config as JSON: targets, fallback / load-balance strategy,
        retries, timeouts, cache, guardrails and hooks, and provider
        credentials. Validated on entry (400 `Invalid config passed`). Never
        sent upstream. Treat it as a secret when it carries keys.
      schema:
        type: string
        contentMediaType: application/json
      example: '{"provider":"openai","retry":{"attempts":2}}'
      x-ps-sent-upstream: never
    XPortkeyCustomHost:
      name: x-portkey-custom-host
      in: header
      required: false
      description: |
        Override the provider base URL. Private, link-local, metadata and
        internal hosts are refused unless listed in `TRUSTED_CUSTOM_HOSTS`
        (400 `Invalid custom host`). Never sent upstream.
      schema:
        type: string
        format: uri
      x-ps-sent-upstream: never
    XPortkeyForwardHeaders:
      name: x-portkey-forward-headers
      in: header
      required: false
      description: |
        Comma-separated client header names to forward to the provider
        (cannot name itself). Never sent upstream itself.
      schema:
        type: string
      example: x-request-id,openai-organization
      x-ps-sent-upstream: never
    XPortkeyRequestTimeout:
      name: x-portkey-request-timeout
      in: header
      required: false
      description: Upstream timeout in milliseconds; a timeout returns 408. Never sent upstream.
      schema:
        type: string
        pattern: '^[0-9]+$'
      x-ps-sent-upstream: never
    XPortkeyTraceId:
      name: x-portkey-trace-id
      in: header
      required: false
      description: Trace id, echoed in the response and attached to logs. Never sent upstream.
      schema:
        type: string
      x-ps-sent-upstream: never
    XPortkeyMetadata:
      name: x-portkey-metadata
      in: header
      required: false
      description: JSON object of string metadata for logs and hooks. Never sent upstream.
      schema:
        type: string
        contentMediaType: application/json
      x-ps-sent-upstream: never
    XPortkeyStrictOpenAiCompliance:
      name: x-portkey-strict-open-ai-compliance
      in: header
      required: false
      description: |
        `false` keeps provider-specific response fields (for example
        reasoning content) that strict OpenAI compliance would drop. Never
        sent upstream.
      schema:
        type: string
        enum: ['true', 'false']
      x-ps-sent-upstream: never
    XPortkeyDefaultInputGuardrails:
      name: x-portkey-default-input-guardrails
      in: header
      required: false
      description: JSON array of guardrails run before every request, in addition to the config's. Never sent upstream.
      schema:
        type: string
        contentMediaType: application/json
      x-ps-sent-upstream: never
    XPortkeyDefaultOutputGuardrails:
      name: x-portkey-default-output-guardrails
      in: header
      required: false
      description: JSON array of guardrails run on every response, in addition to the config's. Never sent upstream.
      schema:
        type: string
        contentMediaType: application/json
      x-ps-sent-upstream: never
    XPortkeyMessagesViaResponses:
      name: x-portkey-messages-via-responses
      in: header
      required: false
      description: |
        `true` sends `/v1/messages` for `openai` / `azure-openai` targets
        through the Responses API; `false` opts out of the model-name
        detection. The config key `messages_via_responses` wins. Never sent
        upstream.
      schema:
        type: string
        enum: ['true', 'false']
      x-ps-sent-upstream: never
    XPortkeyAnthropicBeta:
      name: x-portkey-anthropic-beta
      in: header
      required: false
      description: Anthropic beta flags, sent to Anthropic as `anthropic-beta`. The `x-portkey-` header itself is not sent.
      schema:
        type: string
      x-ps-sent-upstream: never
    XPortkeyFilePurpose:
      name: x-portkey-file-purpose
      in: header
      required: false
      description: File purpose for providers whose upload API needs it outside the form. Never sent upstream.
      schema:
        type: string
      example: batch
      x-ps-sent-upstream: never

  headers:
    TraceId:
      description: The request's trace id
      schema:
        type: string
    CacheStatus:
      description: Gateway cache result, e.g. `HIT`, `MISS`, `REFRESH` or `DISABLED`
      schema:
        type: string
    RetryAttemptCount:
      description: Number of upstream retries made for the served target
      schema:
        type: string
    LastUsedOptionIndex:
      description: Index of the config target that served the request (fallback / load balance)
      schema:
        type: string

  requestBodies:
    ProxyBody:
      required: false
      description: Any body the provider path accepts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassThroughObject'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/MultipartPassThrough'
        audio/*:
          schema:
            type: string
            contentMediaType: application/octet-stream

  responses:
    McpError:
      description: JSON-RPC error from the gateway or the MCP server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonRpcMessage'
    ProxySuccess:
      description: The provider's response, passed through
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PassThroughObject'
        application/octet-stream:
          schema:
            type: string
            contentMediaType: application/octet-stream
    HooksFailed:
      description: |
        The response succeeded, but at least one guardrail or hook that is
        not set to deny failed. The body is the normal success body plus
        `hook_results` (non-streaming); streams keep their body.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PassThroughObject'
              - type: object
                properties:
                  hook_results:
                    $ref: '#/components/schemas/HookResults'
    BadRequest:
      description: |
        Rejected by the gateway before or instead of an upstream call:
        missing `x-portkey-provider` / `x-portkey-config`, an invalid
        provider, config, custom host or content type, a router error, or a
        proxied request that guardrails cannot inspect
        (`error.code: unsupported_guardrail`, see `POST /v1/{path}`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/GatewayFailure'
              - $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingProvider:
              summary: No provider or config
              value:
                status: failure
                message: Either x-portkey-config or x-portkey-provider header is required
            unsupportedGuardrail:
              summary: Proxy guardrail fail-closed
              value:
                error:
                  message: >-
                    Guardrails are configured for this target but cannot be
                    applied to this proxied request (unrecognised path). Use
                    the matching /v1 endpoint, or a target without guardrails.
                  type: invalid_request_error
                  param: null
                  code: unsupported_guardrail
    GuardrailDenied:
      description: |
        A guardrail or hook with `deny: true` failed, before the request
        (no upstream call) or on the response. `hook_results` lists each
        check's verdict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HooksFailedError'
    RequestTimeout:
      description: The upstream call exceeded the request timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LengthRequired:
      description: |
        `MAX_FILE_PAYLOAD_SIZE_IN_MB` is set and a `multipart/form-data`
        (or `application/x-www-form-urlencoded`) POST has no valid
        `content-length`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayFailure'
    PayloadTooLarge:
      description: |
        The declared `content-length` exceeds `MAX_JSON_PAYLOAD_SIZE_IN_MB`
        (JSON bodies) or `MAX_FILE_PAYLOAD_SIZE_IN_MB` (multipart and
        form-encoded uploads).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayFailure'
    InternalError:
      description: Unexpected gateway error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GatewayFailure'
    UpstreamRedirect:
      description: |
        The provider answered with a 3xx. The gateway never follows upstream
        redirects (they would re-send the body and credentials to another
        host) and returns this error instead, without the `Location`. A 502
        can also be a provider's own 502, passed through.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream answered with a redirect (302), which the gateway does not follow
              type: upstream_redirect
              param: null
              code: null
    UpstreamError:
      description: |
        Provider error, passed through with the provider's status. Errors
        from non-OpenAI providers are mapped to the OpenAI error shape on
        the unified endpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found (also returned by `/metrics` when metrics are disabled)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'

  schemas:
    JsonRpcMessage:
      type: object
      description: One JSON-RPC 2.0 message (MCP). Only the fields the gateway reads are listed.
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: number
            - type: 'null'
        method:
          type: string
        params:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
      additionalProperties: true
    PassThroughObject:
      type: object
      description: |
        A body the gateway passes through. See the upstream specification
        for the endpoint (linked in this document's description).
      additionalProperties: true
    MultipartPassThrough:
      type: object
      description: Multipart form passed through to the provider. See the upstream specification.
      additionalProperties: true

    HealthResponse:
      type: object
      required: [status, message, version]
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          example: Server is healthy
        version:
          type: string
          description: Gateway package version
          example: 1.15.2

    GatewayFailure:
      type: object
      description: Error produced by the gateway itself
      required: [status, message]
      properties:
        status:
          type: string
          const: failure
        message:
          type: string
        errors:
          type: array
          description: Config validation issues (`Invalid config passed`)
          items:
            type: string
    ErrorResponse:
      type: object
      description: OpenAI-shaped error
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            type:
              type: [string, 'null']
              description: e.g. `invalid_request_error`, `hooks_failed`, `upstream_redirect`
            param:
              type: [string, 'null']
            code:
              type: [string, 'null']
              description: e.g. `unsupported_guardrail`
          additionalProperties: true
      additionalProperties: true
    HookResults:
      type: object
      properties:
        before_request_hooks:
          type: array
          items:
            $ref: '#/components/schemas/HookResult'
        after_request_hooks:
          type: array
          items:
            $ref: '#/components/schemas/HookResult'
    HookResult:
      type: object
      description: One hook's verdict
      properties:
        id:
          type: string
        verdict:
          type: boolean
        deny:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              verdict:
                type: boolean
              error:
                type: ['object', 'null']
              data:
                type: ['object', 'null']
            additionalProperties: true
      additionalProperties: true
    HooksFailedError:
      type: object
      required: [error, hook_results]
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
              const: hooks_failed
            param:
              type: 'null'
            code:
              type: 'null'
        hook_results:
          $ref: '#/components/schemas/HookResults'
    NotFoundResponse:
      type: object
      properties:
        message:
          type: string
          const: Not Found
        ok:
          type: boolean
          const: false

    # --- Chat Completions (OpenAI) subset ---------------------------------
    ChatMessage:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool, function]
        content:
          description: Text, or an array of content parts (text, image_url, input_audio, file)
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: 'null'
        name:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        tool_call_id:
          type: string
      additionalProperties: true
    ToolCall:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
      additionalProperties: true
    ChatCompletionRequest:
      type: object
      description: |
        Subset of OpenAI `CreateChatCompletionRequest`. Every other field
        passes through.
      required: [messages]
      properties:
        model:
          type: string
          description: Model id. Optional when the config sets `override_params.model`; the router may replace it.
          example: gpt-4o-mini
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
        stream_options:
          type: object
          properties:
            include_usage:
              type: boolean
        temperature:
          type: number
        top_p:
          type: number
        max_tokens:
          type: integer
        max_completion_tokens:
          type: integer
        n:
          type: integer
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        response_format:
          type: object
          additionalProperties: true
        reasoning_effort:
          type: string
        user:
          type: string
      additionalProperties: true
    Usage:
      type: object
      description: OpenAI usage; detail objects are kept when the provider reports them
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        prompt_tokens_details:
          type: object
          additionalProperties: true
        completion_tokens_details:
          type: object
          additionalProperties: true
      additionalProperties: true
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        provider:
          type: string
          description: Gateway addition, the provider that served the call
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: [string, 'null']
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
      additionalProperties: true

    CompletionRequest:
      type: object
      description: Subset of OpenAI `CreateCompletionRequest`.
      required: [prompt]
      properties:
        model:
          type: string
        prompt:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        max_tokens:
          type: integer
        temperature:
          type: number
        stream:
          type: boolean
      additionalProperties: true
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          const: text_completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              text:
                type: string
              finish_reason:
                type: [string, 'null']
            additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
      additionalProperties: true

    # --- Responses (OpenAI) subset -----------------------------------------
    ResponsesRequest:
      type: object
      description: Subset of OpenAI `CreateResponse`.
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        instructions:
          type: string
        stream:
          type: boolean
        background:
          type: boolean
        store:
          type: boolean
        previous_response_id:
          type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        reasoning:
          type: object
          additionalProperties: true
        max_output_tokens:
          type: integer
      additionalProperties: true
    ResponseObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          const: response
        created_at:
          type: integer
        status:
          type: string
          description: e.g. `completed`, `in_progress`, `cancelled`, `failed`
        model:
          type: string
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            total_tokens:
              type: integer
            input_tokens_details:
              type: object
              additionalProperties: true
            output_tokens_details:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true

    # --- Messages (Anthropic) subset ---------------------------------------
    MessagesRequest:
      type: object
      description: Subset of Anthropic `POST /v1/messages`.
      required: [messages]
      properties:
        model:
          type: string
          example: claude-sonnet-4-5
        max_tokens:
          type: integer
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
            additionalProperties: true
        stream:
          type: boolean
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
        temperature:
          type: number
        stop_sequences:
          type: array
          items:
            type: string
      additionalProperties: true
    MessagesResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          const: message
        role:
          type: string
          const: assistant
        model:
          type: string
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        stop_reason:
          type: [string, 'null']
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            cache_read_input_tokens:
              type: [integer, 'null']
            cache_creation_input_tokens:
              type: [integer, 'null']
          additionalProperties: true
      additionalProperties: true
    CountTokensResponse:
      type: object
      required: [input_tokens]
      properties:
        input_tokens:
          type: integer

    # --- Embeddings / rerank -----------------------------------------------
    EmbeddingRequest:
      type: object
      description: Subset of OpenAI `CreateEmbeddingRequest`.
      required: [input]
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items: {}
        dimensions:
          type: integer
        encoding_format:
          type: string
          enum: [float, base64]
      additionalProperties: true
    EmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          const: list
        model:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                const: embedding
              index:
                type: integer
              embedding:
                oneOf:
                  - type: array
                    items:
                      type: number
                  - type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
      additionalProperties: true
    RerankRequest:
      type: object
      description: Cohere-style rerank request.
      required: [query, documents]
      properties:
        model:
          type: string
          example: rerank-v3.5
        query:
          type: string
        documents:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        top_n:
          type: integer
        return_documents:
          type: boolean
      additionalProperties: true
    RerankResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        results:
          type: array
          items:
            type: object
            required: [index, relevance_score]
            properties:
              index:
                type: integer
              relevance_score:
                type: number
              document:
                type: object
                additionalProperties: true
        usage:
          type: object
          additionalProperties: true
      additionalProperties: true

    # --- Images / audio ----------------------------------------------------
    ImageGenerationRequest:
      type: object
      description: Subset of OpenAI `CreateImageRequest`.
      required: [prompt]
      properties:
        model:
          type: string
        prompt:
          type: string
        n:
          type: integer
        size:
          type: string
        quality:
          type: string
        response_format:
          type: string
          enum: [url, b64_json]
      additionalProperties: true
    ImagesResponse:
      type: object
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              revised_prompt:
                type: string
            additionalProperties: true
      additionalProperties: true
    SpeechRequest:
      type: object
      description: Subset of OpenAI `CreateSpeechRequest`.
      required: [input]
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        response_format:
          type: string
      additionalProperties: true

    # --- Models -------------------------------------------------------------
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required: [id, object]
            properties:
              id:
                type: string
              object:
                type: string
                const: model
              created:
                type: integer
              owned_by:
                type: string
    AnthropicModelList:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                const: model
              id:
                type: string
              display_name:
                type: string
              created_at:
                type: string
                format: date-time
        has_more:
          type: boolean
        first_id:
          type: [string, 'null']
        last_id:
          type: [string, 'null']
