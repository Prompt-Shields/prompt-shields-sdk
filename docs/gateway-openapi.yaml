openapi: 3.1.0
info:
  title: Prompt Shields AI Gateway
  version: 1.15.2
  description: |
    HTTP API of the Prompt Shields AI Gateway (`gateway/`, a fork of the
    Portkey AI Gateway). The gateway exposes OpenAI-compatible and
    Anthropic-compatible endpoints and routes each call to the provider
    chosen by the `x-portkey-provider` or `x-portkey-config` header.

    **Scope of this document.** Request and response bodies are a pinned,
    minimal subset: the fields the gateway itself reads, writes or
    translates between providers. Every other field passes through to the
    provider unchanged (`additionalProperties: true`). For the full bodies
    see the upstream specifications:
    - OpenAI: https://github.com/openai/openai-openapi (Chat Completions,
      Completions, Responses, Embeddings, Images, Audio, Files, Batches,
      Fine-tuning, Models);
    - Anthropic Messages: https://docs.anthropic.com/en/api/messages;
    - Cohere Rerank v2: https://docs.cohere.com/reference/rerank.

    **Authentication.** Apart from the MCP proxy (`/v1/mcp/{server}`,
    bearer `PS_MCP_TOKEN`), the gateway has no client authentication of its
    own. The `Authorization` (or `x-api-key`) header carries the
    *provider's* API key and is forwarded to the provider; credentials can
    also travel inside `x-portkey-config`. Put the gateway behind an API
    gateway such as Kong for client authentication, and strip the
    provider-credential headers listed below at that layer if clients must
    not choose their own credentials.

    **Headers that are not documented on purpose.** Provider credential
    headers (`x-portkey-aws-secret-access-key`, `x-portkey-aws-session-token`,
    `x-portkey-azure-ad-token`, `x-portkey-azure-entra-client-secret`,
    `x-portkey-vertex-service-account-json`, `x-portkey-oracle-private-key`,
    `x-portkey-oauth-client-secret` and the other per-provider key, role and
    service-account headers in `constructConfigFromRequestHeaders`) are
    accepted but are not part of this contract.

    **What reaches the provider.**
    - `x-portkey-*` headers are never forwarded upstream: unified endpoints
      build provider headers from the resolved config, and the proxy routes
      drop every `x-portkey-*` header.
    - `x-ps-*` headers are read by the gateway (routing, cache, telemetry,
      metrics) and are never sent upstream, on any route, in any case.
    - On the proxy routes (`/v1/proxy/{path}` and the `/v1/{path}`
      catch-all) all other client headers are forwarded.
    - On every route a header named in `x-portkey-forward-headers` is
      forwarded, except `x-ps-*` headers.
  license:
    name: MIT
    url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/gateway/LICENSE
  contact:
    name: Prompt Shields Developer Support
    email: partners@promptshields.io

# One server only: deck file openapi2kong turns every server into a target of
# one Kong upstream, so a second entry would load-balance across both.
servers:
  - url: '{gatewayUrl}'
    description: Your gateway (the Node server listens on port 8787 by default)
    variables:
      gatewayUrl:
        default: http://localhost:8787

tags:
  - name: Chat
    description: OpenAI Chat Completions and legacy Completions
  - name: Responses
    description: OpenAI Responses API
  - name: Messages
    description: Anthropic Messages API
  - name: Embeddings
    description: Embeddings and rerank
  - name: Images
    description: Image generation and editing
  - name: Audio
    description: Speech, transcription and translation
  - name: OCR
    description: Document OCR
  - name: Files
    description: Provider file storage
  - name: Batches
    description: Provider batch jobs
  - name: Fine-tuning
    description: Provider fine-tuning jobs
  - name: Models
    description: Model listing
  - name: Realtime
    description: Realtime API over WebSocket
  - name: MCP
    description: Enforcing MCP proxy to configured MCP servers
  - name: Proxy
    description: Pass-through to any provider path
  - name: Operations
    description: Health and Prometheus metrics

paths:
  /:
    get:
      operationId: getRoot
      tags: [Operations]
      summary: Greeting
      description: Plain-text greeting. No auth and no upstream call.
      security: []
      responses:
        '200':
          description: Greeting
          content:
            text/plain:
              schema:
                type: string
              example: AI Gateway says hey!

  /v1/health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Liveness check
      description: |
        Proves the process is serving. No auth and no upstream call, so it
        is safe for liveness and readiness probes.
      security: []
      responses:
        '200':
          description: Gateway is serving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      operationId: getMetrics
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        Prometheus text exposition. Off unless `PS_METRICS_ENABLED=true`
        (404 otherwise). When `PS_METRICS_TOKEN` is set, the request must
        send it as a bearer token. Labels never carry prompt content, keys
        or user identifiers.
      security:
        - MetricsToken: []
        - {}
      responses:
        '200':
          description: Metrics in Prometheus text format 0.0.4
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: '`PS_METRICS_TOKEN` is set and the bearer token is missing or wrong'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayFailure'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/chat/completions:
    parameters:
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
      - $ref: '#/components/parameters/XPortkeyRequestTimeout'
      - $ref: '#/components/parameters/XPortkeyTraceId'
      - $ref: '#/components/parameters/XPortkeyMetadata'
      - $ref: '#/components/parameters/XPortkeyStrictOpenAiCompliance'
      - $ref: '#/components/parameters/XPortkeyDefaultInputGuardrails'
      - $ref: '#/components/parameters/XPortkeyDefaultOutputGuardrails'
      - $ref: '#/components/parameters/XPsRoute'
      - $ref: '#/components/parameters/XPsQuality'
      - $ref: '#/components/parameters/XPsMaxCost'
      - $ref: '#/components/parameters/XPsCache'
      - $ref: '#/components/parameters/XPsBusinessUnit'
      - $ref: '#/components/parameters/XPsUseCase'
      - $ref: '#/components/parameters/XPsOwner'
      - $ref: '#/components/parameters/XPsDataClassification'
      - $ref: '#/components/parameters/XPsEnvironment'
    post:
      operationId: createChatCompletion
      tags: [Chat]
      summary: Create a chat completion
      description: |
        OpenAI Chat Completions, translated to the target provider's API.
        With `stream: true` the response is a server-sent event stream of
        `chat.completion.chunk` objects.
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion, or an event stream when `stream` is true
          headers:
            x-portkey-trace-id:
              $ref: '#/components/headers/TraceId'
            x-portkey-cache-status:
              $ref: '#/components/headers/CacheStatus'
            x-portkey-retry-attempt-count:
              $ref: '#/components/headers/RetryAttemptCount'
            x-portkey-last-used-option-index:
              $ref: '#/components/headers/LastUsedOptionIndex'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: '`data: <chat.completion.chunk JSON>` events, ending with `data: [DONE]`'
        '246':
          $ref: '#/components/responses/HooksFailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '446':
          $ref: '#/components/responses/GuardrailDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/completions:
    parameters:
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
      - $ref: '#/components/parameters/XPortkeyRequestTimeout'
      - $ref: '#/components/parameters/XPortkeyTraceId'
      - $ref: '#/components/parameters/XPortkeyMetadata'
      - $ref: '#/components/parameters/XPortkeyDefaultInputGuardrails'
      - $ref: '#/components/parameters/XPortkeyDefaultOutputGuardrails'
      - $ref: '#/components/parameters/XPsRoute'
      - $ref: '#/components/parameters/XPsQuality'
      - $ref: '#/components/parameters/XPsMaxCost'
      - $ref: '#/components/parameters/XPsCache'
      - $ref: '#/components/parameters/XPsBusinessUnit'
      - $ref: '#/components/parameters/XPsUseCase'
      - $ref: '#/components/parameters/XPsOwner'
      - $ref: '#/components/parameters/XPsDataClassification'
      - $ref: '#/components/parameters/XPsEnvironment'
    post:
      operationId: createCompletion
      tags: [Chat]
      summary: Create a (legacy) text completion
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Completion, or an event stream when `stream` is true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
            text/event-stream:
              schema:
                type: string
        '246':
          $ref: '#/components/responses/HooksFailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '446':
          $ref: '#/components/responses/GuardrailDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/responses:
    parameters:
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
      - $ref: '#/components/parameters/XPortkeyRequestTimeout'
      - $ref: '#/components/parameters/XPortkeyTraceId'
      - $ref: '#/components/parameters/XPortkeyMetadata'
      - $ref: '#/components/parameters/XPortkeyDefaultInputGuardrails'
      - $ref: '#/components/parameters/XPortkeyDefaultOutputGuardrails'
      - $ref: '#/components/parameters/XPsRoute'
      - $ref: '#/components/parameters/XPsQuality'
      - $ref: '#/components/parameters/XPsMaxCost'
      - $ref: '#/components/parameters/XPsCache'
      - $ref: '#/components/parameters/XPsBusinessUnit'
      - $ref: '#/components/parameters/XPsUseCase'
      - $ref: '#/components/parameters/XPsOwner'
      - $ref: '#/components/parameters/XPsDataClassification'
      - $ref: '#/components/parameters/XPsEnvironment'
    post:
      operationId: createResponse
      tags: [Responses]
      summary: Create a model response
      description: |
        OpenAI Responses API. Served natively by providers that have it and
        through the gateway's Responses adapter for chat-only providers.
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Response object, or an event stream when `stream` is true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseObject'
            text/event-stream:
              schema:
                type: string
        '246':
          $ref: '#/components/responses/HooksFailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '446':
          $ref: '#/components/responses/GuardrailDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/responses/input_tokens:
    parameters:
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
    post:
      operationId: countResponseInputTokens
      tags: [Responses]
      summary: Count input tokens for a Responses request
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Token count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassThroughObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/responses/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
    get:
      operationId: getResponse
      tags: [Responses]
      summary: Retrieve a stored response
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      responses:
        '200':
          description: Response object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'
    delete:
      operationId: deleteResponse
      tags: [Responses]
      summary: Delete a stored response
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassThroughObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/responses/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
    post:
      operationId: cancelResponse
      tags: [Responses]
      summary: Cancel a background response
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      responses:
        '200':
          description: The cancelled response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/responses/{id}/input_items:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
    get:
      operationId: listResponseInputItems
      tags: [Responses]
      summary: List the input items of a stored response
      security:
        - ProviderBearer: []
        - ProviderApiKey: []
        - {}
      responses:
        '200':
          description: List of input items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassThroughObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/messages:
    parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
      - $ref: '#/components/parameters/XPortkeyRequestTimeout'
      - $ref: '#/components/parameters/XPortkeyTraceId'
      - $ref: '#/components/parameters/XPortkeyMetadata'
      - $ref: '#/components/parameters/XPortkeyDefaultInputGuardrails'
      - $ref: '#/components/parameters/XPortkeyDefaultOutputGuardrails'
      - $ref: '#/components/parameters/XPortkeyAnthropicBeta'
      - $ref: '#/components/parameters/XPortkeyMessagesViaResponses'
      - $ref: '#/components/parameters/XPsRoute'
      - $ref: '#/components/parameters/XPsQuality'
      - $ref: '#/components/parameters/XPsMaxCost'
      - $ref: '#/components/parameters/XPsCache'
      - $ref: '#/components/parameters/XPsBusinessUnit'
      - $ref: '#/components/parameters/XPsUseCase'
      - $ref: '#/components/parameters/XPsOwner'
      - $ref: '#/components/parameters/XPsDataClassification'
      - $ref: '#/components/parameters/XPsEnvironment'
    post:
      operationId: createMessage
      tags: [Messages]
      summary: Create a message (Anthropic Messages API)
      description: |
        Anthropic Messages. Served natively by Anthropic, Bedrock, Vertex,
        Claude Platform on AWS and Bedrock Mantle, and translated for
        OpenAI-compatible providers (Responses-only OpenAI models go through
        the Responses API).
      security:
        - ProviderApiKey: []
        - ProviderBearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesRequest'
      responses:
        '200':
          description: Message, or an event stream when `stream` is true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
            text/event-stream:
              schema:
                type: string
                description: Anthropic stream events (`message_start` ... `message_stop`)
        '246':
          $ref: '#/components/responses/HooksFailed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '446':
          $ref: '#/components/responses/GuardrailDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/messages/count_tokens:
    parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
    post:
      operationId: countMessageTokens
      tags: [Messages]
      summary: Count tokens for a Messages request
      security:
        - ProviderApiKey: []
        - ProviderBearer: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesRequest'
      responses:
        '200':
          description: Token count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountTokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '502':
          $ref: '#/components/responses/UpstreamRedirect'
        default:
          $ref: '#/components/responses/UpstreamError'

  /v1/embeddings:
    parameters:
      - $ref: '#/components/parameters/XPortkeyProvider'
      - $ref: '#/components/parameters/XPortkeyConfig'
      - $ref: '#/components/parameters/XPortkeyCustomHost'
      - $ref: '#/components/parameters/XPortkeyForwardHeaders'
      - $ref: '#/components/parameters/XPortkeyRequestTimeout'
      - $ref: '#/components/parameters/XPortkeyTraceId'
      - $ref: '#/components/parameters/XPortkeyMetadata'
      - $ref: '#/components/parameters/XPortkeyDefaultInputGuardrails'
      - $ref: '#/components/parameters/XPsRoute'
      - $ref: '#/components/parameters/XPsCache'
      - $ref: '#/components/parameters/XPsBusinessUnit'
      - $ref: '#/components/parameters/XPsUseCase'
      - $ref: '#/components/parameters/XPsOwner'
      - $ref: '#/components/parameters/XPsDataClassification'
      - $ref: '#/components/parameters/XPsEnvironment'
    post:
      operationId: createEmbedding
      tags: [Embeddings]
      summary: Create embeddings
      security:
