      description: Requires `learner:read`.
      security:
        - OAuth2: [learner:read]
        - PartnerApiKey: []
      responses:
        '200':
          description: The recommendation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LearnerRecommendation'
                required: [data]
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
