openapi: 3.1.0
info:
  title: Prompt Shields Partner API
  version: 1.0.0
  description: |
    The Prompt Shields Partner API provides read access to the AI Asset Registry.
    A few write routes (attestations, provider credentials) need scopes that
    are never granted by default. The tenant admin routes for webhooks and
    provider credentials (`/api/v1/admin`) take the tenant API key instead.

    Enterprise Architecture tools (Ardoq, LeanIX, ServiceNow) use this API to pull
    discovered AI assets, data flows, risk mappings, and usage metadata into their
    platforms for governance and strategic alignment.
  contact:
    name: Prompt Shields Developer Support
    email: partners@promptshields.io
    url: https://promptshields.io/partners
  license:
    name: Proprietary
    url: https://promptshields.io/terms

servers:
  - url: https://api.promptshields.io
    description: Production
  - url: https://sandbox.api.promptshields.io
    description: Sandbox (synthetic data)

security:
  - OAuth2: [assets:read]
  - PartnerApiKey: []

tags:
  - name: Assets
    description: AI asset discovery and registry
  - name: Taxonomy
    description: AI vendors, models, and business units
  - name: Sync
    description: Delta feeds and bulk export for EA tool integration
  - name: Auth
    description: OAuth 2.0 token management
  - name: Provider Credentials
    description: |
      Write-only provider admin keys for the usage pull, and links from
      provider key ids to SDK key fingerprints. The same routes are served
      under `/partner/v1` (scope `provider-credentials:manage`) and under
      `/api/v1/admin` (tenant API key). Every call is audited (path and
      status, never the body).
  - name: Webhooks
    description: |
      Tenant admin API (`/api/v1/admin/webhooks`, tenant API key) for
      partner change webhooks: subscriptions, secret rotation and the
      delivery (dead-letter) view.

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.0 Client Credentials flow. Exchange your `client_id` and `client_secret`
        for a short-lived access token.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            assets:read: Read AI assets, vendors, models, business units
            data-flows:read: Read data flow lineage per asset
            risks:read: Read risk mappings per asset
            usage:read: Read aggregated usage statistics
            export:read: Access bulk export endpoint
            changes:read: Access delta feed endpoint
            webhooks:manage: Manage webhook subscriptions (never granted by default)
            attestations:write: Record human attestations, including retiring and un-retiring assets (never granted by default)
            provider-credentials:manage: Store, rotate and delete provider admin keys and key fingerprint links (never granted by default)
            audit:read: Receive the tenant's admin audit trail as `audit.*` webhook events (never granted by default)
            registry:read: Legacy Phase 1 scope; equals the six read scopes above

    PartnerApiKey:
      type: http
      scheme: bearer
      description: |
        Fallback authentication using a Partner API Key. Use this when OAuth
        is not supported by your integration tool (e.g., Ardoq Integration Builder).

        Pass your API key as a Bearer token:
        ```
        Authorization: Bearer ps-pk-your-key-here
        ```

    TenantApiKey:
      type: http
      scheme: bearer
      description: |
        The tenant's own API key (the one the SDK ingests with), for the
        tenant admin routes under `/api/v1/admin`. Partners never hold it.

  schemas:
    AIAsset:
      type: object
      description: A discovered AI use case within the organization
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUIDv7, time-sortable)
          example: "019e1a2b-3c4d-7000-8000-000000000001"
        vendor:
          type: string
          description: AI provider name
          example: "openai"
          enum: [openai, anthropic, google, microsoft, meta, cohere, mistral, custom]
        model:
          type: string
          description: Specific model identifier
          example: "gpt-4o"
          nullable: true
        use_case_name:
          type: string
          description: Business name for this AI use case
          example: "interview-screening"
          nullable: true
        business_unit:
          type: string
          description: Organizational unit using this AI
          example: "HR"
          nullable: true
        owner_email:
          type: string
          format: email
          description: Responsible person's email
          example: "jane.doe@acme.com"
          nullable: true
        environment:
          type: string
          description: Deployment environment
          enum: [production, staging, dev]
          example: "production"
          nullable: true
        region:
          type: string
          description: Cloud region the asset is deployed in, from the cloud inventory platform signal
          example: "swedencentral"
          nullable: true
        modality:
          type: string
          description: What the asset works on, from the first telemetry event that reported it (the gateway sets it from the endpoint; chat, embeddings and rerank are `text`, OCR is `document`). Null when no event reported a known one; other values are dropped at ingest and counted as `modality:invalid` in telemetry loss.
          enum: [text, image, audio, document, null]
          example: "audio"
          nullable: true
        status:
          type: string
          description: Governance status
          enum: [active, deprecated, under_review]
          example: "active"
        data_classification:
          type: string
          description: Highest data sensitivity level
          enum: [public, internal, confidential, restricted]
          example: "confidential"
          nullable: true
        discovery_source:
          type: array
          items:
            type: string
            enum: [sdk, gateway, browser_extension, macos_app, platform_signal, survey, otel, code_scan, kong]
          description: How this asset was discovered (multiple sources = higher confidence)
          example: ["sdk", "browser_extension"]
        confidence:
          type: string
          description: Discovery confidence level (based on number of corroborating sources)
          enum: [low, medium, high, verified]
          example: "verified"
        first_seen:
          type: string
          format: date-time
          description: When this asset was first discovered
          example: "2026-03-01T10:00:00Z"
        last_seen:
          type: string
          format: date-time
          description: Most recent activity timestamp
          example: "2026-03-25T14:22:00Z"
        lifecycle_state:
          type: string
          description: >
            Telemetry-driven lifecycle. `stale` and then `retired` after no
            sighting for a number of days that depends on the asset's
            discovery sources (e.g. platform_signal 7 and 30, code_scan 90
            and 180, sdk/gateway/otel and others 30 and 90; the most
            lenient of the asset's sources applies). New telemetry makes the
            asset `active` again, unless its owner retired it (`retired_by`).
            Independent of the governance `status`.
          enum: [active, stale, retired]
          example: "active"
        lifecycle_changed_at:
          type: string
          format: date-time
          description: When `lifecycle_state` last changed (for an owner-retired asset, when the owner retired it)
          nullable: true
          example: null
        retired_by:
          type: string
          description: >
            Who retired the asset, from an `asset` attestation with state
            `retired`; null unless its owner retired it. An owner-retired
            asset stays `retired` when it is seen again.
          nullable: true
          example: null
        retired_in_use_at:
          type: string
          format: date-time
          description: >
            First sighting of an owner-retired asset since it was retired
            ("retired asset still in use"). Cleared when the owner retires
            it again or un-retires it.
          nullable: true
          example: null
        attestation:
          type: object
          description: >
            Human sign-off per attestable field (`asset`, `owner`,
            `data_classification`). Separate from `confidence`, which only
            counts agreeing discovery sources and is never changed by an
            attestation.
          additionalProperties:
            $ref: '#/components/schemas/AttestationStatus'
      required:
        - id
        - vendor
        - model
        - use_case_name
        - business_unit
        - owner_email
        - environment
        - status
        - data_classification
        - discovery_source
        - confidence
        - first_seen
        - last_seen

    DataFlow:
      type: object
      description: Data lineage record for an AI asset
      properties:
        id:
          type: string
          format: uuid
        source_system:
          type: string
          description: Where data comes from
          example: "candidates_db"
        destination_system:
          type: string
          description: Where output goes
          example: "hiring_dashboard"
        data_classification:
          type: string
          enum: [public, internal, confidential, restricted]
          nullable: true
        direction:
          type: string
          enum: [input, output]
        detected_pii_types:
          type: array
          items:
            type: string
          description: PII categories detected in this data flow
          example: ["name", "email", "phone"]
          nullable: true
      required:
        - id
        - source_system
        - destination_system
        - data_classification
        - direction
        - detected_pii_types

    RiskMapping:
      type: object
      description: |
        Risk assessment linked to an AI asset. Rows with `status: suggested`
        come from the rules engine and are suggestions, not determinations:
        a human confirms or rejects them.
      properties:
        id:
          type: string
          format: uuid
        risk_category:
          type: string
          description: |
            Hand-entered mappings typically use strategic, operational,
            compliance, cyber or reputational. Suggestions use the framework's
            own category, e.g. `employment` (EU AI Act Annex III point 4) or
            `privacy` (NIST AI RMF).
          example: "compliance"
        risk_level:
          type: string
          enum: [critical, high, medium, low]
          example: "high"
        framework:
          type: string
          description: Governance framework this risk maps to
          enum: [NIST_AI_RMF, ISO_42001, EU_AI_ACT, custom]
          example: "EU_AI_ACT"
          nullable: true
        status:
          type: string
          enum: [suggested, confirmed, rejected]
          description: Hand-entered mappings are `confirmed`.
          example: "suggested"
        source:
          type: string
          enum: [manual, rules]
          example: "rules"
        rule_id:
          type: string
          nullable: true
          description: Rule that produced the suggestion
          example: "eu_ai_act.annex_iii.4a.recruitment"
        ruleset_version:
          type: string
          nullable: true
          example: "1.0.0"
        framework_ref:
          type: string
          nullable: true
          description: Where in the framework the rule points
          example: "Annex III, point 4(a)"
        confidence:
          type: string
          nullable: true
          enum: [low, medium, high, null]
          example: "high"
        evidence:
          type: object
          nullable: true
          description: |
            Why the rule fired: `summary` (one line), `rule_title`, `ruleset`
            and `signals`, each `{signal, value, matched, role}` where role is
            `trigger` or `supporting`.
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          nullable: true
          description: The person who confirmed or rejected the mapping
          example: "dpo@example.com"
      required:
        - id
        - risk_category
        - risk_level
        - framework
        - status
        - source

    UsageSummary:
      type: object
      description: Aggregated usage statistics for an AI asset
      properties:
        total_requests:
          type: integer
          example: 15420
        total_tokens_in:
          type: integer
          example: 3250000
        total_tokens_out:
          type: integer
          example: 6100000
        total_tokens_cached:
          type: integer
          description: Prompt tokens read from the provider's prompt cache (part of total_tokens_in). 0 when no event reported them.
          example: 1200000
        total_tokens_cache_write:
          type: integer
          description: Prompt tokens written to the provider's prompt cache (part of total_tokens_in). 0 when no event reported them.
          example: 80000
        total_tokens_reasoning:
          type: integer
          description: Reasoning tokens (part of total_tokens_out). 0 when no event reported them.
          example: 900000
        estimated_cost_usd:
          type: number
          format: float
          nullable: true
          description: Null when no event in the period reported a cost (0 would claim a measurement)
          example: 482.50
        unique_sessions:
          type: integer
          example: 312
        avg_latency_ms:
          type: integer
          nullable: true
          description: Null when no event in the period reported a latency
          example: 380
        period:
          type: string
          description: Time period for this summary
          example: "30d"
      required:
        - total_requests
        - total_tokens_in
        - total_tokens_out
        - total_tokens_cached
        - total_tokens_cache_write
        - total_tokens_reasoning
        - estimated_cost_usd
        - unique_sessions
        - avg_latency_ms
        - period

    ChangeEvent:
      type: object
      description: A change to an AI asset (for delta sync)
      properties:
        change_type:
          type: string
          enum: [created, updated, deactivated]
          description: Type of change
        asset:
          $ref: '#/components/schemas/AIAsset'
        lifecycle_change:
          type: string
          enum: [stale, retired, reactivated, retired_in_use]
          nullable: true
          description: >
            Lifecycle transition since `since`, or null if none.
            `retired_in_use`: an owner-retired asset was seen again.
        attestation_changes:
          type: array
          items:
            type: string
          description: Fields whose attestation changed since `since`
          example: ["owner"]
        changed_at:
          type: string
          format: date-time
        changed_fields:
          type: array
          items:
            type: string
          description: Which fields changed (null for created)
          nullable: true
          example: ["confidence", "discovery_source", "last_seen"]
      required: [change_type, asset, changed_at, changed_fields]

    AttestationStatus:
      type: object
      description: Current attestation of one field (its newest attestation)
      properties:
        state:
          type: string
          enum: [unreviewed, attested, disputed, retired]
        attested_by:
          type: string
          nullable: true
          example: "ciso@acme.com"
        attested_at:
          type: string
          format: date-time
          nullable: true
        comment:
          type: string
          nullable: true
        value_changed:
          type: boolean
          description: The registry value differs from the value that was attested
      required: [state, attested_by, attested_at, comment, value_changed]

    Attestation:
      type: object
      description: One immutable attestation record
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        field:
          type: string
          example: "owner"
        state:
          type: string
          enum: [unreviewed, attested, disputed, retired]
        value:
          description: The field's value when the attestation was made
          nullable: true
          example: "jane.doe@acme.com"
        comment:
          type: string
          nullable: true
        attested_by:
          type: string
          example: "ciso@acme.com"
        attested_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [tenant, partner]
        partner_id:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - asset_id
        - field
        - state
        - value
        - comment
        - attested_by
        - attested_at
        - actor_type
        - partner_id

    AttestationRequest:
      type: object
      required: [field, state, attested_by]
      properties:
        field:
          type: string
          description: One of `asset`, `owner`, `data_classification`
          example: "owner"
        state:
          type: string
          enum: [unreviewed, attested, disputed, retired]
        attested_by:
          type: string
          description: >-
            The person signing off, e.g. an email. Asserted by the caller (API
            keys and partner tokens are machine credentials); the authenticated
            credential (tenant key prefix or partner id) is recorded alongside it.
          example: "ciso@acme.com"
        comment:
          type: string
          description: Required when `state` is `disputed`
          nullable: true

    SourceCoverage:
      type: object
      description: |
        Telemetry delivery for one source. `sdk` is the Prompt Shields SDKs,
        `gateway` the AI gateway, `otel` the OTLP GenAI receiver (one client
        per `service.name`), `kong` Kong's http-log plugin through
        `/ingest/kong` (one client) and `unidentified` events sent without
        delivery metadata (older clients).
      properties:
        source:
          type: string
          enum: [sdk, gateway, otel, kong, unidentified]
        clients:
          type: integer
          description: Distinct clients (SDK processes, gateway processes, OTel services) seen
          example: 4
        received_events:
          type: integer
          description: Events the collector stored
          example: 15420
        dropped_events:
          type: integer
          description: >-
            Events known to be lost: dropped by the client (buffer overflow,
            failed sends, unserialisable events) as it reported, and for
            `otel` the GenAI spans the collector rejected (no vendor,
            oversized request, failed write), and for `kong` the AI log
            entries of an accepted request that could not be mapped (Kong
            retries rejected requests, so those are not counted).
          example: 12
        unaccounted_events:
          type: integer
          description: >-
            Events a client reported queueing that neither arrived nor were
            reported dropped (in flight, or lost silently). Always 0 for
            `otel`, `kong` and `unidentified`, which report no counters.
          example: 3
        coverage:
          type: number
          format: float
          description: >-
            received / (received + dropped + unaccounted), 0 to 1. Null when
            nothing was expected, and always null for `unidentified`.
          nullable: true
          example: 0.999
        last_seen:
          type: string
          format: date-time
          nullable: true
      required:
        - source
        - clients
        - received_events
        - dropped_events
        - unaccounted_events
        - coverage
        - last_seen

    TelemetryCoverage:
      type: object
      description: How complete the tenant's usage telemetry is, overall and per source
      properties:
        coverage:
          type: number
          format: float
          description: Coverage over every source, 0 to 1; null when nothing was expected
          nullable: true
          example: 0.998
        received_events:
          type: integer
          example: 20410
        dropped_events:
          type: integer
          example: 30
        unaccounted_events:
          type: integer
          example: 5
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCoverage'
      required:
        - coverage
        - received_events
        - dropped_events
        - unaccounted_events
        - sources

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total matching records
        has_more:
          type: boolean
          description: Whether more pages exist
        next_cursor:
          type: string
          description: Cursor for next page (pass as `after` parameter)
          nullable: true
        sync_token:
          type: string
          description: >-
            Token for delta sync; pass it as `since` to the next /changes
            call. Returned by /changes (not by the /assets list); /export
            returns it in its meta too.
          nullable: true
        tenant_id:
          type: string
          format: uuid
          description: >-
            Tenant of the credential that made the request. Returned by
            /changes (not by the /assets list); /export and
            /assets/{asset_id}/data-flows return it in their meta too. Lets an
            integration check that its key belongs to the tenant it syncs.
      required: [total, has_more, next_cursor]

    Error:
      type: object
      description: RFC 7807 Problem Details error
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: "Unauthorized"
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: "Invalid or expired access token"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Token lifetime in seconds
          example: 3600
        scope:
          type: string
          example: "assets:read data-flows:read risks:read usage:read export:read changes:read"
      required: [access_token, token_type, expires_in, scope]

    WebhookSubscription:
      type: object
      description: A tenant's webhook subscription. The signing secret is never included.
      properties:
        id:
          type: string
          format: uuid
        partner_id:
          type: string
          format: uuid
          description: Partner credential that receives the events
        url:
          type: string
          format: uri
          example: "https://ea.example.com/hooks/prompt-shields"
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          description: false while the subscription is paused
        rotation_grace_ends_at:
          type: string
          format: date-time
          nullable: true
          description: Set while a rotated-out secret still signs deliveries
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - partner_id
        - url
        - event_types
        - description
        - is_active
        - rotation_grace_ends_at
        - created_at
        - updated_at

    WebhookSubscriptionWithSecret:
      description: >-
        Returned on create and on secret rotation, the only times the signing
        secret is shown.
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            secret:
              type: string
              description: "`whsec_...`. Save it now; it is not shown again."
            warning:
              type: string
              example: "Save the signing secret now. It will not be shown again."
          required: [secret, warning]

    WebhookEventType:
      type: string
      description: >-
        Event types a subscription can name. `audit.*` subscribes to the
        tenant's hash-chained admin audit trail, delivered as one event per
        row with the type `audit.<action>` (see the Audit trail guide); it
        needs the `audit:read` scope and is not part of the default list.
      enum: [asset.created, asset.changed, asset.retired, asset.attested, audit.*]

    CreateWebhookSubscriptionRequest:
      type: object
      required: [partner_id, url]
      properties:
        partner_id:
          type: string
          format: uuid
          description: >-
            Partner credential (of this tenant) that receives the events. It
            needs `changes:read`, plus `assets:read` for `asset.attested`,
            and `audit:read` for `audit.*`.
        url:
          type: string
          maxLength: 2048
          description: "`https` URL with a public host"
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Defaults to every asset event type (not `audit.*`)
        description:
          type: string
          maxLength: 200
          nullable: true

    UpdateWebhookSubscriptionRequest:
      type: object
      description: Fields to change. Omitted fields keep their value; give at least one, and none as null.
      minProperties: 1
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2048
          description: New destination, checked like a new subscription's URL
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Replaces the event list. The partner needs each event's scope.
        is_active:
          type: boolean
          description: >-
            false pauses the subscription: no new events are queued for it and
            queued deliveries are not sent. true resumes it.

    RotateWebhookSecretRequest:
      type: object
      properties:
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
          description: >-
            Keep signing with the old secret too for this long, so the receiver
            can switch without dropping deliveries. 0 invalidates the old
            secret at once.

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: An asset event type, or `audit.<action>` for an audit trail event
          example: audit.provider_credential.rotate
        asset_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, succeeded, dead]
        attempts:
          type: integer
        last_status_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: Set only while `status` is `pending`
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - subscription_id
        - event_id
        - event_type
        - asset_id
        - status
        - attempts
        - last_status_code
        - last_error
        - next_attempt_at
        - last_attempt_at
        - delivered_at
        - created_at

    ProviderCredential:
      type: object
      description: >-
        A stored provider admin key, masked. The key itself and its ciphertext
        are never returned.
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
        key_hint:
          type: string
          description: "`****` plus the key's last four characters"
          example: "****a1b2"
        key_id:
          type: string
          nullable: true
          description: Id of the `PS_WEBHOOK_SECRET_KEYS` keyring key the admin key is encrypted under
          example: "k2"
        created_at:
          type: string
          format: date-time
          nullable: true
        rotated_at:
          type: string
          format: date-time
          nullable: true
      required: [provider, key_hint, key_id, created_at, rotated_at]

    AdminKeyRequest:
      type: object
      additionalProperties: false
      required: [admin_key]
      properties:
        admin_key:
          type: string
          writeOnly: true
          description: >-
            The provider's organization admin key (20 to 512 printable ASCII
            characters, no whitespace). Write-only: never returned, logged or
            audited, and a 400 or 422 about it never echoes the value.

    ProviderKeyFingerprintLink:
      type: object
      description: Links a provider's opaque API key id to the SDK's `api_key_fingerprint`.
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
        api_key_id:
          type: string
          description: The key id the provider's usage API reports
          example: "key_abc123"
        api_key_fingerprint:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: First 16 hex characters of sha256(api key), computed where the key lives
          example: "3f9a1c0b7d2e4f60"
        created_at:
          type: string
          format: date-time
          nullable: true
      required: [provider, api_key_id, api_key_fingerprint, created_at]

    FingerprintRequest:
      type: object
      additionalProperties: false
      required: [api_key_fingerprint]
      properties:
        api_key_fingerprint:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: >-
            First 16 hex characters of sha256(api key), as the SDK sends it.
            Anything else (a raw key, for example) is refused with a 400.

  responses:
    Forbidden:
      description: The credential lacks the scope this endpoint requires
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "Token lacks required scope: export:read"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found in this tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidAdminKey:
      description: The admin key is too short, too long or not printable ASCII. The message never echoes it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KeyringNotConfigured:
      description: Credential storage needs `PS_WEBHOOK_SECRET_KEYS` on this collector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProviderCredential:
      description: The stored credential, masked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderCredential'
    ProviderCredentialList:
      description: Stored credentials, masked
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderCredential'
              meta:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                    description: Providers a key can be stored for
                    example: ["openai", "anthropic"]
                  env_fallback:
                    type: array
                    items:
                      type: string
                    description: Providers with no stored key that the pull would take from `PS_PROVIDER_ADMIN_KEYS`
                required: [providers, env_fallback]
            required: [data, meta]
    FingerprintLink:
      description: The link, and how many platform_signal assets it corroborated
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/ProviderKeyFingerprintLink'
              meta:
                type: object
                properties:
                  corroborated_assets:
                    type: integer
                    description: Platform_signal assets that gained a corroborating source
                required: [corroborated_assets]
            required: [data, meta]
    FingerprintLinkList:
      description: Fingerprint links
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderKeyFingerprintLink'
            required: [data]
    WebhookSubscription:
      description: The subscription (without its secret)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookSubscription'
    WebhookSubscriptionWithSecret:
      description: The subscription and its new signing secret, shown only this once
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookSubscriptionWithSecret'

  requestBodies:
    AdminKey:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminKeyRequest'
    Fingerprint:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FingerprintRequest'

  parameters:
    ProviderPathParam:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [openai, anthropic]

    ApiKeyIdPathParam:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: The key id the provider's usage API reports

    SubscriptionIdPathParam:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Number of records per page (max 200)

    AfterParam:
      name: after
      in: query
      schema:
        type: string
        format: uuid
      description: Cursor for pagination (UUIDv7 of last item from previous page)

    BusinessUnitParam:
      name: business_unit
      in: query
      schema:
        type: string
      description: Filter by business unit
      example: "HR"

    StatusParam:
      name: status
      in: query
      schema:
        type: string
        enum: [active, deprecated, under_review]
      description: Filter by governance status

    LifecycleStateParam:
      name: lifecycle_state
      in: query
      schema:
        type: string
        enum: [active, stale, retired]
      description: Filter by telemetry-driven lifecycle state

    DiscoverySourceParam:
      name: discovery_source
      in: query
      schema:
        type: string
        enum: [sdk, gateway, browser_extension, macos_app, platform_signal, survey, otel, code_scan, kong]
      description: Filter by discovery source

    SinceParam:
      name: since
      in: query
      schema:
        type: string
        format: date-time
      description: Only return assets first seen after this timestamp
      example: "2026-03-01T00:00:00Z"

    VendorParam:
      name: vendor
      in: query
      schema:
        type: string
      description: Filter by AI vendor
      example: "openai"

    ConfidenceParam:
      name: confidence
      in: query
      schema:
        type: string
        enum: [low, medium, high, verified]
      description: Filter by minimum confidence level

    DataClassificationParam:
      name: data_classification
      in: query
      schema:
        type: string
        enum: [public, internal, confidential, restricted]
      description: Filter by data classification

paths:
  /oauth/token:
    post:
      operationId: createToken
      tags: [Auth]
      summary: Get access token
      description: Exchange client credentials for a short-lived JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id:
                  type: string
                  example: "ps-partner-ardoq-abc123"
                client_secret:
                  type: string
                  example: "sk-partner-secret-xyz789"
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner/v1/assets:
    get:
      operationId: listAssets
      tags: [Assets]
      summary: List AI assets
      description: |
        Returns a paginated list of discovered AI assets. Supports filtering
        by business unit, vendor, status, confidence, data classification,
        and discovery source.

        **Typical use:** Ardoq Integration Builder polls this endpoint every
        4 hours to sync the AI asset registry into the Ardoq metamodel.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/AfterParam'
        - $ref: '#/components/parameters/BusinessUnitParam'
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/LifecycleStateParam'
        - $ref: '#/components/parameters/DiscoverySourceParam'
        - $ref: '#/components/parameters/SinceParam'
        - $ref: '#/components/parameters/VendorParam'
        - $ref: '#/components/parameters/ConfidenceParam'
        - $ref: '#/components/parameters/DataClassificationParam'
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Paginated list of AI assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIAsset'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: "019e1a2b-3c4d-7000-8000-000000000001"
                    vendor: "openai"
                    model: "gpt-4o"
                    use_case_name: "interview-screening"
                    business_unit: "HR"
                    owner_email: "jane.doe@acme.com"
                    environment: "production"
                    status: "active"
                    data_classification: "confidential"
                    discovery_source: ["sdk", "browser_extension"]
                    confidence: "verified"
                    first_seen: "2026-03-01T10:00:00Z"
                    last_seen: "2026-03-25T14:22:00Z"
                meta:
                  total: 47
                  has_more: false
                  next_cursor: null
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until rate limit resets

  /partner/v1/assets/{asset_id}:
    get:
      operationId: getAsset
      tags: [Assets]
      summary: Get asset details
      description: Returns full details for a single AI asset by ID.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAsset'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner/v1/assets/{asset_id}/data-flows:
    get:
      operationId: getAssetDataFlows
      tags: [Assets]
      summary: Get data flows
      description: |
        Returns data lineage records for an AI asset. Shows which systems
        provide input data and where output goes, along with data classification
        and detected PII types.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [data-flows:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Data flows for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataFlow'
                  meta:
                    type: object
                    properties:
                      tenant_id:
                        type: string
                        format: uuid
                        description: Tenant of the credential that made the request
              example:
                data:
                  - id: "019e1a2b-0000-7000-8000-000000000010"
                    source_system: "candidates_db"
                    destination_system: "hiring_dashboard"
                    data_classification: "confidential"
                    direction: "input"
                    detected_pii_types: ["name", "email", "phone"]
                  - id: "019e1a2b-0000-7000-8000-000000000011"
                    source_system: "gpt-4o"
                    destination_system: "hiring_dashboard"
                    data_classification: "internal"
                    direction: "output"
                    detected_pii_types: null
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/risks:
    get:
      operationId: getAssetRisks
      tags: [Assets]
      summary: Get risk mappings
      description: |
        Returns risk assessments for an AI asset, mapped to governance
        frameworks (NIST AI RMF, ISO 42001, EU AI Act). By default only
        `confirmed` mappings are returned (hand-entered ones and rule-based
        suggestions a person has confirmed), as before suggestions existed.
        Pass `status=suggested` for unreviewed rule-based suggestions, which
        are not determinations, or `status=rejected`.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Only mappings with this status. Default is `confirmed`.
          schema:
            type: string
            enum: [suggested, confirmed, rejected]
      security:
        - OAuth2: [risks:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Risk mappings for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskMapping'
              example:
                data:
                  - id: "019e1a2b-0000-7000-8000-000000000020"
                    risk_category: "employment"
                    risk_level: "high"
                    framework: "EU_AI_ACT"
                    status: "confirmed"
                    source: "rules"
                    rule_id: "eu_ai_act.annex_iii.4a.recruitment"
                    ruleset_version: "1.1.0"
                    framework_ref: "Annex III, point 4(a)"
                    confidence: "high"
                    evidence:
                      rule_title: "Recruitment or selection: targeted job ads, filtering applications, evaluating candidates"
                      ruleset: "eu_ai_act_annex_iii"
                      summary: "Annex III, point 4(a), Recruitment or selection: ...: use_case 'resume-screening' matched resume* (trigger); business_unit 'HR' matched hr (supporting)"
                      signals:
                        - signal: "use_case"
                          value: "resume-screening"
                          matched: ["resume*"]
                          role: "trigger"
                        - signal: "business_unit"
                          value: "HR"
                          matched: ["hr"]
                          role: "supporting"
                    reviewed_at: "2026-10-15T09:30:00Z"
                    reviewed_by: "dpo@example.com"
                  - id: "019e1a2b-0000-7000-8000-000000000021"
                    risk_category: "operational"
                    risk_level: "medium"
                    framework: "NIST_AI_RMF"
                    status: "confirmed"
                    source: "manual"
                    rule_id: null
                    ruleset_version: null
                    framework_ref: null
                    confidence: null
                    evidence: null
                    reviewed_at: null
                    reviewed_by: null
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/attestations:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAssetAttestations
      tags: [Assets]
      summary: Get attestation history
      description: |
        Immutable history of human attestations for an asset, newest first,
        with the current state of every attestable field in `meta.current`.
        Requires `assets:read`.
      parameters:
        - name: field
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Attestation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attestation'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      confidence:
                        type: string
                      current:
                        type: object
                        additionalProperties:
                          $ref: '#/components/schemas/AttestationStatus'
                    required: [total, confidence, current]
        '404':
          description: Asset not found
    post:
      operationId: createAssetAttestation
      tags: [Assets]
      summary: Record a human attestation
      description: |
        Appends an attestation for one field of an asset. Requires the
        `attestations:write` scope. Never changes `confidence`. The asset
        then appears in `/changes` with the field in `attestation_changes`.
        An `asset` attestation with state `retired` retires the asset (its
        owner's word; the lifecycle sweep and new telemetry leave it
        retired), and a later `attested` or `unreviewed` one un-retires it,
        so this scope can retire assets.
      security:
        - OAuth2: [attestations:write]
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationRequest'
      responses:
        '201':
          description: Attestation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Attestation'
        '400':
          description: Unknown field, or a dispute without a comment
        '403':
          description: Token lacks `attestations:write`
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/usage-summary:
    get:
      operationId: getAssetUsageSummary
      tags: [Assets]
      summary: Get usage summary
      description: |
        Returns aggregated usage statistics for an AI asset over a time period.
        Does not expose individual request data or prompt content.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
          description: Time period for aggregation
      security:
        - OAuth2: [usage:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'

  /partner/v1/telemetry/coverage:
    get:
      operationId: getTelemetryCoverage
      tags: [Assets]
      summary: Get telemetry coverage
      description: |
        How complete the registry's usage data is: events the collector
        received against events its sources reported or were seen to drop,
        overall and per source (SDK, gateway, OpenTelemetry). Counts only;
        no event data.
      security:
        - OAuth2: [usage:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Telemetry coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCoverage'

  /partner/v1/vendors:
    get:
      operationId: listVendors
      tags: [Taxonomy]
      summary: List AI vendors
      description: Returns all distinct AI vendors found in the tenant's asset registry.
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: List of vendor names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
              example:
                data: ["openai", "anthropic", "google", "microsoft"]

  /partner/v1/models:
    get:
      operationId: listModels
      tags: [Taxonomy]
      summary: List AI models
      description: Returns all distinct AI models found in the tenant's asset registry.
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: List of model names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
              example:
                data: ["gpt-4o", "gpt-4o-mini", "claude-sonnet-4-20250514", "gemini-1.5-pro"]

  /partner/v1/business-units:
    get:
      operationId: listBusinessUnits
      tags: [Taxonomy]
      summary: List business units
      description: Returns all distinct business units that have AI usage recorded.
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: List of business unit names
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
              example:
                data: ["HR", "Legal", "Customer Service", "Claims", "Engineering"]

  /partner/v1/changes:
    get:
      operationId: getChanges
      tags: [Sync]
      summary: Get change feed
      description: |
        Returns assets that were created, updated, or deactivated since a given
        timestamp. Use this for efficient delta sync instead of re-fetching all assets.

        **Recommended pattern:**
        1. First sync: call `/partner/v1/export` for full data
        2. Store `sync_token` from response meta
        3. Subsequent syncs: call `/partner/v1/changes?since={sync_token}`
        4. Update `sync_token` after each successful sync
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Return changes after this timestamp (use sync_token from previous response)
          example: "2026-03-25T10:00:00Z"
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/AfterParam'
      security:
        - OAuth2: [changes:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Change feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - change_type: "created"
                    asset:
                      id: "019e1a2b-3c4d-7000-8000-000000000005"
                      vendor: "anthropic"
                      model: "claude-sonnet-4-20250514"
                      use_case_name: "contract-review"
                      business_unit: "Legal"
                      owner_email: "sam.lee@acme.com"
                      environment: "production"
                      status: "active"
                      data_classification: "confidential"
                      confidence: "high"
                      discovery_source: ["gateway"]
                      first_seen: "2026-03-25T14:00:00Z"
                      last_seen: "2026-03-25T14:00:00Z"
                    changed_at: "2026-03-25T14:00:00Z"
                    changed_fields: null
                  - change_type: "updated"
                    asset:
                      id: "019e1a2b-3c4d-7000-8000-000000000001"
                      vendor: "openai"
                      model: "gpt-4o"
                      use_case_name: "interview-screening"
                      business_unit: "HR"
                      owner_email: "jane.doe@acme.com"
                      environment: "production"
                      status: "active"
                      data_classification: "confidential"
                      confidence: "verified"
                      discovery_source: ["sdk", "browser_extension"]
                      first_seen: "2026-03-01T10:00:00Z"
                      last_seen: "2026-03-25T15:01:00Z"
                    changed_at: "2026-03-25T15:01:00Z"
                    changed_fields: ["confidence", "discovery_source", "last_seen"]
                meta:
                  total: 2
                  has_more: false
                  next_cursor: null
                  sync_token: "2026-03-25T15:01:00Z"

  /partner/v1/export:
    get:
      operationId: exportRegistry
      tags: [Sync]
      summary: Export full registry
      description: |
        Returns the complete AI asset registry as a single JSON payload.
        Use for initial sync or full refresh. For subsequent syncs, use
        the `/changes` endpoint instead.

        **Warning:** This endpoint may return large payloads. Use streaming
        where supported by your HTTP client.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, cyclonedx]
            default: json
          description: |
            Export format. `json` is the registry envelope below. `cyclonedx`
            is a CycloneDX 1.6 AI-BOM (`application/vnd.cyclonedx+json; version=1.6`):
            each asset is an `application` component whose Prompt Shields data
            (vendor, model, modality, discovery sources, confidence, owner, risk
            classifications, ...) is carried as `promptshields:<name>` properties,
            for example `promptshields:modality` = `audio`.
      security:
        - OAuth2: [export:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Full registry export
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIAsset'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      exported_at:
                        type: string
                        format: date-time
                      sync_token:
                        type: string
                        description: Use as `since` parameter for delta sync
                      tenant_id:
                        type: string
                        format: uuid
                        description: Tenant of the credential that made the request
                    required: [total, exported_at, sync_token]
            application/vnd.cyclonedx+json:
              schema:
                type: object
                description: CycloneDX 1.6 BOM (`format=cyclonedx`), valid against the official CycloneDX 1.6 JSON schema.

  /partner/v1/health:
    get:
      operationId: healthCheck
      tags: [Sync]
      summary: Health check
      description: Returns API health status. Does not require authentication.
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  version:
                    type: string
                    example: "1.0.0"
                required: [status, version]

  # ── Provider admin credentials (#93) ──────────────────────────────────
  # The same routes exist under /partner/v1 (scope provider-credentials:manage)
  # and /api/v1/admin (tenant API key).

  /partner/v1/provider-credentials:
    get:
      operationId: listProviderCredentials
      tags: [Provider Credentials]
      summary: List stored provider admin keys (masked)
      description: |
        The tenant's stored provider admin keys, masked. `meta.env_fallback`
        lists providers that have no stored key but a `PS_PROVIDER_ADMIN_KEYS`
        entry, which the usage pull falls back to. Requires
        `provider-credentials:manage`.
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredentialList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner/v1/provider-credentials/{provider}:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
    get:
      operationId: getProviderCredential
      tags: [Provider Credentials]
      summary: Get a stored provider admin key (masked)
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredential'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createProviderCredential
      tags: [Provider Credentials]
      summary: Store a provider admin key (write-only)
      description: |
        Encrypts the key with the collector's `PS_WEBHOOK_SECRET_KEYS` keyring
        (AES-256-GCM, bound to the row). The key is never returned; the
        response is masked. 409 when a key is already stored: rotate it instead.
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '201':
          $ref: '#/components/responses/ProviderCredential'
        '400':
          $ref: '#/components/responses/InvalidAdminKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A key is already stored for this provider
        '503':
          $ref: '#/components/responses/KeyringNotConfigured'
    delete:
      operationId: deleteProviderCredential
      tags: [Provider Credentials]
      summary: Delete a stored provider admin key
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /partner/v1/provider-credentials/{provider}/rotate:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
    post:
      operationId: rotateProviderCredential
      tags: [Provider Credentials]
      summary: Replace a stored provider admin key
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredential'
        '400':
          $ref: '#/components/responses/InvalidAdminKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/KeyringNotConfigured'

  /partner/v1/provider-key-fingerprints:
    get:
      operationId: listProviderKeyFingerprints
      tags: [Provider Credentials]
      summary: List provider key id to api_key_fingerprint links
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLinkList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner/v1/provider-key-fingerprints/{provider}/{api_key_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
      - $ref: '#/components/parameters/ApiKeyIdPathParam'
    put:
      operationId: putProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Link a provider key id to the SDK api_key_fingerprint
      description: |
        The provider usage APIs report only opaque key ids, so the tenant
        registers which SDK `api_key_fingerprint` (first 16 hex characters of
        sha256(key), computed where the key lives) belongs to which key id.
        Corroboration then runs at once: a platform_signal asset for this key
        and an SDK asset that saw the same fingerprint and model both become
        `verified`. 201 for a new link, 200 when it replaced one.
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/Fingerprint'
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLink'
        '201':
          $ref: '#/components/responses/FingerprintLink'
        '400':
          description: Not a 16-hex-character fingerprint, or an invalid key id
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Delete a fingerprint link
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/provider-credentials:
    get:
      operationId: adminListProviderCredentials
      tags: [Provider Credentials]
      summary: List stored provider admin keys (masked, tenant admin)
      description: Same as `GET /partner/v1/provider-credentials`, with the tenant API key.
      security:
        - TenantApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredentialList'
        '401':
