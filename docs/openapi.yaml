  # The same routes exist under /partner/v1 (scope provider-credentials:manage)
  # and /api/v1/admin (tenant API key).

  /partner/v1/provider-credentials:
    get:
      operationId: listProviderCredentials
      tags: [Provider Credentials]
      summary: List stored provider admin keys (masked)
      description: |
        The tenant's stored provider admin keys, masked. `meta.env_fallback`
        lists providers that have no stored key but a `PS_PROVIDER_ADMIN_KEYS`
        entry, which the usage pull falls back to. Requires
        `provider-credentials:manage`.
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredentialList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner/v1/provider-credentials/{provider}:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
    get:
      operationId: getProviderCredential
      tags: [Provider Credentials]
      summary: Get a stored provider admin key (masked)
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredential'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createProviderCredential
      tags: [Provider Credentials]
      summary: Store a provider admin key (write-only)
      description: |
        Encrypts the key with the collector's `PS_WEBHOOK_SECRET_KEYS` keyring
        (AES-256-GCM, bound to the row). The key is never returned; the
        response is masked. 409 when a key is already stored: rotate it instead.
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '201':
          $ref: '#/components/responses/ProviderCredential'
        '400':
          $ref: '#/components/responses/InvalidAdminKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A key is already stored for this provider
        '503':
          $ref: '#/components/responses/KeyringNotConfigured'
    delete:
      operationId: deleteProviderCredential
      tags: [Provider Credentials]
      summary: Delete a stored provider admin key
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

