        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
        - name: cursor
          in: query
          schema: {type: string}
          description: "`meta.next_cursor` of the previous page"
      security:
        - OAuth2: [mcp:read]
        - PartnerApiKey: []
      responses:
        '400':
          description: Invalid cursor
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
