        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:provider-credentials
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredential'
        '400':
          $ref: '#/components/responses/InvalidAdminKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/KeyringNotConfigured'

  /api/v1/admin/provider-key-fingerprints:
    get:
      operationId: adminListProviderKeyFingerprints
      tags: [Provider Credentials]
      summary: List provider key id to api_key_fingerprint links (tenant admin)
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:provider-credentials
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/provider-key-fingerprints/{provider}/{api_key_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
      - $ref: '#/components/parameters/ApiKeyIdPathParam'
    put:
      operationId: adminPutProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Link a provider key id to the SDK api_key_fingerprint (tenant admin)
      description: Same as `PUT /partner/v1/provider-key-fingerprints/{provider}/{api_key_id}`, with the tenant API key.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:provider-credentials
      requestBody:
        $ref: '#/components/requestBodies/Fingerprint'
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLink'
        '201':
          $ref: '#/components/responses/FingerprintLink'
        '400':
          description: Not a 16-hex-character fingerprint, or an invalid key id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    delete:
      operationId: adminDeleteProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Delete a fingerprint link (tenant admin)
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:provider-credentials
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Webhook subscriptions (tenant admin, #103) ────────────────────────

  /api/v1/admin/webhooks/subscriptions:
    post:
      operationId: createWebhookSubscription
      tags: [Webhooks]
      summary: Subscribe a partner to asset change events
      description: |
        The tenant, not the partner, decides where its registry data is
        pushed. The URL must be `https` with a public host. The signing
        secret is returned once, in this response.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
      responses:
        '201':
          $ref: '#/components/responses/WebhookSubscriptionWithSecret'
        '400':
          description: >-
            Invalid URL, a partner that cannot receive these events (revoked,
            expired or missing a scope), or the per-partner subscription limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: Partner credential not found in this tenant
        '503':
          description: Webhooks are not configured on this collector (no `PS_WEBHOOK_SECRET_KEYS`)
    get:
      operationId: listWebhookSubscriptions
      tags: [Webhooks]
      summary: List webhook subscriptions
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      parameters:
        - name: partner_id
          in: query
          schema:
            type: string
            format: uuid
          description: Only this partner's subscriptions
      responses:
        '200':
          description: Subscriptions, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/webhooks/subscriptions/{subscription_id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionIdPathParam'
    get:
      operationId: getWebhookSubscription
      tags: [Webhooks]
      summary: Get a webhook subscription
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      responses:
        '200':
          $ref: '#/components/responses/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWebhookSubscription
      tags: [Webhooks]
      summary: Change a subscription's URL or event types, or pause and resume it
      description: |
        Changing the event types or resuming needs a partner that may receive
        them, as on create; pausing never does, so a revoked partner's
        subscription can still be paused. Audited with the names of the
        changed fields (not their values).
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookSubscription'
        '400':
          description: Invalid URL, or a partner that cannot receive these events
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Empty body, a null field or an unknown field
    delete:
      operationId: deleteWebhookSubscription
      tags: [Webhooks]
      summary: Delete a subscription and its queued and past deliveries
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/webhooks/subscriptions/{subscription_id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/SubscriptionIdPathParam'
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Replace the signing secret
      description: |
        Returns the new secret once. With `grace_period_seconds` the old
        secret keeps signing too (a second `v1=` signature) until the grace
        period ends, so the receiver can switch without dropping deliveries.
        The body is optional.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSecretRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookSubscriptionWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A grace period was asked for but the current secret cannot be read; rotate without one
        '503':
          description: Webhooks are not configured on this collector

  /api/v1/admin/webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List webhook deliveries (dead letters by default)
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, succeeded, dead]
            default: dead
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/webhooks/deliveries/{delivery_id}/redeliver:
    parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: redeliverWebhook
      tags: [Webhooks]
      summary: Queue a delivery again
      description: Resets the attempt count and queues the delivery for the next worker run.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:webhooks
      responses:
        '200':
          description: The delivery, now `pending`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The delivery is already queued

  # ── Admin tokens and tenant ingest keys (tenant admin) ────────────────

  /api/v1/admin/token-scopes:
    get:
      operationId: listAdminTokenScopes
      tags: [Admin]
      summary: List the admin token scopes
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:tokens
      responses:
        '200':
          description: Every admin scope with what it grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          $ref: '#/components/schemas/AdminScope'
                        description:
                          type: string
                      required: [name, description]
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/tokens:
    post:
      operationId: createAdminToken
      tags: [Admin]
      summary: Issue a scoped admin token
      description: |
        The token is returned once, in this response; only its hash is
        stored. An admin token can only grant scopes it holds itself.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminTokenRequest'
      responses:
        '201':
          description: The token, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenWithSecret'
        '400':
          description: Unknown scope, or `expires_at` not in the future
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: An unrevoked token with this name exists
    get:
      operationId: listAdminTokens
      tags: [Admin]
      summary: List admin tokens (metadata only)
      description: Revoked and expired tokens are included, flagged by `status`, unless `status` filters them out.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:tokens
      parameters:
        - $ref: '#/components/parameters/CredentialStatusParam'
      responses:
        '200':
          description: Tokens, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminToken'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAdminToken
      tags: [Admin]
      summary: Get an admin token (metadata only)
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:tokens
      responses:
        '200':
          description: The token's metadata, also when revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeAdminToken
      tags: [Admin]
      summary: Revoke an admin token
      description: |
        Revokes at once. The row is kept (`status: revoked`, readable by
        id) and the name can be reused. Revoking a revoked token is 204.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:tokens
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/api-keys:
    post:
      operationId: createTenantApiKey
      tags: [Admin]
      summary: Issue a tenant ingest key
      description: |
        The key is returned once, in this response; only its hash is
        stored. While `PS_ADMIN_REQUIRE_SCOPED_TOKENS` is off the new key
        also has full access to `/api/v1/admin`, like every ingest key.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantApiKeyRequest'
      responses:
        '201':
          description: The key, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantApiKeyWithSecret'
        '400':
          description: '`expires_at` not in the future'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '409':
          description: An unrevoked key with this name exists
    get:
      operationId: listTenantApiKeys
      tags: [Admin]
      summary: List tenant ingest keys (metadata only)
      description: |
        Revoked and expired keys are included, flagged by `status`, unless
        `status` filters them out. The first call for a tenant whose key
        still lives on the tenant row moves it here as `legacy-ingest-key`
        (audited); the key itself keeps working.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:keys
      parameters:
        - $ref: '#/components/parameters/CredentialStatusParam'
      responses:
        '200':
          description: Keys, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantApiKey'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/api-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/KeyIdPathParam'
    get:
      operationId: getTenantApiKey
      tags: [Admin]
      summary: Get a tenant ingest key (metadata only)
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:keys
      responses:
        '200':
          description: The key's metadata, also when revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokeTenantApiKey
      tags: [Admin]
      summary: Revoke a tenant ingest key
      description: |
        Revokes at once, including a secret still in a rotation grace
        window. The row is kept (`status: revoked`, readable by id) and the
        name can be reused. Revoking a revoked key is 204. Revoking the key
        this request is made with locks that caller out.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:keys
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/api-keys/{key_id}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyIdPathParam'
    post:
      operationId: rotateTenantApiKey
      tags: [Admin]
      summary: Replace a key's secret, keeping its id
      description: |
        Returns the new secret once. With `grace_period_seconds` the old
        secret keeps authenticating until the window ends
        (`rotation_grace_ends_at`); a secret still in an earlier window ends
        now. `expires_at` is unchanged. The body is optional.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:keys
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateTenantApiKeyRequest'
      responses:
        '200':
          description: The key with its new secret, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantApiKeyWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The key is revoked or expired

  # ── Partner credentials (tenant admin) ────────────────────────────────

  /api/v1/admin/partner-scopes:
    get:
      operationId: listPartnerScopes
      tags: [Admin]
      summary: List Partner API scopes and rate-limit tiers
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:partners
      responses:
        '200':
          description: Grantable scopes, aliases, defaults and tiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                  aliases:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  default_scopes:
                    type: array
                    items:
                      type: string
                  rate_limit_tiers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        requests_per_minute:
                          type: integer
                required: [scopes, aliases, default_scopes, rate_limit_tiers]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/partner-credentials:
    post:
      operationId: issuePartnerCredential
      tags: [Admin]
      summary: Issue a Partner API credential
      description: |
        Returns the client secret and API key once. Several credentials may
        share a `partner_name` (issue the new one, then revoke the old one
        to rotate), so this is not a 409 on a name in use.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:partners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuePartnerCredentialRequest'
      responses:
        '201':
          description: The credential with its secrets, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCredentialWithSecrets'
        '400':
          description: Unknown scope or rate-limit tier, or both a tier and a custom limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
    get:
      operationId: listPartnerCredentials
      tags: [Admin]
      summary: List Partner API credentials
      description: Revoked and expired credentials are included, flagged by `status`, unless `status` filters them out.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:partners
      parameters:
        - $ref: '#/components/parameters/CredentialStatusParam'
      responses:
        '200':
          description: Credentials, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerCredential'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/partner-credentials/{credential_id}:
    parameters:
      - name: credential_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPartnerCredential
      tags: [Admin]
      summary: Get a Partner API credential
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:partners
      responses:
        '200':
          description: The credential, also when revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updatePartnerCredential
      tags: [Admin]
      summary: Change a credential's scopes or rate limit
      description: Takes effect on the partner's next request, including with access tokens issued before. Audited.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:partners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartnerCredentialRequest'
      responses:
        '200':
          description: The updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCredential'
        '400':
          description: Unknown scope or tier, or both a tier and a custom limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: revokePartnerCredential
      tags: [Admin]
      summary: Revoke a Partner API credential
      description: |
        Revokes at once, including access tokens already issued. The row is
        kept (`status: revoked`, `is_active: "false"`, readable by id).
        Revoking a revoked credential is 204.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:partners
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Registry jobs (tenant admin) ──────────────────────────────────────

  /api/v1/admin/asset-lifecycle/sweep:
    post:
      operationId: runAssetLifecycleSweep
      tags: [Admin]
      summary: Mark the tenant's assets stale or retired based on last telemetry
      description: >-
        Thresholds are per discovery source unless `stale_after_days` or
        `retire_after_days` is given. Owner-retired assets are not changed.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:registry
      parameters:
        - name: stale_after_days
          in: query
          schema:
            type: integer
            minimum: 1
        - name: retire_after_days
          in: query
          schema:
            type: integer
            minimum: 2
      responses:
        '200':
          description: Counts of assets changed
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid thresholds
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/risk-suggestions/run:
    post:
      operationId: runRiskSuggestions
      tags: [Admin]
      summary: Re-evaluate risk classification suggestions for the tenant's assets
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:registry
      responses:
        '200':
          description: Counts of suggestions added, updated and withdrawn
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'

  /api/v1/admin/risk-mappings/{risk_id}/review:
    parameters:
      - name: risk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reviewRiskMapping
      tags: [Admin]
      summary: Confirm or reject a risk mapping
      description: A human decision the suggestion engine keeps. Audited.
      security:
        - TenantApiKey: []
        - AdminToken: []
      x-admin-scope: admin:registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [confirmed, rejected]
                reviewed_by:
                  type: string
                  minLength: 1
                  maxLength: 320
                  description: The person deciding, e.g. an email
              required: [status, reviewed_by]
      responses:
        '200':
          description: The reviewed risk mapping
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Operator-triggered pulls and syncs (PS_ADMIN_TOKEN) ───────────────

  /api/v1/admin/provider-usage/pull:
    post:
      operationId: pullProviderUsage
      tags: [Operator]
      summary: Pull org usage from provider admin APIs for one tenant (operator)
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  format: uuid
                days:
                  type: integer
                  minimum: 1
                  maximum: 90
                  default: 7
                providers:
                  type: [array, 'null']
                  items:
                    type: string
              required: [tenant_id]
      responses:
        '200':
          description: Per-provider pull results
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/admin/cloud-inventory/pull:
    post:
      operationId: pullCloudInventory
      tags: [Operator]
      summary: Inventory AI model deployments in a tenant's cloud accounts (operator)
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                  format: uuid
                clouds:
                  type: [array, 'null']
                  items:
                    type: string
              required: [tenant_id]
      responses:
        '200':
          description: Per-cloud inventory results
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unknown cloud
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/admin/connectors/leanix/sync:
    post:
      operationId: syncLeanix
      tags: [Operator]
      summary: Push a tenant's AI asset registry to LeanIX (operator)
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorSyncRequest'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/admin/connectors/leanix/status:
    get:
      operationId: leanixStatus
      tags: [Operator]
      summary: LeanIX connector state for a tenant (operator)
      security:
        - OperatorToken: []
      parameters:
        - $ref: '#/components/parameters/TenantIdQueryParam'
      responses:
        '200':
          description: Connector configuration (no secrets) and sync state
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/admin/connectors/servicenow/sync:
    post:
      operationId: syncServiceNow
      tags: [Operator]
      summary: Push a tenant's AI asset registry to the ServiceNow CMDB (operator)
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorSyncRequest'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/admin/connectors/servicenow/status:
    get:
      operationId: serviceNowStatus
      tags: [Operator]
      summary: ServiceNow connector state for a tenant (operator)
      security:
        - OperatorToken: []
      parameters:
        - $ref: '#/components/parameters/TenantIdQueryParam'
      responses:
        '200':
          description: Connector configuration (no secrets) and sync state
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  # ── Operator: tenants, retention, erasure (PS_ADMIN_TOKEN) ────────────

  /api/v1/operator/tenants:
    post:
      operationId: createTenant
      tags: [Operator]
      summary: Create a tenant
      description: |
        Optionally issues the tenant's first ingest key (returned once).
        Use `POST /api/v1/operator/tenants/{tenant_id}/admin-tokens` for
        its first admin token.
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: The tenant, with its first ingest key shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '400':
          description: Invalid settings
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: A tenant with this name exists (case-insensitive)
    get:
      operationId: listTenants
      tags: [Operator]
      summary: List tenants
      security:
        - OperatorToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
      responses:
        '200':
          description: Tenants, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/operator/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPathParam'
    get:
      operationId: getTenant
      tags: [Operator]
      summary: Get a tenant
      security:
        - OperatorToken: []
      responses:
        '200':
          description: The tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
    patch:
      operationId: updateTenant
      tags: [Operator]
      summary: Change a tenant's name, domain or settings, or disable and enable it
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: The updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Invalid settings
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: Another tenant has this name
        '422':
          description: Empty body, a null `name`, `settings` or `disabled`, or an unknown field
    delete:
      operationId: eraseTenant
      tags: [Operator]
      summary: Erase a tenant and all its data
      description: |
        Irreversible (GDPR erasure): every row of the tenant, then the
        tenant. Batched and safe to rerun. Recorded in the retention audit
        log, which outlives the tenant. To stop a tenant without deleting
        its data, PATCH `disabled: true` instead.
      security:
        - OperatorToken: []
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must repeat the tenant id
          schema:
            type: string
      responses:
        '200':
          description: Rows deleted per table
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  tenant_existed:
                    type: boolean
                  rows_deleted:
                    type: object
                    additionalProperties:
                      type: integer
                required: [tenant_id, tenant_existed, rows_deleted]
        '400':
          description: '`confirm` does not equal the tenant id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/operator/tenants/{tenant_id}/admin-tokens:
    parameters:
      - $ref: '#/components/parameters/TenantIdPathParam'
    post:
      operationId: bootstrapAdminToken
      tags: [Operator]
      summary: Issue a scoped admin token for a tenant
      description: |
        How a tenant's first admin token is made, for example when
        `PS_ADMIN_REQUIRE_SCOPED_TOKENS` is on and no tenant key may call
        `/api/v1/admin/tokens`. Any scope may be granted. The token is
        returned once.
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapAdminTokenRequest'
      responses:
        '201':
          description: The token, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenWithSecret'
        '400':
          description: Unknown scope, or `expires_at` not in the future
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: An unrevoked token with this name exists

  /api/v1/operator/tenants/{tenant_id}/retention:
    parameters:
      - $ref: '#/components/parameters/TenantIdPathParam'
    get:
      operationId: getTenantRetention
      tags: [Operator]
      summary: Show a tenant's retention period
      security:
        - OperatorToken: []
      responses:
        '200':
          description: Effective retention and the current cutoff
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  retention_days:
                    type: integer
                  cutoff:
                    type: string
                    format: date-time
                required: [tenant_id, retention_days, cutoff]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
    put:
      operationId: setTenantRetention
      tags: [Operator]
      summary: Set a tenant's retention period
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 36500
                  description: null clears the override (`PS_RETENTION_DAYS_DEFAULT` applies)
      responses:
        '200':
          description: The effective retention
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                    format: uuid
                  retention_days:
                    type: integer
                required: [tenant_id, retention_days]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'

  /api/v1/operator/retention/purge:
    post:
      operationId: purgeExpiredEvents
      tags: [Operator]
      summary: Delete usage events past retention
      security:
        - OperatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: [string, 'null']
                  format: uuid
                  description: One tenant; omit for every tenant
                dry_run:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Per-tenant purge results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
