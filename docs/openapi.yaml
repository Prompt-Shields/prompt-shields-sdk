openapi: 3.1.0
info:
  title: Prompt Shields Partner API
  version: 1.0.0
  description: |
    The Prompt Shields Partner API provides read access to the AI Asset Registry.
    A few write routes (attestations, provider credentials) need scopes that
    are never granted by default. The tenant admin routes (`/api/v1/admin`)
    take a scoped admin token or the tenant API key instead, and the
    operator routes (`/api/v1/operator`) take the operator's
    `PS_ADMIN_TOKEN`.

    Enterprise Architecture tools (Ardoq, LeanIX, ServiceNow) use this API to pull
    discovered AI assets, data flows, risk mappings, and usage metadata into their
    platforms for governance and strategic alignment.
  contact:
    name: Prompt Shields Developer Support
    email: partners@promptshields.io
    url: https://promptshields.io/partners
  license:
    name: Proprietary
    url: https://promptshields.io/terms

servers:
  - url: https://api.promptshields.io
    description: Production
  - url: https://sandbox.api.promptshields.io
    description: Sandbox (synthetic data)

security:
  - OAuth2: [assets:read]
  - PartnerApiKey: []

tags:
  - name: Assets
    description: AI asset discovery and registry
  - name: Taxonomy
    description: AI vendors, models, and business units
  - name: Sync
    description: Delta feeds and bulk export for EA tool integration
  - name: Auth
    description: OAuth 2.0 token management
  - name: MCP
    description: |
      MCP servers and tools seen in the tenant's telemetry (SDK
      instrumentation, the gateway's MCP proxy, OpenTelemetry MCP spans),
      their daily tool-call metering, and the registry asset each named
      server is registered as (vendor `mcp`, model = server name), with its
      owner. Names and numbers only: tool arguments and results are never
      stored.
  - name: Provider Credentials
    description: |
      Write-only provider admin keys for the usage pull, and links from
      provider key ids to SDK key fingerprints. The same routes are served
      under `/partner/v1` (scope `provider-credentials:manage`) and under
      `/api/v1/admin` (tenant API key). Every call is audited (path and
      status, never the body).
  - name: Webhooks
    description: |
      Tenant admin API (`/api/v1/admin/webhooks`, tenant API key) for
      partner change webhooks: subscriptions, secret rotation and the
      delivery (dead-letter) view.
  - name: Admin
    description: |
      Tenant admin API (`/api/v1/admin`): scoped admin tokens, tenant ingest
      keys, Partner API credentials and registry jobs. Each operation names
      its scope in `x-admin-scope`; GET operations also accept `admin:read`.
      Changes are audited. Conventions for keys, tokens and credentials:
      stable UUID ids, secrets returned once, POST with a name an unrevoked
      row already has is 409, and DELETE revokes (204, the row stays
      readable by id with `status: revoked`, a repeated DELETE is 204).
  - name: Learner
    description: |
      Routing learner (`recommend` mode, PRD 0001 §7.13): versioned
      snapshots uploaded by the customer-side learner, and the route changes
      they recommend, each with an off-policy projection, a human
      accept/reject decision and, once accepted, realised vs. projected
      savings. Nothing here routes traffic.
  - name: Ingest
    description: |
      Telemetry ingest routes the SDK and the gateway call with the tenant's
      own API key. Only call feedback and learner snapshots are documented
      here.
  - name: Operator
    description: |
      Cross-tenant operator routes (`PS_ADMIN_TOKEN`): tenants, retention,
      erasure, and the operator-triggered pulls and syncs.

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: |
        OAuth 2.0 Client Credentials flow. Exchange your `client_id` and `client_secret`
        for a short-lived access token.
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            assets:read: Read AI assets, vendors, models, business units
            data-flows:read: Read data flow lineage per asset
            risks:read: Read risk mappings per asset
            usage:read: Read aggregated usage statistics
            export:read: Access bulk export endpoint
            changes:read: Access delta feed endpoint
            webhooks:manage: Manage webhook subscriptions (never granted by default)
            attestations:write: Record human attestations, including retiring and un-retiring assets (never granted by default)
            risks:review: Confirm or reject risk mappings, with reviewer and comment (never granted by default)
            provider-credentials:manage: Store, rotate and delete provider admin keys and key fingerprint links (never granted by default)
            audit:read: Receive the tenant's admin audit trail as `audit.*` webhook events, or pull it from `/siem/audit` (never granted by default)
            evidence:read: Pull per-call routing evidence as NDJSON from `/siem/calls` (never granted by default)
            mcp:read: Read observed MCP servers and tools, with each server's asset and owner, and their daily tool-call metering (never granted by default)
            learner:read: List routing learner snapshots and recommendations, with projected and realised savings (never granted by default)
            learner:review: Accept or reject routing learner recommendations, with reviewer and comment (never granted by default)
            spend-alerts:read: List spend anomaly alerts and receive them as `spend.anomaly` webhook events (never granted by default)
            spend-alerts:acknowledge: Acknowledge spend anomaly alerts (never granted by default)
            usage:export: Bulk export AI usage cost in the FinOps FOCUS format (never granted by default)
            registry:read: Legacy Phase 1 scope; equals the six read scopes above

    PartnerApiKey:
      type: http
      scheme: bearer
      description: |
        Fallback authentication using a Partner API Key. Use this when OAuth
        is not supported by your integration tool (e.g., Ardoq Integration Builder).

        Pass your API key as a Bearer token:
        ```
        Authorization: Bearer ps-pk-your-key-here
        ```

    TenantApiKey:
      type: http
      scheme: bearer
      description: |
        The tenant's own API key (the one the SDK ingests with), for the
        tenant admin routes under `/api/v1/admin`. Partners never hold it.

        After `PS_AUTH_FAILURE_LIMIT_PER_MINUTE` failed tenant key or admin
        token checks from one client address in a minute, a request with an
        unknown, revoked or expired key or token gets `429` with
        `Retry-After` instead of `401` until the minute ends. A valid key or
        token is never held back.

    AdminToken:
      type: http
      scheme: bearer
      description: |
        A tenant-scoped automation token (`ps-at-...`) for the tenant admin
        routes under `/api/v1/admin`, for Terraform, CI and other
        automation. Each operation names the scope it needs in
        `x-admin-scope`; GET operations also accept `admin:read`. Issue one
        with `POST /api/v1/admin/tokens` or, for a tenant's first token,
        `POST /api/v1/operator/tenants/{tenant_id}/admin-tokens`.

        Every operation that takes an admin token also takes the tenant API
        key (`TenantApiKey`), which has every admin scope. A collector
        started with `PS_ADMIN_REQUIRE_SCOPED_TOKENS=true` refuses tenant
        API keys on `/api/v1/admin` (403), so only admin tokens get in.

    OperatorToken:
      type: http
      scheme: bearer
      description: |
        The collector operator's `PS_ADMIN_TOKEN`, for the cross-tenant
        operator routes (`/api/v1/operator`, and the operator-triggered
        pulls and syncs under `/api/v1/admin`). With `PS_ADMIN_TOKEN` unset
        those routes answer 404. Never put it in automation that manages a
        single tenant; use an admin token.

  schemas:
    AIAsset:
      type: object
      description: A discovered AI use case within the organization
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier (UUIDv7, time-sortable)
          example: "019e1a2b-3c4d-7000-8000-000000000001"
        vendor:
          type: string
          description: AI provider name
          example: "openai"
          enum: [openai, anthropic, google, microsoft, meta, cohere, mistral, custom]
        model:
          type: string
          description: Specific model identifier
          example: "gpt-4o"
          nullable: true
        use_case_name:
          type: string
          description: Business name for this AI use case
          example: "interview-screening"
          nullable: true
        business_unit:
          type: string
          description: Organizational unit using this AI
          example: "HR"
          nullable: true
        owner_email:
          type: string
          format: email
          description: Responsible person's email
          example: "jane.doe@acme.com"
          nullable: true
        environment:
          type: string
          description: Deployment environment
          enum: [production, staging, dev]
          example: "production"
          nullable: true
        region:
          type: string
          description: Cloud region the asset is deployed in, from the cloud inventory platform signal
          example: "swedencentral"
          nullable: true
        modality:
          type: string
          description: What the asset works on, from the first telemetry event that reported it (the gateway sets it from the endpoint; chat, embeddings and rerank are `text`, OCR is `document`). Null when no event reported a known one; other values are dropped at ingest and counted as `modality:invalid` in telemetry loss.
          enum: [text, image, audio, document, null]
          example: "audio"
          nullable: true
        status:
          type: string
          description: Governance status
          enum: [active, deprecated, under_review]
          example: "active"
        data_classification:
          type: string
          description: Highest data sensitivity level
          enum: [public, internal, confidential, restricted]
          example: "confidential"
          nullable: true
        discovery_source:
          type: array
          items:
            type: string
            enum: [sdk, gateway, browser_extension, macos_app, platform_signal, survey, otel, code_scan, kong]
          description: How this asset was discovered (multiple sources = higher confidence)
          example: ["sdk", "browser_extension"]
        confidence:
          type: string
          description: Discovery confidence level (based on number of corroborating sources)
          enum: [low, medium, high, verified]
          example: "verified"
        first_seen:
          type: string
          format: date-time
          description: When this asset was first discovered
          example: "2026-03-01T10:00:00Z"
        last_seen:
          type: string
          format: date-time
          description: Most recent activity timestamp
          example: "2026-03-25T14:22:00Z"
        lifecycle_state:
          type: string
          description: >
            Telemetry-driven lifecycle. `stale` and then `retired` after no
            sighting for a number of days that depends on the asset's
            discovery sources (e.g. platform_signal 7 and 30, code_scan 90
            and 180, sdk/gateway/otel and others 30 and 90; the most
            lenient of the asset's sources applies). New telemetry makes the
            asset `active` again, unless its owner retired it (`retired_by`).
            Independent of the governance `status`.
          enum: [active, stale, retired]
          example: "active"
        lifecycle_changed_at:
          type: string
          format: date-time
          description: When `lifecycle_state` last changed (for an owner-retired asset, when the owner retired it)
          nullable: true
          example: null
        retired_by:
          type: string
          description: >
            Who retired the asset, from an `asset` attestation with state
            `retired`; null unless its owner retired it. An owner-retired
            asset stays `retired` when it is seen again.
          nullable: true
          example: null
        retired_in_use_at:
          type: string
          format: date-time
          description: >
            First sighting of an owner-retired asset since it was retired
            ("retired asset still in use"). Cleared when the owner retires
            it again or un-retires it.
          nullable: true
          example: null
        attestation:
          type: object
          description: >
            Human sign-off per attestable field (`asset`, `owner`,
            `data_classification`). Separate from `confidence`, which only
            counts agreeing discovery sources and is never changed by an
            attestation.
          additionalProperties:
            $ref: '#/components/schemas/AttestationStatus'
      required:
        - id
        - vendor
        - model
        - use_case_name
        - business_unit
        - owner_email
        - environment
        - status
        - data_classification
        - discovery_source
        - confidence
        - first_seen
        - last_seen

    DataFlow:
      type: object
      description: Data lineage record for an AI asset
      properties:
        id:
          type: string
          format: uuid
        source_system:
          type: string
          description: Where data comes from
          example: "candidates_db"
        destination_system:
          type: string
          description: Where output goes
          example: "hiring_dashboard"
        data_classification:
          type: string
          enum: [public, internal, confidential, restricted]
          nullable: true
        direction:
          type: string
          enum: [input, output]
        detected_pii_types:
          type: array
          items:
            type: string
          description: PII categories detected in this data flow
          example: ["name", "email", "phone"]
          nullable: true
      required:
        - id
        - source_system
        - destination_system
        - data_classification
        - direction
        - detected_pii_types

    RiskMapping:
      type: object
      description: |
        Risk assessment linked to an AI asset. Rows with `status: suggested`
        come from the rules engine and are suggestions, not determinations:
        a human confirms or rejects them.
      properties:
        id:
          type: string
          format: uuid
        risk_category:
          type: string
          description: |
            Hand-entered mappings typically use strategic, operational,
            compliance, cyber or reputational. Suggestions use the framework's
            own category, e.g. `employment` (EU AI Act Annex III point 4) or
            `privacy` (NIST AI RMF).
          example: "compliance"
        risk_level:
          type: string
          enum: [critical, high, medium, low]
          example: "high"
        framework:
          type: string
          description: Governance framework this risk maps to
          enum: [NIST_AI_RMF, ISO_42001, EU_AI_ACT, custom]
          example: "EU_AI_ACT"
          nullable: true
        status:
          type: string
          enum: [suggested, confirmed, rejected]
          description: Hand-entered mappings are `confirmed`.
          example: "suggested"
        source:
          type: string
          enum: [manual, rules]
          example: "rules"
        rule_id:
          type: string
          nullable: true
          description: Rule that produced the suggestion
          example: "eu_ai_act.annex_iii.4a.recruitment"
        ruleset_version:
          type: string
          nullable: true
          example: "1.0.0"
        framework_ref:
          type: string
          nullable: true
          description: Where in the framework the rule points
          example: "Annex III, point 4(a)"
        confidence:
          type: string
          nullable: true
          enum: [low, medium, high, null]
          example: "high"
        evidence:
          type: object
          nullable: true
          description: |
            Why the rule fired: `summary` (one line), `rule_title`, `ruleset`
            and `signals`, each `{signal, value, matched, role}` where role is
            `trigger` or `supporting`.
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewed_by:
          type: string
          nullable: true
          description: The person who confirmed or rejected the mapping
          example: "dpo@example.com"
        review_comment:
          type: string
          nullable: true
          description: The reviewer's comment on the latest review
          example: "Screens applicants for open roles; in scope of Annex III 4(a)."
      required:
        - id
        - risk_category
        - risk_level
        - framework
        - status
        - source

    UsageSummary:
      type: object
      description: Aggregated usage statistics for an AI asset
      properties:
        total_requests:
          type: integer
          example: 15420
        total_tokens_in:
          type: integer
          example: 3250000
        total_tokens_out:
          type: integer
          example: 6100000
        total_tokens_cached:
          type: integer
          description: Prompt tokens read from the provider's prompt cache (part of total_tokens_in). 0 when no event reported them.
          example: 1200000
        total_tokens_cache_write:
          type: integer
          description: Prompt tokens written to the provider's prompt cache (part of total_tokens_in). 0 when no event reported them.
          example: 80000
        total_tokens_reasoning:
          type: integer
          description: Reasoning tokens (part of total_tokens_out). 0 when no event reported them.
          example: 900000
        estimated_cost_usd:
          type: number
          format: float
          nullable: true
          description: Null when no event in the period reported a cost (0 would claim a measurement)
          example: 482.50
        unique_sessions:
          type: integer
          example: 312
        avg_latency_ms:
          type: integer
          nullable: true
          description: Null when no event in the period reported a latency
          example: 380
        savings_usd:
          type: number
          format: float
          nullable: true
          description: >
            Sum of `counterfactual_cost - cost` (USD) over events that reported
            both: what routed calls would have cost on their baseline model,
            minus what they cost. Negative when routing cost more. Null when
            no event in the period reported both.
          example: 120.75
        fallback_rate:
          type: number
          format: float
          nullable: true
          description: >
            Share (0 to 1) of events reporting a `fallback_chain` whose chain
            is not empty, i.e. at least one upstream attempt failed before the
            call was served. Null when no event in the period reported one.
          example: 0.0125
        sovereign_share:
          type: number
          format: float
          nullable: true
          description: >
            Share (0 to 1) of events reporting a `served_jurisdiction` whose
            jurisdiction is `EEA` or an EEA country code. Events that did not
            report a jurisdiction are left out. Null when no event in the
            period reported one. This is a share by jurisdiction only: the
            jurisdiction is the one the route policy states for the serving
            tier, so a US-headquartered provider's EU region counts when the
            policy marks it `EEA`. It says nothing about US CLOUD Act
            exposure. See `GET /partner/v1/usage/sovereign-share`.
          example: 0.62
        budget_downgraded_requests:
          type: integer
          nullable: true
          description: >
            Events whose `budget_action` is `downgraded`: a spend budget moved
            the call to a cheaper model (SDK or gateway budgets). Null when no
            event in the period reported a `budget_action`.
          example: 14
        budget_blocked_requests:
          type: integer
          nullable: true
          description: >
            Events whose `budget_action` is `blocked`: calls the gateway
            refused for a spend budget (HTTP 429, or 503 when the budget
            store is down and `on_store_error` is closed). The gateway sends
            one event per refused call, with no usage or cost; gateways
            before this change and the SDK send none. Null when no event in
            the period reported a `budget_action`.
          example: 0
        cache_hit_rate:
          type: number
          format: float
          nullable: true
          description: >
            Share (0 to 1) of the gateway's cache lookups that were served
            from the cache (exact or semantic hit). Each call's event carries
            its lookup's `cache_status`; a hit is counted from its
            `cost_source: cache` event only, so the cache-only events older
            gateways also sent do not count a hit twice. Null when no lookup
            was reported in the period.
          example: 0.31
        cache_saved_usd:
          type: number
          format: float
          nullable: true
          description: >
            Sum of `cache_saved_cost` (USD): the upstream cost that gateway
            cache hits avoided. Null when no event in the period reported one.
          example: 18.4
        outcome_signals_reported:
          type: integer
          description: >
            Events in the period that reported `outcome_signals` (implicit
            outcome signals from the SDK or gateway), including events that
            reported an empty list (measured, nothing happened).
          example: 15000
        outcome_signal_counts:
          type: object
          nullable: true
          description: >
            Per outcome class, the number of events that carried it. Every
            class is listed (0 when none carried it): `abandoned`, `fallback`,
            `max_tokens`, `refusal`, `regenerate`, `retry`, `schema_invalid`,
            `stream_error`, `tool_call_invalid`. An event can carry several
            classes. Null when no event in the period reported outcome signals.
          additionalProperties:
            type: integer
          example:
            abandoned: 3
            fallback: 12
            max_tokens: 40
            refusal: 2
            regenerate: 25
            retry: 6
            schema_invalid: 4
            stream_error: 1
            tool_call_invalid: 0
        period:
          type: string
          description: Time period for this summary
          example: "30d"
      required:
        - total_requests
        - total_tokens_in
        - total_tokens_out
        - total_tokens_cached
        - total_tokens_cache_write
        - total_tokens_reasoning
        - estimated_cost_usd
        - unique_sessions
        - avg_latency_ms
        - savings_usd
        - fallback_rate
        - sovereign_share
        - budget_downgraded_requests
        - budget_blocked_requests
        - cache_hit_rate
        - cache_saved_usd
        - outcome_signals_reported
        - outcome_signal_counts
        - period

    SavingsTotals:
      type: object
      description: >
        Realised routing savings over a set of usage events. An event counts
        towards savings only when it reported both `cost` and
        `counterfactual_cost` (what the call would have cost on its baseline
        model). An event missing either one still counts in `total_requests`
        and `estimated_cost_usd`, but adds nothing to `compared_cost_usd`,
        `counterfactual_cost_usd` or `savings_usd`: a missing counterfactual
        means "not measured", never "saved nothing".
      properties:
        total_requests:
          type: integer
          example: 15420
        estimated_cost_usd:
          type: number
          format: float
          nullable: true
          description: Sum of `cost` over every event. Null when no event reported a cost.
          example: 482.5
        requests_with_counterfactual:
          type: integer
          description: Events that reported both `cost` and `counterfactual_cost`.
          example: 12000
        counterfactual_coverage:
          type: number
          format: float
          nullable: true
          description: requests_with_counterfactual / total_requests (0 to 1). Null when there were no requests.
          example: 0.7782
        compared_cost_usd:
          type: number
          format: float
          nullable: true
          description: Sum of `cost` over the events that reported both costs. Null when none did.
          example: 310.2
        counterfactual_cost_usd:
          type: number
          format: float
          nullable: true
          description: Sum of `counterfactual_cost` over the events that reported both costs. Null when none did.
          example: 430.95
        savings_usd:
          type: number
          format: float
          nullable: true
          description: >
            counterfactual_cost_usd - compared_cost_usd. Negative when routing
            cost more than the baseline. Null when no event reported both costs.
          example: 120.75
        savings_rate:
          type: number
          format: float
          nullable: true
          description: savings_usd / counterfactual_cost_usd. Null when either is null or the counterfactual is 0.
          example: 0.2802
      required:
        - total_requests
        - estimated_cost_usd
        - requests_with_counterfactual
        - counterfactual_coverage
        - compared_cost_usd
        - counterfactual_cost_usd
        - savings_usd
        - savings_rate

    SavingsBreakdown:
      description: Savings for one bucket of a `group_by`.
      allOf:
        - type: object
          properties:
            key:
              type: string
              nullable: true
              description: >
                The bucket: the UTC start date (`YYYY-MM-DD`) for `day`, `week`
                (weeks start on Monday) and `month`; the asset id for `asset`;
                the asset's use case or business unit for `use_case` and
                `business_unit`. Null for assets without a use case or business unit.
              example: "support"
          required:
            - key
        - $ref: '#/components/schemas/SavingsTotals'

    SavingsReport:
      type: object
      description: Tenant-wide routing savings over the period, in total and per bucket.
      properties:
        period:
          type: string
          enum: [7d, 30d, 90d]
          example: "30d"
        group_by:
          type: string
          enum: [none, day, week, month, asset, use_case, business_unit]
          example: use_case
        total:
          $ref: '#/components/schemas/SavingsTotals'
        data:
          type: array
          description: One entry per bucket, ordered by key (null last). Empty when `group_by` is `none`.
          items:
            $ref: '#/components/schemas/SavingsBreakdown'
      required:
        - period
        - group_by
        - total
        - data

    SovereignShareTotals:
      type: object
      description: >
        Share of calls and spend served in a sovereign jurisdiction (`EEA` or
        an EEA country code, see `sovereign_jurisdictions`). Events that did
        not report a `served_jurisdiction` are left out of both sides of each
        share. The jurisdiction is the one the route policy states for the
        serving tier, so a US-headquartered provider's EU region counts when
        the policy marks it `EEA`. US CLOUD Act exposure is not stored per
        event, so this is a jurisdiction share, not a sovereignty guarantee
        or a legal assessment.
      properties:
        total_requests:
          type: integer
          example: 15420
        requests_with_jurisdiction:
          type: integer
          description: Events that reported a `served_jurisdiction`.
          example: 9000
        sovereign_requests:
          type: integer
          description: Events served in a sovereign jurisdiction.
          example: 5580
        request_share:
          type: number
          format: float
          nullable: true
          description: sovereign_requests / requests_with_jurisdiction (0 to 1). Null when no event reported a jurisdiction.
          example: 0.62
        cost_with_jurisdiction_usd:
          type: number
          format: float
          nullable: true
          description: Sum of `cost` over events that reported a jurisdiction. Null when none reported a cost.
          example: 300.4
        sovereign_cost_usd:
          type: number
          format: float
          nullable: true
          description: Sum of `cost` over sovereign events. 0 when costs were reported but none was sovereign; null when no cost was reported.
          example: 140.1
        spend_share:
          type: number
          format: float
          nullable: true
          description: sovereign_cost_usd / cost_with_jurisdiction_usd. Null when that is null or 0.
          example: 0.4664
      required:
        - total_requests
        - requests_with_jurisdiction
        - sovereign_requests
        - request_share
