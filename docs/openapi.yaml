  /partner/v1/changes:
    get:
      operationId: getChanges
      tags: [Sync]
      summary: Get change feed
      description: |
        Returns assets that were created, updated, or deactivated since a given
        timestamp. Use this for efficient delta sync instead of re-fetching all assets.

        **Recommended pattern:**
        1. First sync: call `/partner/v1/export` for full data
        2. Store `sync_token` from response meta
        3. Subsequent syncs: call `/partner/v1/changes?since={sync_token}`
        4. Update `sync_token` after each successful sync
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Return changes after this timestamp (use sync_token from previous response)
          example: "2026-03-25T10:00:00Z"
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/AfterParam'
      security:
        - OAuth2: [changes:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Change feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - change_type: "created"
                    asset:
                      id: "019e1a2b-3c4d-7000-8000-000000000005"
                      vendor: "anthropic"
                      model: "claude-sonnet-4-20250514"
                      use_case_name: "contract-review"
                      business_unit: "Legal"
                      owner_email: "sam.lee@acme.com"
                      environment: "production"
                      status: "active"
                      data_classification: "confidential"
                      confidence: "high"
                      discovery_source: ["gateway"]
                      first_seen: "2026-03-25T14:00:00Z"
                      last_seen: "2026-03-25T14:00:00Z"
                    changed_at: "2026-03-25T14:00:00Z"
                    changed_fields: null
                  - change_type: "updated"
                    asset:
                      id: "019e1a2b-3c4d-7000-8000-000000000001"
                      vendor: "openai"
                      model: "gpt-4o"
                      use_case_name: "interview-screening"
                      business_unit: "HR"
                      owner_email: "jane.doe@acme.com"
                      environment: "production"
                      status: "active"
                      data_classification: "confidential"
                      confidence: "verified"
                      discovery_source: ["sdk", "browser_extension"]
                      first_seen: "2026-03-01T10:00:00Z"
                      last_seen: "2026-03-25T15:01:00Z"
                    changed_at: "2026-03-25T15:01:00Z"
                    changed_fields: ["confidence", "discovery_source", "last_seen"]
                meta:
                  total: 2
                  has_more: false
                  next_cursor: null
                  sync_token: "2026-03-25T15:01:00Z"

  /partner/v1/siem/calls:
    get:
      operationId: pullSiemCalls
      tags: [Sync]
      summary: Per-call routing evidence as NDJSON (SIEM export)
      description: |
        One `AICall` record per model call, in the Microsoft Sentinel table
        schema `PromptShieldsAudit_CL` (see the Microsoft Sentinel
        integration guide): served provider, model and jurisdiction, route
        policy version, sensitivity level and source, route mode, group and
        reason, fallback chain, cost and tokens. Metadata only.

        Ordered by call time. Only calls older than `settle_seconds` are
        returned. `X-PS-Cursor` is the position after the last line: pass
        it back as `cursor`. `X-PS-Has-More: true` means call again now.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: '`X-PS-Cursor` of the previous call'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Start time when there is no cursor
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - name: settle_seconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 86400
            default: 300
          description: Leave out calls newer than this, so late-delivered events are not skipped
      security:
        - OAuth2: [evidence:read]
        - PartnerApiKey: []
      responses:
        '400':
          description: Invalid cursor or `since`
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: NDJSON, one record per line
          headers:
            X-PS-Cursor:
              schema:
                type: string
            X-PS-Has-More:
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/x-ndjson:
              schema:
                type: string

  /partner/v1/siem/audit:
    get:
      operationId: pullSiemAudit
      tags: [Sync]
      summary: Audit trail rows with chain hashes as NDJSON (SIEM export)
      description: |
        One `Audit` record per row of the tenant's hash-chained audit trail,
        in chain order, with `PsAuditSeq`, `PsAuditPrevHash` and
        `PsAuditRowHash`, in the Microsoft Sentinel table schema
        `PromptShieldsAudit_CL`. `X-PS-Cursor` is the `seq` of the last line.
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
            minimum: 0
          description: '`X-PS-Cursor` of the previous call'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Start time when there is no cursor
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
      security:
        - OAuth2: [audit:read]
        - PartnerApiKey: []
      responses:
        '400':
          description: Invalid `since`
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: NDJSON, one record per line
          headers:
            X-PS-Cursor:
              schema:
                type: string
            X-PS-Has-More:
              schema:
                type: string
                enum: ['true', 'false']
          content:
            application/x-ndjson:
              schema:
                type: string

  /partner/v1/export:
    get:
      operationId: exportRegistry
      tags: [Sync]
      summary: Export full registry
      description: |
        Returns the complete AI asset registry as a single JSON payload.
        Use for initial sync or full refresh. For subsequent syncs, use
        the `/changes` endpoint instead.

        **Warning:** This endpoint may return large payloads. Use streaming
        where supported by your HTTP client.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, cyclonedx]
            default: json
          description: |
            Export format. `json` is the registry envelope below. `cyclonedx`
            is a CycloneDX 1.6 AI-BOM (`application/vnd.cyclonedx+json; version=1.6`):
            each asset is an `application` component whose Prompt Shields data
            (vendor, model, modality, discovery sources, confidence, owner, risk
            classifications, ...) is carried as `promptshields:<name>` properties,
            for example `promptshields:modality` = `audio`. Human attestation is
            carried next to `promptshields:confidence`, never folded into it:
            `promptshields:attestation:<field>` is the state of each attestable
            field (`unreviewed` when nobody has attested it) and, for an
            attested field, `…:attested_by`, `…:attested_at` and
            `…:value_changed` (`true` when the value moved since the sign-off).
            Attestation comments are not exported.
      security:
        - OAuth2: [export:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Full registry export
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIAsset'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      exported_at:
                        type: string
                        format: date-time
                      sync_token:
                        type: string
                        description: Use as `since` parameter for delta sync
                      tenant_id:
                        type: string
                        format: uuid
                        description: Tenant of the credential that made the request
                    required: [total, exported_at, sync_token]
            application/vnd.cyclonedx+json:
              schema:
                type: object
                description: CycloneDX 1.6 BOM (`format=cyclonedx`), valid against the official CycloneDX 1.6 JSON schema.

