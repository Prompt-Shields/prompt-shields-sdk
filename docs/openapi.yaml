    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
    post:
      operationId: rotateProviderCredential
      tags: [Provider Credentials]
      summary: Replace a stored provider admin key
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredential'
