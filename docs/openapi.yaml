  # ── Webhook subscriptions (tenant admin, #103) ────────────────────────

  /api/v1/admin/webhooks/subscriptions:
    post:
      operationId: createWebhookSubscription
      tags: [Webhooks]
      summary: Subscribe a partner to asset change events
      description: |
        The tenant, not the partner, decides where its registry data is
        pushed. The URL must be `https` with a public host. The signing
        secret is returned once, in this response.
      security:
        - TenantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookSubscriptionRequest'
      responses:
        '201':
          $ref: '#/components/responses/WebhookSubscriptionWithSecret'
        '400':
          description: >-
            Invalid URL, a partner that cannot receive these events (revoked,
            expired or missing a scope), or the per-partner subscription limit
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Partner credential not found in this tenant
        '503':
          description: Webhooks are not configured on this collector (no `PS_WEBHOOK_SECRET_KEYS`)
    get:
      operationId: listWebhookSubscriptions
      tags: [Webhooks]
      summary: List webhook subscriptions
      security:
        - TenantApiKey: []
      parameters:
        - name: partner_id
          in: query
          schema:
            type: string
            format: uuid
          description: Only this partner's subscriptions
      responses:
        '200':
          description: Subscriptions, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/webhooks/subscriptions/{subscription_id}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionIdPathParam'
    get:
      operationId: getWebhookSubscription
      tags: [Webhooks]
      summary: Get a webhook subscription
      security:
        - TenantApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWebhookSubscription
      tags: [Webhooks]
      summary: Change a subscription's URL or event types, or pause and resume it
      description: |
        Changing the event types or resuming needs a partner that may receive
        them, as on create; pausing never does, so a revoked partner's
        subscription can still be paused. Audited with the names of the
        changed fields (not their values).
      security:
        - TenantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookSubscription'
        '400':
          description: Invalid URL, or a partner that cannot receive these events
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Empty body, a null field or an unknown field
    delete:
      operationId: deleteWebhookSubscription
      tags: [Webhooks]
      summary: Delete a subscription and its queued and past deliveries
      security:
        - TenantApiKey: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/webhooks/subscriptions/{subscription_id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/SubscriptionIdPathParam'
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Replace the signing secret
      description: |
        Returns the new secret once. With `grace_period_seconds` the old
        secret keeps signing too (a second `v1=` signature) until the grace
        period ends, so the receiver can switch without dropping deliveries.
        The body is optional.
      security:
        - TenantApiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSecretRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookSubscriptionWithSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A grace period was asked for but the current secret cannot be read; rotate without one
        '503':
          description: Webhooks are not configured on this collector

  /api/v1/admin/webhooks/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List webhook deliveries (dead letters by default)
      security:
        - TenantApiKey: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, succeeded, dead]
            default: dead
        - name: subscription_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                required: [data]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/webhooks/deliveries/{delivery_id}/redeliver:
    parameters:
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: redeliverWebhook
      tags: [Webhooks]
      summary: Queue a delivery again
      description: Resets the attempt count and queues the delivery for the next worker run.
      security:
        - TenantApiKey: []
      responses:
        '200':
          description: The delivery, now `pending`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The delivery is already queued
