    ChangeEvent:
      type: object
      description: A change to an AI asset (for delta sync)
      properties:
        change_type:
          type: string
          enum: [created, updated, deactivated]
          description: Type of change
        asset:
          $ref: '#/components/schemas/AIAsset'
        lifecycle_change:
          type: string
          enum: [stale, retired, reactivated, retired_in_use]
          nullable: true
          description: >
            Lifecycle transition since `since`, or null if none.
            `retired_in_use`: an owner-retired asset was seen again.
        attestation_changes:
          type: array
          items:
            type: string
          description: Fields whose attestation changed since `since`
          example: ["owner"]
        changed_at:
          type: string
          format: date-time
        changed_fields:
          type: array
          items:
            type: string
          description: Which fields changed (null for created)
          nullable: true
          example: ["confidence", "discovery_source", "last_seen"]
      required: [change_type, asset, changed_at, changed_fields]

    AttestationStatus:
      type: object
      description: Current attestation of one field (its newest attestation)
      properties:
        state:
          type: string
          enum: [unreviewed, attested, disputed, retired]
        attested_by:
          type: string
          nullable: true
          example: "ciso@acme.com"
        attested_at:
          type: string
          format: date-time
          nullable: true
        comment:
          type: string
          nullable: true
        value_changed:
          type: boolean
          description: The registry value differs from the value that was attested
      required: [state, attested_by, attested_at, comment, value_changed]

    Attestation:
      type: object
      description: One immutable attestation record
      properties:
        id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        field:
          type: string
          example: "owner"
        state:
          type: string
          enum: [unreviewed, attested, disputed, retired]
        value:
          description: The field's value when the attestation was made
          nullable: true
          example: "jane.doe@acme.com"
        comment:
          type: string
          nullable: true
        attested_by:
          type: string
          example: "ciso@acme.com"
        attested_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [tenant, partner]
        partner_id:
          type: string
          format: uuid
          nullable: true
      required:
        - id
        - asset_id
        - field
        - state
        - value
        - comment
        - attested_by
        - attested_at
        - actor_type
        - partner_id

    RiskMappingReview:
      type: object
      description: |
        One immutable review of a risk mapping (append-only history). The
        mapping's latest review is also on the mapping itself (`status`,
        `reviewed_at`, `reviewed_by`, `review_comment`).
      properties:
        id:
          type: string
          format: uuid
        risk_mapping_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
          description: The asset the mapping belonged to when it was reviewed
        status:
          type: string
          enum: [confirmed, rejected]
        previous_status:
          type: string
          nullable: true
          enum: [suggested, confirmed, rejected, null]
          description: Status before this review; null for reviews made before the history existed
        comment:
          type: string
          nullable: true
        reviewed_by:
          type: string
          example: "dpo@example.com"
        reviewed_at:
          type: string
          format: date-time
        actor_type:
          type: string
          description: The credential that recorded the review
          enum: [tenant_key, admin_token, partner]
        partner_id:
          type: string
          format: uuid
          nullable: true
        mapping:
          type: object
          nullable: true
          description: |
            The mapping as reviewed: `risk_category`, `risk_level`,
            `framework`, `rule_id`, `ruleset_version`, `framework_ref`.
      required:
        - id
        - risk_mapping_id
        - asset_id
        - status
        - previous_status
        - comment
        - reviewed_by
        - reviewed_at
        - actor_type
        - partner_id
        - mapping

    RiskReviewRequest:
      type: object
      required: [status, reviewed_by]
      properties:
        status:
          type: string
          enum: [confirmed, rejected]
        reviewed_by:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            The person deciding, e.g. an email. Asserted by the caller (API
            keys and partner tokens are machine credentials); the authenticated
            credential is recorded alongside it.
          example: "dpo@example.com"
        comment:
          type: string
          nullable: true
          maxLength: 4000
          description: Why the mapping was confirmed or rejected

    RiskReviewHistory:
      type: object
      properties:
        data:
          type: array
          description: Newest first
          items:
            $ref: '#/components/schemas/RiskMappingReview'
        meta:
          type: object
          properties:
            total:
              type: integer
            current:
              description: The mapping now; null if it no longer exists
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RiskMapping'
          required: [total, current]
      required: [data, meta]

    AttestationRequest:
      type: object
      required: [field, state, attested_by]
      properties:
        field:
          type: string
          description: One of `asset`, `owner`, `data_classification`
          example: "owner"
        state:
          type: string
          enum: [unreviewed, attested, disputed, retired]
        attested_by:
          type: string
          description: >-
            The person signing off, e.g. an email. Asserted by the caller (API
            keys and partner tokens are machine credentials); the authenticated
            credential (tenant key prefix or partner id) is recorded alongside it.
          example: "ciso@acme.com"
        comment:
          type: string
          description: Required when `state` is `disputed`
          nullable: true

    SourceCoverage:
      type: object
      description: |
        Telemetry delivery for one source. `sdk` is the Prompt Shields SDKs,
        `gateway` the AI gateway, `otel` the OTLP GenAI receiver (one client
        per `service.name`), `kong` Kong's http-log plugin through
        `/ingest/kong` (one client) and `unidentified` events sent without
        delivery metadata (older clients).
      properties:
        source:
          type: string
          enum: [sdk, gateway, otel, kong, unidentified]
        clients:
          type: integer
          description: Distinct clients (SDK processes, gateway processes, OTel services) seen
          example: 4
        received_events:
          type: integer
          description: Events the collector stored
          example: 15420
        dropped_events:
          type: integer
          description: >-
            Events known to be lost: dropped by the client (buffer overflow,
            failed sends, unserialisable events) as it reported, and for
            `otel` the GenAI spans the collector rejected (no vendor,
            oversized request, failed write), and for `kong` the AI log
            entries of an accepted request that could not be mapped (Kong
            retries rejected requests, so those are not counted).
          example: 12
        unaccounted_events:
          type: integer
          description: >-
            Events a client reported queueing that neither arrived nor were
            reported dropped (in flight, or lost silently). Always 0 for
            `otel`, `kong` and `unidentified`, which report no counters.
          example: 3
        coverage:
          type: number
          format: float
          description: >-
            received / (received + dropped + unaccounted), 0 to 1. Null when
            nothing was expected, and always null for `unidentified`.
          nullable: true
          example: 0.999
        last_seen:
          type: string
          format: date-time
          nullable: true
      required:
        - source
        - clients
        - received_events
        - dropped_events
        - unaccounted_events
        - coverage
        - last_seen

    TelemetryCoverage:
      type: object
      description: How complete the tenant's usage telemetry is, overall and per source
      properties:
        coverage:
          type: number
          format: float
          description: Coverage over every source, 0 to 1; null when nothing was expected
          nullable: true
          example: 0.998
        received_events:
          type: integer
          example: 20410
        dropped_events:
          type: integer
          example: 30
        unaccounted_events:
          type: integer
          example: 5
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCoverage'
      required:
        - coverage
        - received_events
        - dropped_events
        - unaccounted_events
        - sources

    McpTool:
      type: object
      description: |
        One observed (source, server, tool, calling service, environment,
        user) combination, with lifetime counts. Names are data reported by
        MCP servers and apps: escape them when rendering.
      properties:
        server_name: {type: string}
        tool_name: {type: string}
        source:
          type: string
          enum: [sdk, gateway, otel, scan]
        calling_service: {type: string, nullable: true}
        environment: {type: string, nullable: true}
        transport: {type: string, nullable: true}
        call_count: {type: integer}
        error_count: {type: integer}
        blocked_count:
          type: integer
          description: Calls a guardrail blocked at the gateway (not errors)
        user_hash:
          type: string
          nullable: true
          description: Pseudonymous caller (the gateway's OIDC subject hash)
        user_group: {type: string, nullable: true}
        avg_latency_ms: {type: integer, nullable: true}
        first_seen: {type: string, format: date-time, nullable: true}
        last_seen: {type: string, format: date-time, nullable: true}
        asset_id:
          type: string
          format: uuid
          nullable: true
          description: The server's registry asset (vendor `mcp`); null for server `unknown`
        owner_email:
          type: string
          nullable: true
          description: |
            The server asset's owner: set in the registry, or taken from the
            gateway's server config (`owner`) while the asset has none.
      required: [server_name, tool_name, source, calling_service, environment, transport,
                 call_count, error_count, blocked_count, user_hash, user_group, avg_latency_ms,
                 first_seen, last_seen, asset_id, owner_email]

    McpUsageDay:
      type: object
      description: Tool-call metering for one MCP tool on one server on one UTC day, per source.
      properties:
        day: {type: string, format: date}
        source:
          type: string
          enum: [sdk, gateway, otel, scan]
        server_name: {type: string}
        tool_name: {type: string}
        call_count: {type: integer}
        error_count: {type: integer}
        blocked_count: {type: integer}
        latency_ms_total: {type: integer}
        latency_count:
          type: integer
          description: Calls that reported a latency
        avg_latency_ms: {type: integer, nullable: true}
        request_bytes:
          type: integer
          description: Request body bytes, summed over the calls that reported bytes (the gateway does)
        response_bytes:
          type: integer
          description: Response message bytes, summed over the calls that reported bytes
        bytes_count:
          type: integer
          description: Calls that reported bytes
        asset_id: {type: string, format: uuid, nullable: true}
        owner_email: {type: string, nullable: true}
      required: [day, source, server_name, tool_name, call_count, error_count, blocked_count,
                 latency_ms_total, latency_count, avg_latency_ms, request_bytes, response_bytes,
                 bytes_count, asset_id, owner_email]

    McpPageMeta:
      type: object
      properties:
        has_more: {type: boolean}
        next_cursor:
          type: string
          nullable: true
          description: Opaque; pass as `cursor` for the next page
      required: [has_more, next_cursor]

    McpToolPage:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/McpTool'}
        meta: {$ref: '#/components/schemas/McpPageMeta'}
      required: [data, meta]

    McpUsagePage:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/McpUsageDay'}
        meta:
          allOf:
            - $ref: '#/components/schemas/McpPageMeta'
            - type: object
              properties:
                since: {type: string, format: date}
                until: {type: string, format: date, nullable: true}
              required: [since, until]
      required: [data, meta]

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total matching records
        has_more:
          type: boolean
          description: Whether more pages exist
        next_cursor:
          type: string
          description: Cursor for next page (pass as `after` parameter)
          nullable: true
        sync_token:
          type: string
          description: >-
            Token for delta sync; pass it as `since` to the next /changes
            call. Returned by /changes (not by the /assets list); /export
            returns it in its meta too.
          nullable: true
        tenant_id:
          type: string
          format: uuid
          description: >-
            Tenant of the credential that made the request. Returned by
            /changes (not by the /assets list); /export and
            /assets/{asset_id}/data-flows return it in their meta too. Lets an
            integration check that its key belongs to the tenant it syncs.
      required: [total, has_more, next_cursor]

    Error:
      type: object
      description: RFC 7807 Problem Details error
      properties:
        type:
          type: string
          example: "about:blank"
        title:
          type: string
          example: "Unauthorized"
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: "Invalid or expired access token"

    CallFeedbackRequest:
      type: object
      description: |
        Explicit feedback on one LLM call (#43). Metadata only: there is no
        field for free text, and other fields are ignored.
      required: [call_id, score]
      properties:
        call_id:
          type: string
          pattern: '^[A-Za-z0-9._:-]{1,128}$'
          description: The call's id, as on its usage event (`call_id`), the SDK's `response.ps_call_id` or the gateway's `x-ps-call-id` header
        score:
          type: number
          minimum: 0
          maximum: 1
          description: 0 (bad) to 1 (good)
        reason:
          type: [string, 'null']
          enum: [correct, helpful, incorrect, incomplete, hallucination, off_topic, refusal, format_error, unsafe, too_slow, too_long, other, null]
        user_id:
          type: [string, 'null']
          pattern: '^[0-9a-f]{16,64}$'
          description: >-
            Hex hash of the user id (16-64 lowercase hex characters; the SDK
            and gateway hash it before sending). Anything else is refused
            with a 422, so a raw identifier is never stored. Rate-limited
            separately when sent
        source:
          type: string
          enum: [sdk, gateway]
          default: sdk

    CallFeedbackResult:
      type: object
      required: [call_id, created, matched]
      properties:
        call_id:
          type: string
        created:
          type: boolean
          description: False when it replaced an earlier feedback for the same call (the request is idempotent)
        matched:
          type: boolean
          description: Whether a usage event with this call_id has arrived for the tenant

    LearnerSnapshotSummary:
      type: object
      description: |
        One routing learner snapshot (#47, #48), without its state. The
        learner runs in the customer's environment in `recommend` mode and
        never routes traffic.
      properties:
        id:
          type: string
          format: uuid
        learner_version:
          type: string
          pattern: '^lv1-[0-9a-f]{16}$'
          description: Content hash of the snapshot (checked on upload), so a snapshot is reproducible from the same input and config
        parent_version:
          type: [string, 'null']
          description: The snapshot this one was warm-started from
        mode:
          type: string
          enum: [recommend]
        algorithm:
          type: string
          example: linear-thompson.v1
        feature_schema:
          type: [string, 'null']
          example: ps-prompt-features.v1
        policy_version:
          type: [string, 'null']
          description: The route policy whose candidates constrained the learner
        data_fingerprint:
          type: string
          description: SHA-256 of the training rows (as the learner parsed them)
        training_rows:
          type: integer
        scored_rows:
          type: integer
          description: Rows with a quality signal (shadow eval, feedback, eval score or implicit outcome)
        recommendations:
          type: integer
          description: Number of recommendations in the snapshot
        created_at:
          type: string
          format: date-time
      required:
        - id
        - learner_version
        - parent_version
        - mode
        - algorithm
        - feature_schema
        - policy_version
        - data_fingerprint
        - training_rows
        - scored_rows
        - recommendations
        - created_at

    LearnerSnapshot:
      allOf:
        - $ref: '#/components/schemas/LearnerSnapshotSummary'
        - type: object
          properties:
            snapshot:
              type: object
              description: |
                The whole document as uploaded (`ps-learner-snapshot.v1`):
                config, reward weights, per-group candidates and status,
                per-arm ridge statistics over local prompt features
                (aggregates only, never prompt text or embeddings), and the
                recommendations.
          required: [snapshot]

    LearnerArmProjection:
      type: object
      description: Off-policy estimate of routing the group's logged traffic to one model
      properties:
        model:
          type: string
        quality:
          type: number
        cost_per_call:
          type: number
        latency_ms:
          type: number
        reward:
          type: number
          description: quality − λ·cost − μ·latency(s)
        quality_method:
          type: string
          enum: [dm, dr]
          description: Direct method (regression), or doubly robust when logged propensities exist
        cost_method:
          type: string
          enum: [priced, regression]
          description: Counterfactual price of the logged token counts, or the cost regression

    LearnerRealised:
      type: object
      description: |
        Realised vs. projected, for an accepted recommendation: usage
        events of the recommendation's use case and sensitivity since the
        decision.
      properties:
        since:
          type: string
          format: date-time
        calls:
          type: integer
        calls_on_recommended:
          type: integer
        adoption:
          type: [number, 'null']
          description: Share of those calls served by the recommended model
        cost_per_call:
          type: [number, 'null']
        savings_per_call:
          type: [number, 'null']
          description: Projected current cost per call minus realised cost per call
        savings_pct:
          type: [number, 'null']
        projected_savings_pct:
          type: [number, 'null']
        delta_points:
          type: [number, 'null']
          description: (realised − projected savings share) × 100
        feedback_count:
          type: integer
          description: Explicit feedback on calls served by the recommended model
        feedback_quality:
          type: [number, 'null']
        projected_quality:
          type: [number, 'null']
      required:
        - since
        - calls
        - calls_on_recommended
        - adoption
        - cost_per_call
        - savings_per_call
        - savings_pct
        - projected_savings_pct
        - delta_points
        - feedback_count
        - feedback_quality
        - projected_quality

    LearnerRecommendation:
      type: object
      description: |
        A route change the learner proposes for one (use case, sensitivity),
        always one of that group's policy-compliant candidates. Accepting it
        changes no routing: the reviewer edits the route policy.
      properties:
        id:
          type: string
          format: uuid
        snapshot_id:
          type: string
          format: uuid
        learner_version:
          type: string
        use_case:
          type: [string, 'null']
        sensitivity_level:
          type: string
        current_model:
          type: string
          description: The model most of the group's logged traffic used
        recommended_model:
          type: string
        candidates:
          type: array
          items:
            type: string
          description: The models the route policy allows for the group (`provider:model`)
        projection:
          type: object
          description: Off-policy projection over the group's logged traffic
          properties:
            calls:
              type: integer
            current:
              $ref: '#/components/schemas/LearnerArmProjection'
            recommended:
              $ref: '#/components/schemas/LearnerArmProjection'
            quality_delta:
              type: number
            reward_delta:
              type: number
            savings_per_call:
              type: number
            savings_total:
              type: number
              description: savings_per_call × calls (over the logged window)
            savings_pct:
              type: number
            prob_best:
              type: number
              description: Share of Thompson-sampling draws in which the recommended model was best
            arm_samples:
              type: object
              additionalProperties:
                type: integer
        status:
          type: string
          enum: [pending, accepted, rejected, superseded]
        reviewed_by:
          type: [string, 'null']
        reviewed_at:
          type: [string, 'null']
          format: date-time
        review_comment:
          type: [string, 'null']
        reviewer_actor_type:
          type: [string, 'null']
          enum: [partner, null]
        created_at:
          type: string
          format: date-time
        realised:
          description: Null unless accepted
          oneOf:
            - $ref: '#/components/schemas/LearnerRealised'
            - type: 'null'
      required:
        - id
        - snapshot_id
        - learner_version
        - use_case
        - sensitivity_level
        - current_model
        - recommended_model
        - candidates
        - projection
        - status
        - reviewed_by
        - reviewed_at
        - review_comment
        - reviewer_actor_type
        - created_at
        - realised

    LearnerReviewRequest:
      type: object
      required: [decision, reviewed_by]
      properties:
        decision:
          type: string
          enum: [accepted, rejected]
        reviewed_by:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            The person deciding, e.g. an email. Asserted by the caller; the
            partner credential is recorded alongside it.
          example: "finops@example.com"
        comment:
          type: [string, 'null']
          maxLength: 4000
          description: Why it was accepted or rejected

    LearnerSnapshotUploadResult:
      type: object
      required: [learner_version, snapshot_id, created, recommendations, superseded]
      properties:
        learner_version:
          type: string
        snapshot_id:
          type: string
          format: uuid
        created:
          type: boolean
          description: False when this snapshot was already stored (the request is idempotent)
        recommendations:
          type: integer
          description: Recommendations stored (0 on a resend)
        superseded:
          type: integer
          description: Pending recommendations for the same groups that this snapshot replaced

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Token lifetime in seconds
          example: 3600
        scope:
          type: string
          example: "assets:read data-flows:read risks:read usage:read export:read changes:read"
      required: [access_token, token_type, expires_in, scope]

    WebhookSubscription:
      type: object
      description: A tenant's webhook subscription. The signing secret is never included.
      properties:
        id:
          type: string
          format: uuid
        partner_id:
          type: string
          format: uuid
          description: Partner credential that receives the events
        url:
          type: string
          format: uri
          example: "https://ea.example.com/hooks/prompt-shields"
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          description: false while the subscription is paused
        rotation_grace_ends_at:
          type: string
          format: date-time
          nullable: true
          description: Set while a rotated-out secret still signs deliveries
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - partner_id
        - url
        - event_types
        - description
        - is_active
        - rotation_grace_ends_at
        - created_at
        - updated_at

    WebhookSubscriptionWithSecret:
      description: >-
        Returned on create and on secret rotation, the only times the signing
        secret is shown.
      allOf:
        - $ref: '#/components/schemas/WebhookSubscription'
        - type: object
          properties:
            secret:
              type: string
              description: "`whsec_...`. Save it now; it is not shown again."
            warning:
              type: string
              example: "Save the signing secret now. It will not be shown again."
          required: [secret, warning]

    WebhookEventType:
      type: string
      description: >-
        Event types a subscription can name. `audit.*` subscribes to the
        tenant's hash-chained admin audit trail, delivered as one event per
        row with the type `audit.<action>` (see the Audit trail guide); it
        needs the `audit:read` scope and is not part of the default list.
        `spend.anomaly` delivers spend anomaly alerts (see `SpendAlert`);
        the event id is the alert id and `data.alert` the alert. It needs
        `spend-alerts:read` and is not part of the default list either.
        New values are added over time: clients should treat this as an
        open string and ignore types they do not handle.
      enum: [asset.created, asset.changed, asset.retired, asset.attested, audit.*, spend.anomaly]

    CreateWebhookSubscriptionRequest:
      type: object
      required: [partner_id, url]
      properties:
        partner_id:
          type: string
          format: uuid
          description: >-
            Partner credential (of this tenant) that receives the events. It
            needs `changes:read`, plus `assets:read` for `asset.attested`,
            `audit:read` for `audit.*` and `spend-alerts:read` for
            `spend.anomaly`.
        url:
          type: string
          maxLength: 2048
          description: "`https` URL with a public host"
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Defaults to every asset event type (not `audit.*` or `spend.anomaly`)
        description:
          type: string
          maxLength: 200
          nullable: true

    UpdateWebhookSubscriptionRequest:
      type: object
      description: Fields to change. Omitted fields keep their value; give at least one, and none as null.
      minProperties: 1
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 2048
          description: New destination, checked like a new subscription's URL
        event_types:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: Replaces the event list. The partner needs each event's scope.
        is_active:
          type: boolean
          description: >-
            false pauses the subscription: no new events are queued for it and
            queued deliveries are not sent. true resumes it.

    RotateWebhookSecretRequest:
      type: object
      properties:
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
          description: >-
            Keep signing with the old secret too for this long, so the receiver
            can switch without dropping deliveries. 0 invalidates the old
            secret at once.

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          description: An asset event type, or `audit.<action>` for an audit trail event
          example: audit.provider_credential.rotate
        asset_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, succeeded, dead]
        attempts:
          type: integer
        last_status_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: Set only while `status` is `pending`
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - subscription_id
        - event_id
        - event_type
        - asset_id
        - status
        - attempts
        - last_status_code
        - last_error
        - next_attempt_at
        - last_attempt_at
        - delivered_at
        - created_at

    ProviderCredential:
      type: object
      description: >-
        A stored provider admin key, masked. The key itself and its ciphertext
        are never returned.
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
        key_hint:
          type: string
          description: "`****` plus the key's last four characters"
          example: "****a1b2"
        key_id:
          type: string
          nullable: true
          description: Id of the `PS_WEBHOOK_SECRET_KEYS` keyring key the admin key is encrypted under
          example: "k2"
        created_at:
          type: string
          format: date-time
          nullable: true
        rotated_at:
          type: string
          format: date-time
          nullable: true
      required: [provider, key_hint, key_id, created_at, rotated_at]

    AdminKeyRequest:
      type: object
      additionalProperties: false
      required: [admin_key]
      properties:
        admin_key:
          type: string
          writeOnly: true
          description: >-
            The provider's organization admin key (20 to 512 printable ASCII
            characters, no whitespace). Write-only: never returned, logged or
            audited, and a 400 or 422 about it never echoes the value.

    ProviderKeyFingerprintLink:
      type: object
      description: Links a provider's opaque API key id to the SDK's `api_key_fingerprint`.
      properties:
        provider:
          type: string
          enum: [openai, anthropic]
        api_key_id:
          type: string
          description: The key id the provider's usage API reports
          example: "key_abc123"
        api_key_fingerprint:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: First 16 hex characters of sha256(api key), computed where the key lives
          example: "3f9a1c0b7d2e4f60"
        created_at:
          type: string
          format: date-time
          nullable: true
      required: [provider, api_key_id, api_key_fingerprint, created_at]

    FingerprintRequest:
      type: object
      additionalProperties: false
      required: [api_key_fingerprint]
      properties:
        api_key_fingerprint:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: >-
            First 16 hex characters of sha256(api key), as the SDK sends it.
            Anything else (a raw key, for example) is refused with a 400.

    # ── Tenant admin automation: admin tokens and ingest keys ──────────

    AdminScope:
      type: string
      description: |
        Admin token scope. `admin:read` grants every GET under
        `/api/v1/admin`; the others grant one resource family. While
        `PS_ADMIN_REQUIRE_SCOPED_TOKENS` is off an ingest key reaches every
        admin route, so issuing or rotating one needs every admin scope.
      enum:
        - admin:read
        - admin:keys
        - admin:tokens
        - admin:provider-credentials
        - admin:webhooks
        - admin:partners
        - admin:registry

    CredentialStatus:
      type: string
      description: |
        `revoked` after DELETE (the row is kept and stays readable by id),
        `expired` past `expires_at`, else `active`.
      enum: [active, expired, revoked]

    AdminToken:
      type: object
      description: An admin token's metadata. The token and its hash are never included.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique among the tenant's unrevoked tokens
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/AdminScope'
        token_hint:
          type: string
          description: Last four characters of the token
        status:
          $ref: '#/components/schemas/CredentialStatus'
        created_by:
          type: string
          description: >-
            `operator`, or `key:<prefix>` / `token:<prefix>`: the SHA-256 lookup
            prefix of the tenant key or admin token that issued it
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
      required: [id, name, scopes, token_hint, status, created_by, created_at, expires_at, revoked_at]

    AdminTokenWithSecret:
      description: Returned once, on creation. Store the token now.
      allOf:
        - $ref: '#/components/schemas/AdminToken'
        - type: object
          properties:
            token:
              type: string
              description: The token (`ps-at-...`), shown only in this response
            warning:
              type: string
          required: [token, warning]

    CreateAdminTokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9._ -]*$'
        scopes:
          type: array
          minItems: 1
          description: >-
            With an admin token, only scopes the caller holds can be granted
            (403 otherwise).
          items:
            $ref: '#/components/schemas/AdminScope'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Must be in the future. Omit for a token that does not expire.
            With an admin token that expires, the new token expires no later
            than the caller's (an omitted or later expiry is capped to it).
      required: [name, scopes]

    BootstrapAdminTokenRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminScope'
        expires_at:
          type: [string, 'null']
          format: date-time
      required: [name, scopes]

    TenantApiKey:
      type: object
      description: A tenant ingest key's metadata. The key and its hashes are never included.
      properties:
        id:
          type: string
          format: uuid
          description: Stable across rotations
        name:
          type: string
          description: Unique among the tenant's unrevoked keys
        key_hint:
          type: [string, 'null']
          description: Last four characters; null for a moved legacy key
        origin:
          type: string
          enum: [api, legacy]
          description: >-
            `legacy` for the key that lived on the tenant row before this API,
            moved here by migration 022 or by the tenant's first key write
            (listing keys does not move it)
        status:
          $ref: '#/components/schemas/CredentialStatus'
        rotation_grace_ends_at:
          type: [string, 'null']
          format: date-time
          description: Set while the secret replaced by the last rotation still authenticates
        created_at:
          type: string
          format: date-time
        rotated_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
      required:
        - id
        - name
        - key_hint
        - origin
        - status
        - rotation_grace_ends_at
        - created_at
        - rotated_at
        - expires_at
        - revoked_at

    TenantApiKeyWithSecret:
      description: Returned once, on creation and rotation. Store the key now.
      allOf:
        - $ref: '#/components/schemas/TenantApiKey'
        - type: object
          properties:
            key:
              type: string
              description: The ingest key (`ps-ik-...`), shown only in this response
            warning:
              type: string
          required: [key, warning]

    CreateTenantApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9][A-Za-z0-9._ -]*$'
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Must be in the future. Omit for a key that does not expire.
      required: [name]

    RotateTenantApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        grace_period_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 0
          description: >-
            Keep accepting the old secret for this long (at most 7 days) so
            senders can switch without dropping events. 0 ends it at once.

    # ── Partner credentials (tenant admin) ──────────────────────────────

    PartnerCredential:
      type: object
      description: A Partner API credential. The client secret and API key are never included.
      properties:
        id:
          type: string
          format: uuid
        partner_name:
          type: string
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
          description: Requests per minute, from the tier or the custom limit
        rate_limit_tier:
          type: [string, 'null']
        is_active:
          type: string
          enum: ['true', 'false']
          description: Kept for older clients; use `status`
        status:
          $ref: '#/components/schemas/CredentialStatus'
        has_api_key:
          type: boolean
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
      required:
        - id
        - partner_name
        - client_id
        - scopes
        - rate_limit
        - rate_limit_tier
        - is_active
        - status
        - has_api_key
        - expires_at
        - created_at

    PartnerCredentialWithSecrets:
      type: object
      description: Returned once, on creation. Store the client secret and API key now.
      properties:
        id:
          type: string
          format: uuid
        partner_name:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        api_key:
          type: [string, 'null']
        scopes:
          type: array
          items:
            type: string
        rate_limit:
          type: integer
        rate_limit_tier:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        warning:
          type: string
      required:
        - id
        - partner_name
        - client_id
        - client_secret
        - api_key
        - scopes
        - rate_limit
        - rate_limit_tier
        - created_at
        - expires_at
        - warning

    IssuePartnerCredentialRequest:
      type: object
      properties:
        partner_name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          description: Defaults to the read scopes. See `GET /api/v1/admin/partner-scopes`.
          items:
            type: string
        issue_api_key:
          type: boolean
          default: true
        rate_limit_tier:
          type: [string, 'null']
        rate_limit:
          type: [integer, 'null']
          minimum: 1
        expires_at:
          type: [string, 'null']
          format: date-time
        metadata:
          type: [object, 'null']
      required: [partner_name]

    UpdatePartnerCredentialRequest:
      type: object
      description: Fields left out are unchanged. Setting `rate_limit` clears the tier.
      properties:
        scopes:
          type: [array, 'null']
          items:
            type: string
        rate_limit_tier:
          type: [string, 'null']
        rate_limit:
          type: [integer, 'null']
          minimum: 1

    # ── Operator: tenants ───────────────────────────────────────────────

    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Display name; unique (case-insensitive)
        domain:
          type: [string, 'null']
        settings:
          type: object
          description: Tenant settings, e.g. `retention_days`
        status:
          type: string
          enum: [active, disabled]
        disabled_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        links:
          type: object
          description: Related operator routes. Erasure is `DELETE` on the `erase` link.
          properties:
            retention:
              type: string
            erase:
              type: string
          required: [retention, erase]
      required: [id, name, domain, settings, status, disabled_at, created_at, links]

    TenantCreated:
      allOf:
        - $ref: '#/components/schemas/Tenant'
        - type: object
          properties:
            api_key:
              description: The first ingest key, shown once; null when `issue_api_key` was false
              anyOf:
                - allOf:
                    - $ref: '#/components/schemas/TenantApiKey'
                    - type: object
                      properties:
                        key:
                          type: string
                      required: [key]
                - type: 'null'
            warning:
              type: [string, 'null']
          required: [api_key, warning]

    CreateTenantRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: [string, 'null']
          maxLength: 253
        settings:
          type: object
          description: >-
            Free-form settings. `retention_days` must be an integer between 1
            and 36500; `spend_anomaly` must be a `SpendAnomalySettings`
            object; `api_key` is refused.
        issue_api_key:
          type: boolean
          default: true
          description: Issue a first ingest key and return it once
        api_key_name:
          type: string
          default: default
          minLength: 1
          maxLength: 100
      required: [name]

    UpdateTenantRequest:
      type: object
      additionalProperties: false
      description: Fields to change; omitted fields keep their value. Give at least one.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: [string, 'null']
          maxLength: 253
        settings:
          type: object
          description: >-
            Merged into the stored settings; a key set to null is removed.
            Validated as on create (`retention_days`, `spend_anomaly`).
        disabled:
          type: boolean
          description: >-
            true disables the tenant: its ingest keys, admin tokens and
            Partner API credentials are refused (403) and its data is kept.
            false enables it again.

    SpendAnomalySettings:
      type: object
      additionalProperties: false
      description: >-
        Per-tenant spend anomaly thresholds, stored as
        `settings.spend_anomaly`. Every field is optional and falls back to
        its default. The detector compares a UTC day's spend per use case
        (or asset) with the EWMA mean and standard deviation of the
        `baseline_days` days before it.
      properties:
        enabled:
          type: boolean
          default: true
        group_by:
          type: string
          enum: [use_case, asset]
          default: use_case
        alpha:
          type: number
          minimum: 0.01
          maximum: 1
          default: 0.3
          description: EWMA smoothing factor (weight of the newest day)
        sigma:
          type: number
          minimum: 0.5
          maximum: 20
          default: 3
          description: Alert at this many standard deviations above the baseline; 2x is `critical`
        baseline_days:
          type: integer
          minimum: 3
          maximum: 90
          default: 28
        min_history_days:
          type: integer
          minimum: 2
          maximum: 90
          default: 7
          description: Days of spend a group needs before it is judged; at most `baseline_days`
        min_delta_usd:
          type: number
          minimum: 0
          default: 1
          description: The day must also be at least this many USD above the baseline
        min_sigma_fraction:
          type: number
          minimum: 0
          maximum: 10
          default: 0.1
          description: The standard deviation used is at least this fraction of the baseline

    SpendAlert:
      type: object
      description: >-
        One UTC day whose spend for a use case or asset was far above its
        EWMA baseline. Numbers only.
      properties:
        id:
          type: string
          format: uuid
        group_by:
          type: string
          enum: [use_case, asset]
        group_key:
          type: string
          description: The use case name (`(none)` for assets without one), or the asset id
        day:
          type: string
          format: date
        observed_cost:
          type: number
          description: The day's spend in USD
        baseline_cost:
          type: number
          description: EWMA of the days before, in USD
        baseline_sigma:
          type: number
          description: The standard deviation used, in USD (after its floors)
        z_score:
          type: number
        threshold_sigma:
          type: number
        history_days:
          type: integer
        severity:
          type: string
          enum: [warning, critical]
        status:
          type: string
          enum: [open, acknowledged]
        acknowledged_at:
          type: [string, 'null']
          format: date-time
        acknowledged_by:
          type: [string, 'null']
          description: "`partner:<credential id>`, never a person"
        created_at:
          type: string
          format: date-time
      required: [id, group_by, group_key, day, observed_cost, baseline_cost, baseline_sigma,
                 z_score, threshold_sigma, history_days, severity, status, acknowledged_at,
                 acknowledged_by, created_at]

    ConnectorSyncRequest:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        full:
          type: boolean
          default: false
          description: Ignore the cursor and push the whole registry
      required: [tenant_id]

    LeanIXSyncRequest:
      allOf:
        - $ref: '#/components/schemas/ConnectorSyncRequest'
        - type: object
          properties:
            verify:
              type: [boolean, 'null']
              default: null
              description: >-
                Read the written fact sheets back from LeanIX (GraphQL) and
                fail the sync, keeping the cursor, if any is missing. Null
                uses the tenant's `verify` setting.

  responses:
    AdminForbidden:
      description: >-
        The admin token lacks the operation's `x-admin-scope` (or `admin:read`
        on a GET), the collector refuses tenant API keys on admin routes
        (`PS_ADMIN_REQUIRE_SCOPED_TOKENS`), or the tenant is disabled. Audited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "Token lacks required scope: admin:keys"
    OperatorNotFound:
      description: Not found, or `PS_ADMIN_TOKEN` is not set on this collector (every operator route is then 404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential lacks the scope this endpoint requires
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "Token lacks required scope: export:read"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found in this tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidAdminKey:
      description: The admin key is too short, too long or not printable ASCII. The message never echoes it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    KeyringNotConfigured:
      description: Credential storage needs `PS_WEBHOOK_SECRET_KEYS` on this collector
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProviderCredential:
      description: The stored credential, masked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProviderCredential'
    ProviderCredentialList:
      description: Stored credentials, masked
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderCredential'
              meta:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                    description: Providers a key can be stored for
                    example: ["openai", "anthropic"]
                  env_fallback:
                    type: array
                    items:
                      type: string
                    description: Providers with no stored key that the pull would take from `PS_PROVIDER_ADMIN_KEYS`
                required: [providers, env_fallback]
            required: [data, meta]
    FingerprintLink:
      description: The link, and how many platform_signal assets it corroborated
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/ProviderKeyFingerprintLink'
              meta:
                type: object
                properties:
                  corroborated_assets:
                    type: integer
                    description: Platform_signal assets that gained a corroborating source
                required: [corroborated_assets]
            required: [data, meta]
    FingerprintLinkList:
      description: Fingerprint links
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderKeyFingerprintLink'
            required: [data]
    WebhookSubscription:
      description: The subscription (without its secret)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookSubscription'
    WebhookSubscriptionWithSecret:
      description: The subscription and its new signing secret, shown only this once
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookSubscriptionWithSecret'

  requestBodies:
    AdminKey:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminKeyRequest'
    Fingerprint:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FingerprintRequest'

  parameters:
    CredentialStatusParam:
      name: status
      in: query
      description: Only rows with this status; omit for all
      schema:
        $ref: '#/components/schemas/CredentialStatus'

    KeyIdPathParam:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantIdPathParam:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TenantIdQueryParam:
      name: tenant_id
      in: query
      required: true
      schema:
        type: string
        format: uuid

    ProviderPathParam:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [openai, anthropic]

    ApiKeyIdPathParam:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,128}$'
      description: The key id the provider's usage API reports

    SubscriptionIdPathParam:
      name: subscription_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Number of records per page (max 200)

    AfterParam:
      name: after
      in: query
      schema:
        type: string
        format: uuid
      description: Cursor for pagination (UUIDv7 of last item from previous page)

    BusinessUnitParam:
      name: business_unit
      in: query
      schema:
        type: string
      description: Filter by business unit
      example: "HR"

    StatusParam:
      name: status
      in: query
      schema:
        type: string
        enum: [active, deprecated, under_review]
      description: Filter by governance status

    LifecycleStateParam:
      name: lifecycle_state
      in: query
      schema:
        type: string
        enum: [active, stale, retired]
      description: Filter by telemetry-driven lifecycle state

    DiscoverySourceParam:
      name: discovery_source
      in: query
      schema:
        type: string
        enum: [sdk, gateway, browser_extension, macos_app, platform_signal, survey, otel, code_scan, kong]
      description: Filter by discovery source

    SinceParam:
      name: since
      in: query
      schema:
        type: string
        format: date-time
      description: Only return assets first seen after this timestamp
      example: "2026-03-01T00:00:00Z"

    VendorParam:
      name: vendor
      in: query
      schema:
        type: string
      description: Filter by AI vendor
      example: "openai"

    ConfidenceParam:
      name: confidence
      in: query
      schema:
        type: string
        enum: [low, medium, high, verified]
      description: Filter by minimum confidence level

    DataClassificationParam:
      name: data_classification
      in: query
      schema:
        type: string
        enum: [public, internal, confidential, restricted]
      description: Filter by data classification

    AttestationFieldParam:
      name: attestation_field
      in: query
      schema:
        type: string
        enum: [asset, owner, data_classification]
      description: |
        With `attestation_state`: only assets whose current (newest)
        attestation of this field is in that state. Use it as a review queue,
        e.g. `attestation_field=owner&attestation_state=unreviewed`. Giving
        only one of the two is a 400.

    AttestationStateParam:
      name: attestation_state
      in: query
      schema:
        type: string
        enum: [unreviewed, attested, disputed, retired]
      description: |
        With `attestation_field`. `unreviewed` includes fields nobody has
        attested. Independent of `confidence`.

paths:
  /ingest/feedback:
    post:
      operationId: ingestCallFeedback
      tags: [Ingest]
      summary: Record feedback on one call
      description: |
        Stores one feedback per (tenant, call_id); a later one for the same
        call replaces it. Kept even when the call's usage event has not
        arrived yet (`matched` says whether it has). Rate-limited per tenant
        (`PS_FEEDBACK_RATE_LIMIT_PER_MINUTE`, default 600) and, when
        `user_id` is sent, per user (`PS_FEEDBACK_USER_RATE_LIMIT_PER_MINUTE`,
        default 30). Rows are purged with the tenant's usage events
        (retention) and on erasure.
      security:
        - TenantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallFeedbackRequest'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallFeedbackResult'
        '400':
          description: The body is not JSON, or nests too deep
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The body exceeds 4096 bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid field, or a string with a NUL character or an unpaired surrogate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: The tenant's or the user's feedback rate limit is exhausted
          headers:
            Retry-After:
              description: Seconds until the limit resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ingest/learner-snapshots:
    post:
      operationId: ingestLearnerSnapshot
      tags: [Ingest]
      summary: Store a routing learner snapshot
      description: |
        Stores one snapshot of the tenant's offline routing learner
        (`ps-learn --upload`, `ps-learner-snapshot.v1`) and its
        recommendations, each pending a human review. Only `recommend` mode
        is accepted. `learner_version` must equal `lv1-` plus the first 16 hex
        characters of the SHA-256 of the snapshot's canonical JSON without
        `learner_version` (sorted keys, no spaces). Each recommended model
        must be one of its group's candidates. A resend of a stored version
        is a no-op. A new snapshot supersedes pending recommendations for
        the same (use case, sensitivity). Body limit 2 MiB.
      security:
        - TenantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema, mode, learner_version, algorithm, data, groups, recommendations]
              properties:
                schema:
                  type: string
                  enum: [ps-learner-snapshot.v1]
                mode:
                  type: string
                  enum: [recommend]
                learner_version:
                  type: string
                  pattern: '^lv1-[0-9a-f]{16}$'
      responses:
        '200':
          description: Stored (or already stored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerSnapshotUploadResult'
        '400':
          description: The body is not JSON, or nests too deep
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The body exceeds 2 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid snapshot (schema, mode, version hash, a recommendation outside its candidates, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /oauth/token:
    post:
      operationId: createToken
      tags: [Auth]
      summary: Get access token
      description: Exchange client credentials for a short-lived JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id:
                  type: string
                  example: "ps-partner-ardoq-abc123"
                client_secret:
                  type: string
                  example: "sk-partner-secret-xyz789"
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner/v1/assets:
    get:
      operationId: listAssets
      tags: [Assets]
      summary: List AI assets
      description: |
        Returns a paginated list of discovered AI assets. Supports filtering
        by business unit, vendor, status, confidence, data classification,
        and discovery source.

        **Typical use:** Ardoq Integration Builder polls this endpoint every
        4 hours to sync the AI asset registry into the Ardoq metamodel.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/AfterParam'
        - $ref: '#/components/parameters/BusinessUnitParam'
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/LifecycleStateParam'
        - $ref: '#/components/parameters/DiscoverySourceParam'
        - $ref: '#/components/parameters/SinceParam'
        - $ref: '#/components/parameters/VendorParam'
        - $ref: '#/components/parameters/ConfidenceParam'
        - $ref: '#/components/parameters/DataClassificationParam'
        - $ref: '#/components/parameters/AttestationFieldParam'
        - $ref: '#/components/parameters/AttestationStateParam'
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '400':
          description: >-
            Only one of `attestation_field` and `attestation_state` was given,
            or the field is not attestable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Paginated list of AI assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AIAsset'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
              example:
                data:
                  - id: "019e1a2b-3c4d-7000-8000-000000000001"
                    vendor: "openai"
                    model: "gpt-4o"
                    use_case_name: "interview-screening"
                    business_unit: "HR"
                    owner_email: "jane.doe@acme.com"
                    environment: "production"
                    status: "active"
                    data_classification: "confidential"
                    discovery_source: ["sdk", "browser_extension"]
                    confidence: "verified"
                    first_seen: "2026-03-01T10:00:00Z"
                    last_seen: "2026-03-25T14:22:00Z"
                meta:
                  total: 47
                  has_more: false
                  next_cursor: null
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until rate limit resets

  /partner/v1/assets/{asset_id}:
    get:
      operationId: getAsset
      tags: [Assets]
      summary: Get asset details
      description: Returns full details for a single AI asset by ID.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [assets:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAsset'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /partner/v1/assets/{asset_id}/data-flows:
    get:
      operationId: getAssetDataFlows
      tags: [Assets]
      summary: Get data flows
      description: |
        Returns data lineage records for an AI asset. Shows which systems
        provide input data and where output goes, along with data classification
        and detected PII types.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [data-flows:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Data flows for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataFlow'
                  meta:
                    type: object
                    properties:
                      tenant_id:
                        type: string
                        format: uuid
                        description: Tenant of the credential that made the request
              example:
                data:
                  - id: "019e1a2b-0000-7000-8000-000000000010"
                    source_system: "candidates_db"
                    destination_system: "hiring_dashboard"
                    data_classification: "confidential"
                    direction: "input"
                    detected_pii_types: ["name", "email", "phone"]
                  - id: "019e1a2b-0000-7000-8000-000000000011"
                    source_system: "gpt-4o"
                    destination_system: "hiring_dashboard"
                    data_classification: "internal"
                    direction: "output"
                    detected_pii_types: null
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/risks:
    get:
      operationId: getAssetRisks
      tags: [Assets]
      summary: Get risk mappings
      description: |
        Returns risk assessments for an AI asset, mapped to governance
        frameworks (NIST AI RMF, ISO 42001, EU AI Act). By default only
        `confirmed` mappings are returned (hand-entered ones and rule-based
        suggestions a person has confirmed), as before suggestions existed.
        Pass `status=suggested` for unreviewed rule-based suggestions, which
        are not determinations, or `status=rejected`.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Only mappings with this status. Default is `confirmed`.
          schema:
            type: string
            enum: [suggested, confirmed, rejected]
      security:
        - OAuth2: [risks:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Risk mappings for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskMapping'
                  meta:
                    type: object
                    properties:
                      tenant_id:
                        type: string
                        format: uuid
                        description: Tenant of the credential that made the request
              example:
                data:
                  - id: "019e1a2b-0000-7000-8000-000000000020"
                    risk_category: "employment"
                    risk_level: "high"
                    framework: "EU_AI_ACT"
                    status: "confirmed"
                    source: "rules"
                    rule_id: "eu_ai_act.annex_iii.4a.recruitment"
                    ruleset_version: "1.1.0"
                    framework_ref: "Annex III, point 4(a)"
                    confidence: "high"
                    evidence:
                      rule_title: "Recruitment or selection: targeted job ads, filtering applications, evaluating candidates"
                      ruleset: "eu_ai_act_annex_iii"
                      summary: "Annex III, point 4(a), Recruitment or selection: ...: use_case 'resume-screening' matched resume* (trigger); business_unit 'HR' matched hr (supporting)"
                      signals:
                        - signal: "use_case"
                          value: "resume-screening"
                          matched: ["resume*"]
                          role: "trigger"
                        - signal: "business_unit"
                          value: "HR"
                          matched: ["hr"]
                          role: "supporting"
                    reviewed_at: "2026-10-15T09:30:00Z"
                    reviewed_by: "dpo@example.com"
                  - id: "019e1a2b-0000-7000-8000-000000000021"
                    risk_category: "operational"
                    risk_level: "medium"
                    framework: "NIST_AI_RMF"
                    status: "confirmed"
                    source: "manual"
                    rule_id: null
                    ruleset_version: null
                    framework_ref: null
                    confidence: null
                    evidence: null
                    reviewed_at: null
                    reviewed_by: null
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/risks/{risk_id}/reviews:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: risk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRiskMappingReviews
      tags: [Assets]
      summary: Get the review history of a risk mapping
      description: |
        Immutable history of human reviews (confirm or reject) of one risk
        mapping, newest first: who, when, the new and previous status, the
        comment and the mapping as reviewed. `meta.current` is the mapping
        now. Requires `risks:read`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      security:
        - OAuth2: [risks:read]
        - PartnerApiKey: []
      responses:
        '200':
          description: Review history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskReviewHistory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Risk mapping not found on this asset

  /partner/v1/assets/{asset_id}/risks/{risk_id}/review:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: risk_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reviewAssetRiskMapping
      tags: [Assets]
      summary: Confirm or reject a risk mapping
      description: |
        Records a human decision on a risk mapping, typically a rule-based
        suggestion: `confirmed` or `rejected`, the person deciding and an
        optional comment. The suggestion engine keeps the decision. A mapping
        can be reviewed again; every review is appended to its history.
        Never changes `confidence`. The asset then appears in `/changes`.
        Requires the `risks:review` scope.
      security:
        - OAuth2: [risks:review]
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskReviewRequest'
      responses:
        '201':
          description: Review recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RiskMappingReview'
                  meta:
                    type: object
                    properties:
                      current:
                        $ref: '#/components/schemas/RiskMapping'
                    required: [current]
                required: [data, meta]
        '403':
          description: Token lacks `risks:review`
        '404':
          description: Risk mapping not found on this asset

  /partner/v1/assets/{asset_id}/attestations:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAssetAttestations
      tags: [Assets]
      summary: Get attestation history
      description: |
        Immutable history of human attestations for an asset, newest first,
        with the current state of every attestable field in `meta.current`.
        Requires `assets:read`.
      parameters:
        - name: field
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Attestation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attestation'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      confidence:
                        type: string
                      current:
                        type: object
                        additionalProperties:
                          $ref: '#/components/schemas/AttestationStatus'
                    required: [total, confidence, current]
        '404':
          description: Asset not found
    post:
      operationId: createAssetAttestation
      tags: [Assets]
      summary: Record a human attestation
      description: |
        Appends an attestation for one field of an asset. Requires the
        `attestations:write` scope. Never changes `confidence`. The asset
        then appears in `/changes` with the field in `attestation_changes`.
        An `asset` attestation with state `retired` retires the asset (its
        owner's word; the lifecycle sweep and new telemetry leave it
        retired), and a later `attested` or `unreviewed` one un-retires it,
        so this scope can retire assets.
      security:
        - OAuth2: [attestations:write]
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationRequest'
      responses:
        '201':
          description: Attestation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Attestation'
        '400':
          description: Unknown field, or a dispute without a comment
        '403':
          description: Token lacks `attestations:write`
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/usage-summary:
    get:
      operationId: getAssetUsageSummary
      tags: [Assets]
      summary: Get usage summary
      description: |
        Returns aggregated usage statistics for an AI asset over a time period.
        Does not expose individual request data or prompt content.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
          description: Time period for aggregation
      security:
        - OAuth2: [usage:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'

  /partner/v1/usage/savings:
    get:
      operationId: getUsageSavings
      tags: [Assets]
      summary: Get routing savings
      description: |
        Realised savings across the tenant over the period: what calls cost
        against what they would have cost on their baseline model
        (`counterfactual_cost`), in total and per bucket of `group_by`.

        Only events that reported both `cost` and `counterfactual_cost`
        count towards savings. Others are still counted in `total_requests`
        and `estimated_cost_usd`; `counterfactual_coverage` says what share
        of requests were compared. The window is clamped to the tenant's
        retention period. Aggregates only, never individual events.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
          description: Time period for aggregation
        - name: group_by
          in: query
          schema:
            type: string
            enum: [none, day, week, month, asset, use_case, business_unit]
            default: none
          description: Bucket by UTC day, week or month, asset, use case or business unit
      security:
        - OAuth2: [usage:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Savings report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsReport'

  /partner/v1/spend-alerts:
    get:
      operationId: listSpendAlerts
      tags: [Assets]
      summary: List spend anomaly alerts
      description: |
        Spend anomaly alerts for the tenant, newest day first. Alerts are
        written by the daily job (`python -m collector.spend_anomalies`),
        which also sends each new one as a `spend.anomaly` webhook event.
        Requires `spend-alerts:read`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged]
        - name: severity
          in: query
          schema:
            type: string
            enum: [warning, critical]
        - name: since
          in: query
          schema:
            type: string
            format: date
          description: First day to include (UTC)
        - name: until
          in: query
          schema:
            type: string
            format: date
          description: Last day to include (UTC)
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
      security:
        - OAuth2: [spend-alerts:read]
        - PartnerApiKey: []
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpendAlert'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                    required: [total]
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner/v1/spend-alerts/{alert_id}:
    get:
      operationId: getSpendAlert
      tags: [Assets]
      summary: Get a spend anomaly alert
      description: Requires `spend-alerts:read`.
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [spend-alerts:read]
        - PartnerApiKey: []
      responses:
        '200':
          description: The alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SpendAlert'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Alert not found

  /partner/v1/spend-alerts/{alert_id}/acknowledge:
    post:
      operationId: acknowledgeSpendAlert
      tags: [Assets]
      summary: Acknowledge a spend anomaly alert
      description: |
        Marks the alert `acknowledged`, recording the time and the
        credential. Acknowledging it again changes nothing and returns it
        as it is. Requires `spend-alerts:acknowledge`.
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [spend-alerts:acknowledge]
        - PartnerApiKey: []
      responses:
        '200':
          description: The acknowledged alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SpendAlert'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Alert not found

  /partner/v1/usage/sovereign-share:
    get:
      operationId: getUsageSovereignShare
      tags: [Assets]
      summary: Get sovereign share
      description: |
        Share of the tenant's calls and spend served in a sovereign
        jurisdiction (`EEA` or an EEA country code), in total and per
        sensitivity level, over the period. Events that did not report a
        `served_jurisdiction` are left out of both sides of each share. The
        jurisdiction is the one the route policy states for the serving
        tier; US CLOUD Act exposure is not stored per event, so this is a
        share by jurisdiction, not a sovereignty guarantee. The window is clamped to the tenant's retention
        period. Aggregates only.
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
          description: Time period for aggregation
      security:
        - OAuth2: [usage:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Sovereign share report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SovereignShareReport'

