                $ref: '#/components/schemas/McpToolPage'

  /partner/v1/mcp/usage:
    get:
      operationId: listMcpUsage
      tags: [MCP]
      summary: Daily MCP tool-call metering
      description: |
        Calls, errors, blocked calls, latency and request/response bytes per
        MCP tool per server per UTC day (and per source that reported them),
