              schema:
                $ref: '#/components/schemas/Error'

  /partner/v1/assets/{asset_id}/data-flows:
    get:
      operationId: getAssetDataFlows
      tags: [Assets]
      summary: Get data flows
      description: |
        Returns data lineage records for an AI asset. Shows which systems
        provide input data and where output goes, along with data classification
        and detected PII types.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - OAuth2: [data-flows:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Data flows for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataFlow'
                  meta:
                    type: object
                    properties:
                      tenant_id:
                        type: string
                        format: uuid
                        description: Tenant of the credential that made the request
              example:
                data:
                  - id: "019e1a2b-0000-7000-8000-000000000010"
                    source_system: "candidates_db"
                    destination_system: "hiring_dashboard"
                    data_classification: "confidential"
                    direction: "input"
                    detected_pii_types: ["name", "email", "phone"]
                  - id: "019e1a2b-0000-7000-8000-000000000011"
                    source_system: "gpt-4o"
                    destination_system: "hiring_dashboard"
                    data_classification: "internal"
                    direction: "output"
                    detected_pii_types: null
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/risks:
    get:
      operationId: getAssetRisks
      tags: [Assets]
      summary: Get risk mappings
      description: |
        Returns risk assessments for an AI asset, mapped to governance
        frameworks (NIST AI RMF, ISO 42001, EU AI Act). By default only
        `confirmed` mappings are returned (hand-entered ones and rule-based
        suggestions a person has confirmed), as before suggestions existed.
        Pass `status=suggested` for unreviewed rule-based suggestions, which
        are not determinations, or `status=rejected`.
      parameters:
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Only mappings with this status. Default is `confirmed`.
          schema:
            type: string
            enum: [suggested, confirmed, rejected]
      security:
        - OAuth2: [risks:read]
        - PartnerApiKey: []
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Risk mappings for the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskMapping'
              example:
                data:
                  - id: "019e1a2b-0000-7000-8000-000000000020"
                    risk_category: "employment"
                    risk_level: "high"
                    framework: "EU_AI_ACT"
                    status: "confirmed"
                    source: "rules"
                    rule_id: "eu_ai_act.annex_iii.4a.recruitment"
                    ruleset_version: "1.1.0"
                    framework_ref: "Annex III, point 4(a)"
                    confidence: "high"
                    evidence:
                      rule_title: "Recruitment or selection: targeted job ads, filtering applications, evaluating candidates"
                      ruleset: "eu_ai_act_annex_iii"
                      summary: "Annex III, point 4(a), Recruitment or selection: ...: use_case 'resume-screening' matched resume* (trigger); business_unit 'HR' matched hr (supporting)"
                      signals:
                        - signal: "use_case"
                          value: "resume-screening"
                          matched: ["resume*"]
                          role: "trigger"
                        - signal: "business_unit"
                          value: "HR"
                          matched: ["hr"]
                          role: "supporting"
                    reviewed_at: "2026-10-15T09:30:00Z"
                    reviewed_by: "dpo@example.com"
                  - id: "019e1a2b-0000-7000-8000-000000000021"
                    risk_category: "operational"
                    risk_level: "medium"
                    framework: "NIST_AI_RMF"
                    status: "confirmed"
                    source: "manual"
                    rule_id: null
                    ruleset_version: null
                    framework_ref: null
                    confidence: null
                    evidence: null
                    reviewed_at: null
                    reviewed_by: null
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/attestations:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getAssetAttestations
      tags: [Assets]
      summary: Get attestation history
      description: |
        Immutable history of human attestations for an asset, newest first,
        with the current state of every attestable field in `meta.current`.
        Requires `assets:read`.
      parameters:
        - name: field
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Attestation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attestation'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      confidence:
                        type: string
                      current:
                        type: object
                        additionalProperties:
                          $ref: '#/components/schemas/AttestationStatus'
                    required: [total, confidence, current]
        '404':
          description: Asset not found
    post:
      operationId: createAssetAttestation
      tags: [Assets]
      summary: Record a human attestation
      description: |
        Appends an attestation for one field of an asset. Requires the
        `attestations:write` scope. Never changes `confidence`. The asset
        then appears in `/changes` with the field in `attestation_changes`.
        An `asset` attestation with state `retired` retires the asset (its
        owner's word; the lifecycle sweep and new telemetry leave it
        retired), and a later `attested` or `unreviewed` one un-retires it,
        so this scope can retire assets.
      security:
        - OAuth2: [attestations:write]
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestationRequest'
      responses:
        '201':
          description: Attestation recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Attestation'
        '400':
          description: Unknown field, or a dispute without a comment
        '403':
          description: Token lacks `attestations:write`
        '404':
          description: Asset not found

  /partner/v1/assets/{asset_id}/usage-summary:
