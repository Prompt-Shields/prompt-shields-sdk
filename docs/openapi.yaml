  /partner/v1/provider-key-fingerprints:
    get:
      operationId: listProviderKeyFingerprints
      tags: [Provider Credentials]
      summary: List provider key id to api_key_fingerprint links
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLinkList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /partner/v1/provider-key-fingerprints/{provider}/{api_key_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
      - $ref: '#/components/parameters/ApiKeyIdPathParam'
    put:
      operationId: putProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Link a provider key id to the SDK api_key_fingerprint
      description: |
        The provider usage APIs report only opaque key ids, so the tenant
        registers which SDK `api_key_fingerprint` (first 16 hex characters of
        sha256(key), computed where the key lives) belongs to which key id.
        Corroboration then runs at once: a platform_signal asset for this key
        and an SDK asset that saw the same fingerprint and model both become
        `verified`. 201 for a new link, 200 when it replaced one.
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/Fingerprint'
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLink'
        '201':
          $ref: '#/components/responses/FingerprintLink'
        '400':
          description: Not a 16-hex-character fingerprint, or an invalid key id
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Delete a fingerprint link
      security:
        - OAuth2: [provider-credentials:manage]
        - PartnerApiKey: []
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

