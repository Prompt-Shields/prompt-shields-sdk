        the tenant's retention period are purged. Counts only.
      parameters:
        - name: since
          in: query
          schema: {type: string, format: date}
          description: First UTC day (default 30 days ago)
        - name: until
          in: query
          schema: {type: string, format: date}
          description: Last UTC day, inclusive
        - name: tool_name
          in: query
          schema: {type: string}
        - name: server_name
          in: query
          schema: {type: string}
        - name: source
          in: query
          schema:
            type: string
            enum: [sdk, gateway, otel, scan]
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
        - name: cursor
          in: query
          schema: {type: string}
          description: "`meta.next_cursor` of the previous page"
      security:
        - OAuth2: [mcp:read]
        - PartnerApiKey: []
      responses:
        '400':
          description: Invalid cursor, or `until` before `since`
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: One page of daily metering rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpUsagePage'

  /api/v1/registry/mcp-tools:
    get:
