  /partner/v1/learner/recommendations/{rec_id}/review:
    parameters:
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reviewLearnerRecommendation
      tags: [Learner]
      summary: Accept or reject a learner recommendation
      description: |
        Records a human decision on a pending recommendation: `accepted` or
        `rejected`, the person deciding and an optional comment. Decided
        once (a second review is 409). The decision is written to the admin
        audit trail (`learner.recommendation_review`, ids and decision
        only). Accepting changes no routing: apply it by editing the route
        policy. Requires the `learner:review` scope.
      security:
        - OAuth2: [learner:review]
        - PartnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearnerReviewRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LearnerRecommendation'
                required: [data]
        '403':
          description: Token lacks `learner:review`
        '404':
          description: Recommendation not found
        '409':
          description: The recommendation is not pending
        '422':
          description: Invalid body (e.g. a blank `reviewed_by`)

  /partner/v1/usage/focus-export:
    get:
      operationId: exportUsageFocus
      tags: [Sync]
      summary: Export AI usage cost (FinOps FOCUS)
      description: |
        The tenant's AI usage cost as rows of the FinOps FOCUS **v1.4** Cost
        and Usage dataset, streamed as CSV or JSON Lines. One row per UTC
        hour or day (`granularity`), asset, model and provider. Every
        Mandatory and Recommended FOCUS column is present, plus the
        Conditional columns that apply and custom `x_` columns
        (`x_EstimatedCost`, `x_RequestCount`, `x_InputTokens`,
        `x_OutputTokens`, `x_ModelName`, `x_BusinessUnit`, `x_UseCaseName`,
        `x_Environment`). Business unit, use case and environment are also in
        `Tags` (`ps:business_unit`, `ps:use_case`, `ps:environment`).

        Costs are Prompt Shields estimates in USD, not invoiced amounts.
        With `cost_mode=merge_safe` the FOCUS cost columns are 0, as FOCUS
        requires of a data generator that is not the invoice issuer, so the
        rows can be merged with a provider's own FOCUS export; the estimate
        stays in `x_EstimatedCost`. Events without a cost are left out.

        The window `[start, end)` may span at most 366 days and is clamped
        to the tenant's retention period; the effective window is in the
        `X-Export-Window-Start` and `X-Export-Window-End` headers. CSV cells
        that would start a spreadsheet formula get a leading `'`. The
        request is audited (row count not recorded). Requires `usage:export`,
        which `registry:read` does not include.
      parameters:
        - name: start
          in: query
          schema:
            type: string
            format: date-time
          description: |
            Inclusive start, ISO 8601 date or date-time (UTC when no offset;
            URL-encode a `+` offset). Default: 30 days before `end`.
        - name: end
          in: query
          schema:
            type: string
            format: date-time
          description: "Exclusive end, ISO 8601 date or date-time. Default: now."
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, jsonl]
            default: csv
          description: CSV with a header row, or one JSON object per line
        - name: granularity
          in: query
          schema:
            type: string
            enum: [hour, day]
            default: day
          description: Charge period of each row (UTC)
        - name: cost_mode
          in: query
          schema:
            type: string
            enum: [estimated, merge_safe]
            default: estimated
          description: |
            `estimated`: `BilledCost`, `EffectiveCost`, `ListCost` and
            `ContractedCost` carry the estimated cost. `merge_safe`: they
            are 0 and the estimate is only in `x_EstimatedCost`.
      security:
        - OAuth2: [usage:export]
        - PartnerApiKey: []
      responses:
        '400':
          description: "`start` is not before `end`, or the window spans more than 366 days"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: FOCUS v1.4 Cost and Usage rows
          headers:
            X-Focus-Version:
              schema:
                type: string
                example: "1.4"
            X-Export-Window-Start:
              schema:
                type: string
                format: date-time
              description: Effective inclusive start, after the retention clamp
            X-Export-Window-End:
              schema:
                type: string
                format: date-time
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="focus-cost-20261001T000000Z-20261101T000000Z.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                BilledCost,EffectiveCost,ListCost,ContractedCost,BillingCurrency,...,x_EstimatedCost,x_RequestCount,...
                0.030000,0.030000,0.030000,0.030000,USD,...,0.030000,2,...
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/FocusCostRow'

