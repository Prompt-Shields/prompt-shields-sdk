      security:
        - TenantApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '201':
          $ref: '#/components/responses/ProviderCredential'
        '400':
          $ref: '#/components/responses/InvalidAdminKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A key is already stored for this provider
        '503':
          $ref: '#/components/responses/KeyringNotConfigured'
    delete:
      operationId: adminDeleteProviderCredential
      tags: [Provider Credentials]
      summary: Delete a stored provider admin key (tenant admin)
      security:
        - TenantApiKey: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/provider-credentials/{provider}/rotate:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
    post:
      operationId: adminRotateProviderCredential
      tags: [Provider Credentials]
      summary: Replace a stored provider admin key (tenant admin)
      security:
        - TenantApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/AdminKey'
      responses:
        '200':
          $ref: '#/components/responses/ProviderCredential'
        '400':
          $ref: '#/components/responses/InvalidAdminKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/KeyringNotConfigured'

  /api/v1/admin/provider-key-fingerprints:
    get:
      operationId: adminListProviderKeyFingerprints
      tags: [Provider Credentials]
      summary: List provider key id to api_key_fingerprint links (tenant admin)
      security:
        - TenantApiKey: []
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLinkList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/provider-key-fingerprints/{provider}/{api_key_id}:
    parameters:
      - $ref: '#/components/parameters/ProviderPathParam'
      - $ref: '#/components/parameters/ApiKeyIdPathParam'
    put:
      operationId: adminPutProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Link a provider key id to the SDK api_key_fingerprint (tenant admin)
      description: Same as `PUT /partner/v1/provider-key-fingerprints/{provider}/{api_key_id}`, with the tenant API key.
      security:
        - TenantApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/Fingerprint'
      responses:
        '200':
          $ref: '#/components/responses/FingerprintLink'
        '201':
          $ref: '#/components/responses/FingerprintLink'
        '400':
          description: Not a 16-hex-character fingerprint, or an invalid key id
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: adminDeleteProviderKeyFingerprint
      tags: [Provider Credentials]
      summary: Delete a fingerprint link (tenant admin)
      security:
        - TenantApiKey: []
