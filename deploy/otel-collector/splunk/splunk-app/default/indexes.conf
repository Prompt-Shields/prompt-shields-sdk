# Local development indexes for docker-compose.splunk.yml. In production your
# Splunk admins create these (names are SPLUNK_EVENTS_INDEX and
# SPLUNK_METRICS_INDEX in otel-collector.yaml) and set retention per policy.

[ps_security]
homePath = $SPLUNK_DB/ps_security/db
coldPath = $SPLUNK_DB/ps_security/colddb
thawedPath = $SPLUNK_DB/ps_security/thaweddb

[ps_metrics]
datatype = metric
homePath = $SPLUNK_DB/ps_metrics/db
coldPath = $SPLUNK_DB/ps_metrics/colddb
thawedPath = $SPLUNK_DB/ps_metrics/thaweddb
