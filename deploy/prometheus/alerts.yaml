# Prometheus alerting rules for the Prompt Shields gateway and collector.
#
# Load this file with `rule_files:` in prometheus.yml, or enable
# `prometheusRule.enabled` in the Helm chart (charts/prompt-shields), which
# renders the same groups as a PrometheusRule. The chart keeps a copy at
# charts/prompt-shields/files/prometheus/alerts.yaml; CI fails when the two
# differ (.github/workflows/observability.yml).
#
# Every expression uses metrics that exist today:
#   gateway   /metrics (PS_METRICS_ENABLED=true):
#     ps_gateway_requests_total, ps_gateway_request_duration_seconds,
#     ps_gateway_guardrail_verdicts_total, ps_gateway_telemetry_dropped_total,
#     ps_gateway_rate_limited_total, ps_gateway_cost_usd_total,
#     ps_gateway_budget_spend_usd, ps_gateway_budget_limit_usd,
#     ps_gateway_budget_spend_tokens, ps_gateway_budget_limit_tokens
#   collector /metrics (PS_COLLECTOR_METRICS_ENABLED=true):
#     ps_collector_requests_total, ps_collector_ingest_events_total
#
# Thresholds are starting points; tune them per deployment. In the alerts
# that have one, the number on a line ending in `# threshold` is the alert
# threshold and the number on a line ending in `# minimum` is the traffic
# (or spend) floor below which the alert stays quiet. The Helm chart can
# override both, and `for`, `severity` or the whole rule, per alert
# (prometheusRule.rules in values.yaml). Runbooks for these alerts:
# docs/guides/alert-runbooks.mdx (the `runbook_url` annotation).
groups:
  - name: prompt-shields-gateway
    rules:
      - alert: PromptShieldsGuardrailDenyRateHigh
        # More than a quarter of guardrail checks deny, with real traffic.
        # A new deny policy, a misconfigured check or an attack all look
        # like this.
        expr: |
          (
            sum(rate(ps_gateway_guardrail_verdicts_total{verdict="deny"}[10m]))
              /
            sum(rate(ps_gateway_guardrail_verdicts_total[10m]))
          ) > 0.25
          and
          sum(rate(ps_gateway_guardrail_verdicts_total[10m])) > 0.05
        for: 15m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: High guardrail deny rate on the gateway
          description: >-
            {{ $value | humanizePercentage }} of guardrail checks denied the
            request over the last 10 minutes. Check
            ps_gateway_guardrail_verdicts_total by hook and check, and the
            guardrail.verdict security events.

      - alert: PromptShieldsGateway5xxRateHigh
        # Gateway answers with 5xx (its own errors and upstream failures it
        # passes through) above 5% of requests.
        expr: |
          (
            sum(rate(ps_gateway_requests_total{status=~"5.."}[5m]))
              /
            sum(rate(ps_gateway_requests_total[5m]))
          ) > 0.05
          and
          sum(rate(ps_gateway_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: Gateway 5xx rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of gateway requests returned a
            5xx over the last 5 minutes. Break ps_gateway_requests_total down
            by provider and route to find the source.

      - alert: PromptShieldsTelemetryDropped
        # A sink is losing telemetry: OTel spans (otel), security-event OTLP
        # log records (otel_logs), collector telemetry (ps_telemetry) or
        # security event lines (security_events). Fires on a meaningful
        # count (100+ in 30 minutes) or on drops that keep happening (some
        # in every 5-minute window for 10 minutes); an isolated drop does
        # not alert.
        expr: |
          sum by (sink, reason) (
            increase(ps_gateway_telemetry_dropped_total[30m])
          ) >= 100
          or
          (
            sum by (sink, reason) (
              increase(ps_gateway_telemetry_dropped_total[30m])
            )
            and
            sum by (sink, reason) (
              rate(ps_gateway_telemetry_dropped_total[5m])
            ) > 0
          )
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "Gateway is dropping telemetry ({{ $labels.sink }}, {{ $labels.reason }})"
          description: >-
            {{ $value | humanize }} {{ $labels.sink }} items were dropped in
            the last 30 minutes (reason {{ $labels.reason }}). Check that the
            receiving endpoint is reachable and sized for the load; gaps in
            this telemetry are gaps in the audit trail.

  - name: prompt-shields-collector
    rules:
      - alert: PromptShieldsCollectorNotReady
        # The readiness probe (GET /readyz, a database check) is failing and
        # not succeeding on the same instance. Needs a probe that calls
        # /readyz, as the Helm chart's readiness probe does.
        expr: |
          (
            sum by (instance) (
              rate(ps_collector_requests_total{route="/readyz",status!="200"}[5m])
            ) > 0
          )
          unless
          (
            sum by (instance) (
              rate(ps_collector_requests_total{route="/readyz",status="200"}[5m])
            ) > 0
          )
        for: 5m
        labels:
          severity: critical
          service: prompt-shields-collector
        annotations:
          summary: "Collector {{ $labels.instance }} is not ready"
          description: >-
            Every /readyz call on {{ $labels.instance }} failed for 5 minutes.
            The collector cannot reach its database; ingest and the partner
            API are failing on this instance.

      - alert: PromptShieldsCollector5xxRateHigh
        expr: |
          (
            sum(rate(ps_collector_requests_total{status=~"5..",route!="/readyz"}[5m]))
              /
            sum(rate(ps_collector_requests_total{route!="/readyz"}[5m]))
          ) > 0.05
          and
          sum(rate(ps_collector_requests_total{route!="/readyz"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-collector
        annotations:
          summary: Collector 5xx rate above 5%
          description: >-
            {{ $value | humanizePercentage }} of collector requests (probes
            excluded) returned a 5xx over the last 5 minutes.

      - alert: PromptShieldsIngestStalled
        # The gateway is serving traffic but the collector has accepted no
        # events for 15 minutes. Assumes the gateway sends telemetry to this
        # collector (PS_API_KEY set); drop or adapt it otherwise.
        # Only evaluated while the collector's metrics are scraped
        # (ps_collector_requests_total exists; the readiness probe alone
        # creates it). A scraped collector that has never accepted an event
        # has no accepted series yet and counts as 0; a collector whose
        # metrics are off or not scraped never alerts.
        expr: |
          sum(rate(ps_gateway_requests_total[15m])) > 0.01
          and on()
          (
            sum(rate(ps_collector_ingest_events_total{outcome="accepted"}[15m]))
            or on()
            (sum(ps_collector_requests_total) * 0)
          ) == 0
        for: 15m
        labels:
          severity: critical
          service: prompt-shields-collector
        annotations:
          summary: Collector ingest has stalled
          description: >-
            The gateway handled traffic for the last 15 minutes but the
            collector accepted no ingest events. Check the gateway's
            ps_gateway_telemetry_dropped_total{sink="ps_telemetry"} and the
            collector's ps_collector_ingest_events_total by outcome.

      - alert: PromptShieldsIngestFailing
        # Ingest is reaching the collector but being refused or not stored.
        # Needs at least 60 events in 10 minutes, so a few refused events
        # on an idle collector do not alert.
        expr: |
          (
            sum(rate(ps_collector_ingest_events_total{outcome=~"write_failed|rejected|rate_limited"}[10m]))
              /
            sum(rate(ps_collector_ingest_events_total[10m]))
          ) > 0.1
          and
          sum(rate(ps_collector_ingest_events_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-collector
        annotations:
          summary: Collector is refusing or failing ingest
          description: >-
            {{ $value | humanizePercentage }} of ingested events were rate
            limited, rejected or failed to write over the last 10 minutes.

  # Latency and errors per provider and per route (#387). Provider rules
  # leave out provider="unknown" (requests with no provider: health, MCP,
  # admin routes); the route rules cover every route.
  - name: prompt-shields-gateway-slo
    rules:
      - alert: PromptShieldsProviderLatencyP95High
        # Duration runs until the gateway has the response headers, so for a
        # streamed call it is the time to the first byte, not the whole stream.
        expr: |
          histogram_quantile(0.95,
            sum by (provider, le) (
              rate(ps_gateway_request_duration_seconds_bucket{provider!="unknown"}[10m])
            )
          )
            > 20  # threshold
          and on (provider)
          sum by (provider) (
            rate(ps_gateway_request_duration_seconds_count{provider!="unknown"}[10m])
          )
            > 0.05  # minimum
        for: 15m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "p95 latency through {{ $labels.provider }} is high"
          description: >-
            The 95th percentile of gateway request duration for provider
            {{ $labels.provider }} was {{ $value | humanizeDuration }} over
            the last 10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsproviderlatencyp95high

      - alert: PromptShieldsRouteLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (route, le) (
              rate(ps_gateway_request_duration_seconds_bucket[10m])
            )
          )
            > 20  # threshold
          and on (route)
          sum by (route) (
            rate(ps_gateway_request_duration_seconds_count[10m])
          )
            > 0.05  # minimum
        for: 15m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "p95 latency on {{ $labels.route }} is high"
          description: >-
            The 95th percentile of gateway request duration on route
            {{ $labels.route }} was {{ $value | humanizeDuration }} over the
            last 10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsroutelatencyp95high

      - alert: PromptShieldsProvider5xxRatioHigh
        # 5xx answers: upstream failures the gateway passes through and its
        # own errors (e.g. 502/504 after failed attempts).
        expr: |
          (
            sum by (provider) (rate(ps_gateway_requests_total{provider!="unknown",status=~"5.."}[10m]))
              /
            sum by (provider) (rate(ps_gateway_requests_total{provider!="unknown"}[10m]))
          )
            > 0.05  # threshold
          and on (provider)
          sum by (provider) (rate(ps_gateway_requests_total{provider!="unknown"}[10m]))
            > 0.05  # minimum
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "5xx ratio through {{ $labels.provider }} is high"
          description: >-
            {{ $value | humanizePercentage }} of requests to provider
            {{ $labels.provider }} returned a 5xx over the last 10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsprovider5xxratiohigh

      - alert: PromptShieldsProvider4xxRatioHigh
        # 4xx answers other than 429 (PromptShieldsRateLimitedRatioHigh) and
        # 446 (guardrail block, PromptShieldsGuardrailDenyRateHigh): mostly
        # provider refusals such as 400, 401, 403 and 404 (bad request,
        # revoked key, unknown model). The status does not tell a
        # provider's 4xx from one the gateway returned itself.
        expr: |
          (
            sum by (provider) (rate(ps_gateway_requests_total{provider!="unknown",status=~"4..",status!~"429|446"}[10m]))
              /
            sum by (provider) (rate(ps_gateway_requests_total{provider!="unknown"}[10m]))
          )
            > 0.25  # threshold
          and on (provider)
          sum by (provider) (rate(ps_gateway_requests_total{provider!="unknown"}[10m]))
            > 0.05  # minimum
        for: 15m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "4xx ratio through {{ $labels.provider }} is high"
          description: >-
            {{ $value | humanizePercentage }} of requests to provider
            {{ $labels.provider }} returned a 4xx (429 and 446 excluded) over
            the last 10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsprovider4xxratiohigh

      - alert: PromptShieldsRoute5xxRatioHigh
        expr: |
          (
            sum by (route) (rate(ps_gateway_requests_total{status=~"5.."}[10m]))
              /
            sum by (route) (rate(ps_gateway_requests_total[10m]))
          )
            > 0.05  # threshold
          and on (route)
          sum by (route) (rate(ps_gateway_requests_total[10m]))
            > 0.05  # minimum
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "5xx ratio on {{ $labels.route }} is high"
          description: >-
            {{ $value | humanizePercentage }} of requests on route
            {{ $labels.route }} returned a 5xx over the last 10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsroute5xxratiohigh

      - alert: PromptShieldsRoute4xxRatioHigh
        expr: |
          (
            sum by (route) (rate(ps_gateway_requests_total{status=~"4..",status!~"429|446"}[10m]))
              /
            sum by (route) (rate(ps_gateway_requests_total[10m]))
          )
            > 0.25  # threshold
          and on (route)
          sum by (route) (rate(ps_gateway_requests_total[10m]))
            > 0.05  # minimum
        for: 15m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "4xx ratio on {{ $labels.route }} is high"
          description: >-
            {{ $value | humanizePercentage }} of requests on route
            {{ $labels.route }} returned a 4xx (429 and 446 excluded) over
            the last 10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsroute4xxratiohigh

      - alert: PromptShieldsRateLimitedRatioHigh
        # Share of all requests answered with 429, per source: upstream (a
        # provider), gateway (the gateway's own limits) or budget (a spend
        # budget refused the call).
        expr: |
          (
            sum by (source) (rate(ps_gateway_rate_limited_total[10m]))
              / on () group_left
            sum(rate(ps_gateway_requests_total[10m]))
          )
            > 0.1  # threshold
          and on ()
          sum(rate(ps_gateway_requests_total[10m]))
            > 0.05  # minimum
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "Many requests are rate limited ({{ $labels.source }})"
          description: >-
            {{ $value | humanizePercentage }} of gateway requests were
            answered with 429 by source {{ $labels.source }} over the last
            10 minutes.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsratelimitedratiohigh

  # Budgets and spend (#387). Budget gauges are per replica (each exports
  # the spend it last saw), so the rules take the highest value.
  - name: prompt-shields-gateway-spend
    rules:
      - alert: PromptShieldsBudgetNearLimit
        # No `for`: spend only grows within a window, and the alert should
        # reach someone before the budget starts refusing calls.
        # USD budgets (limit_usd) and token budgets (limit_tokens, #29); budget
        # ids are unique, so the two halves never share a series. Both
        # `# threshold` lines take the chart's threshold override.
        expr: |
          (
            max by (budget, window) (ps_gateway_budget_spend_usd)
              /
            max by (budget, window) (ps_gateway_budget_limit_usd > 0)
          )
            >= 0.8  # threshold
          or
          (
            max by (budget, window) (ps_gateway_budget_spend_tokens)
              /
            max by (budget, window) (ps_gateway_budget_limit_tokens > 0)
          )
            >= 0.8  # threshold
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: "Budget {{ $labels.budget }} is near its limit"
          description: >-
            Budget {{ $labels.budget }} has used {{ $value | humanizePercentage }}
            of its {{ $labels.window }} limit.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsbudgetnearlimit

      - alert: PromptShieldsBudgetExhausted
        expr: |
          (
            max by (budget, window) (ps_gateway_budget_spend_usd)
              /
            max by (budget, window) (ps_gateway_budget_limit_usd > 0)
          )
            >= 1  # threshold
          or
          (
            max by (budget, window) (ps_gateway_budget_spend_tokens)
              /
            max by (budget, window) (ps_gateway_budget_limit_tokens > 0)
          )
            >= 1  # threshold
        labels:
          severity: critical
          service: prompt-shields-gateway
        annotations:
          summary: "Budget {{ $labels.budget }} is exhausted"
          description: >-
            Budget {{ $labels.budget }} has used {{ $value | humanizePercentage }}
            of its {{ $labels.window }} limit; calls it covers are now
            blocked or downgraded, as the budget's action says.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsbudgetexhausted

      - alert: PromptShieldsCostSpike
        # Spend in the last hour against the average hourly spend over the
        # 7 days before it (fewer days while less history exists). Quiet
        # below the minimum hourly spend (USD), so cents do not page, and
        # until there are 24 hourly baseline points, so a new deployment's
        # first day (traffic still ramping up) does not page.
        expr: |
          (
            sum(increase(ps_gateway_cost_usd_total[1h]))
              /
            avg_over_time(sum(increase(ps_gateway_cost_usd_total[1h]))[7d:1h] offset 1h)
          )
            > 3  # threshold
          and on ()
          sum(increase(ps_gateway_cost_usd_total[1h]))
            > 1  # minimum
          and on ()
          count_over_time(sum(increase(ps_gateway_cost_usd_total[1h]))[7d:1h] offset 1h)
            >= 24
        for: 10m
        labels:
          severity: warning
          service: prompt-shields-gateway
        annotations:
          summary: Gateway spend this hour is far above its usual rate
          description: >-
            Estimated gateway spend over the last hour is {{ $value | humanize }}x
            the average hourly spend of the previous 7 days.
          runbook_url: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldscostspike
