[alembic]
# %(here)s: the directory of this file, so `alembic -c packages/db/alembic.ini`
# works from any working directory (the collector image runs it from /app).
script_location = %(here)s/alembic
sqlalchemy.url = postgresql+asyncpg://ps_user:ps_local_dev@localhost:5432/prompt_shields

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
