[project]
name = "prompt-shields-collector"
version = "0.1.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "bcrypt>=4.0",
    "pgvector>=0.3.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
# In-process embeddings for PS_EMBEDDINGS_BACKEND=local (ONNX runtime, no torch).
local-embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "pytest-cov", "pyyaml>=6.0", "aiosqlite>=0.19", "jsonschema>=4.18"]
