[project]
name = "prompt-shields"
version = "0.4.0"
description = "Prompt Shields SDK — discover, classify, and govern AI usage in your codebase"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
ps-scan = "prompt_shields.scan:main"
ps-teardown = "prompt_shields.teardown.cli:main"
prompt-shields-instrument = "prompt_shields.autoinstrument:main"
ps-eval = "prompt_shields.evals.cli:main"
ps-learn = "prompt_shields.learner:main"
ps-eval-apply = "prompt_shields.evals.writeback:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.34"]
all = ["openai>=1.0", "anthropic>=0.34"]
# Shared spend-budget counters (RedisBudgetStore, #29).
optimizer-redis = ["redis>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "openai>=1.0", "anthropic>=0.34", "jsonschema>=4.18", "redis>=5.0", "fakeredis[lua]>=2.20"]

[tool.setuptools.package-data]
# The model catalog (generated by scripts/build_catalog.py).
prompt_shields = ["catalog.json"]
