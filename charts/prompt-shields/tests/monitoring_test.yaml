suite: dashboards and alert rules
templates:
  - templates/prometheusrule.yaml
  - templates/grafana-dashboards.yaml
release:
  name: ps
  namespace: prompt-shields
set:
  secrets.collector.existingSecret: ps-collector
tests:
  - it: renders no PrometheusRule by default
    template: templates/prometheusrule.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no dashboards ConfigMap by default
    template: templates/grafana-dashboards.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the alert rules as a PrometheusRule
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.enabled: true
      prometheusRule.labels:
        release: kube-prometheus-stack
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PrometheusRule
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: ps-prompt-shields
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.groups[0].name
          value: prompt-shields-gateway
      - equal:
          path: spec.groups[1].name
          value: prompt-shields-collector
      - contains:
          path: spec.groups[0].rules
          content:
            alert: PromptShieldsGuardrailDenyRateHigh
          any: true
      - contains:
          path: spec.groups[0].rules
          content:
            alert: PromptShieldsTelemetryDropped
          any: true
      - contains:
          path: spec.groups[0].rules
          content:
            alert: PromptShieldsGateway5xxRateHigh
          any: true
      - contains:
          path: spec.groups[1].rules
          content:
            alert: PromptShieldsCollectorNotReady
          any: true
      - contains:
          path: spec.groups[1].rules
          content:
            alert: PromptShieldsIngestStalled
          any: true
      # Alert templates reach Prometheus untouched, not rendered by Helm.
      - matchRegex:
          path: spec.groups[0].rules[2].annotations.summary
          pattern: '\{\{ \$labels\.sink \}\}'

  - it: renders the latency, error, budget and cost alerts with runbooks
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.enabled: true
    asserts:
      - equal:
          path: spec.groups[2].name
          value: prompt-shields-gateway-slo
      - equal:
          path: spec.groups[3].name
          value: prompt-shields-gateway-spend
      - lengthEqual:
          path: spec.groups[2].rules
          count: 7
      - lengthEqual:
          path: spec.groups[3].rules
          count: 3
      - equal:
          path: spec.groups[3].rules[1].alert
          value: PromptShieldsBudgetExhausted
      - equal:
          path: spec.groups[3].rules[1].labels.severity
          value: critical
      - matchRegex:
          path: spec.groups[3].rules[0].expr
          pattern: '>= 0.8  # threshold'
      - equal:
          path: spec.groups[2].rules[0].annotations.runbook_url
          value: https://github.com/Prompt-Shields/prompt-shields-sdk/blob/main/docs/guides/alert-runbooks.mdx#promptshieldsproviderlatencyp95high

  - it: applies per-alert overrides from values
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.enabled: true
      prometheusRule.runbookBaseUrl: https://docs.example.internal/runbooks/
      prometheusRule.rules:
        PromptShieldsRouteLatencyP95High:
          threshold: 30
          minimum: 0.5
          for: 20m
          severity: critical
        PromptShieldsBudgetNearLimit:
          threshold: 0.9
          labels:
            team: finops
        PromptShieldsGateway5xxRateHigh:
          enabled: false
    asserts:
      - equal:
          path: spec.groups[2].rules[1].alert
          value: PromptShieldsRouteLatencyP95High
      - matchRegex:
          path: spec.groups[2].rules[1].expr
          pattern: '> 30  # threshold'
      - matchRegex:
          path: spec.groups[2].rules[1].expr
          pattern: '> 0.5  # minimum'
      - notMatchRegex:
          path: spec.groups[2].rules[1].expr
          pattern: '> 20  # threshold'
      - equal:
          path: spec.groups[2].rules[1].for
          value: 20m
      - equal:
          path: spec.groups[2].rules[1].labels.severity
          value: critical
      - equal:
          path: spec.groups[2].rules[1].labels.service
          value: prompt-shields-gateway
      - equal:
          path: spec.groups[2].rules[1].annotations.runbook_url
          value: https://docs.example.internal/runbooks#promptshieldsroutelatencyp95high
      # Other alerts keep the file's thresholds.
      - matchRegex:
          path: spec.groups[2].rules[0].expr
          pattern: '> 20  # threshold'
      - matchRegex:
          path: spec.groups[3].rules[0].expr
          pattern: '>= 0.9  # threshold'
      - equal:
          path: spec.groups[3].rules[0].labels.team
          value: finops
      - equal:
          path: spec.groups[3].rules[0].labels.severity
          value: warning
      - matchRegex:
          path: spec.groups[3].rules[1].expr
          pattern: '>= 1  # threshold'
      - notContains:
          path: spec.groups[0].rules
          content:
            alert: PromptShieldsGateway5xxRateHigh
          any: true
      - lengthEqual:
          path: spec.groups[0].rules
          count: 2

  - it: fails on an override for an alert that does not exist
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.enabled: true
      prometheusRule.rules:
        PromptShieldsNoSuchAlert:
          threshold: 1
    asserts:
      - failedTemplate:
          errorPattern: "prometheusRule.rules.PromptShieldsNoSuchAlert: no alert with that name"

  - it: fails on a threshold for an alert without a threshold line
    template: templates/prometheusrule.yaml
    set:
      prometheusRule.enabled: true
      prometheusRule.rules:
        PromptShieldsBudgetNearLimit:
          minimum: 1
    asserts:
      - failedTemplate:
          errorPattern: "prometheusRule.rules.PromptShieldsBudgetNearLimit.minimum: this alert has no"

  - it: ships the three dashboards with the sidecar label
    template: templates/grafana-dashboards.yaml
    set:
      grafanaDashboards.enabled: true
      grafanaDashboards.annotations:
        grafana_folder: Prompt Shields
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: ps-prompt-shields-dashboards
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - equal:
          path: metadata.annotations.grafana_folder
          value: Prompt Shields
      - exists:
          path: data["prompt-shields-gateway-traffic.json"]
      - exists:
          path: data["prompt-shields-guardrails-security.json"]
      - exists:
          path: data["prompt-shields-collector-health.json"]
      - matchRegex:
          path: data["prompt-shields-gateway-traffic.json"]
          pattern: '"uid": "ps-gateway-traffic"'
      - matchRegex:
          path: data["prompt-shields-gateway-traffic.json"]
          pattern: 'ps_gateway_mcp_tool_calls_total'
      - matchRegex:
          path: data["prompt-shields-gateway-traffic.json"]
          pattern: 'ps_gateway_budget_limit_usd'

  - it: puts the dashboards in another namespace and uses a custom label
    template: templates/grafana-dashboards.yaml
    set:
      grafanaDashboards.enabled: true
      grafanaDashboards.namespace: monitoring
      grafanaDashboards.labels:
        grafana_dashboard: null
        dashboards: prompt-shields
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: metadata.labels.dashboards
          value: prompt-shields
      - notExists:
          path: metadata.labels.grafana_dashboard
