{{- if .Values.worker.enabled }}
{{- $w := .Values.worker }}
{{- $c := .Values.collector }}
{{- /*
`python -m collector.workers`: the webhook delivery loop and the provider
usage pull, each on when its interval is above 0 (ps.validate checks one is).
It ignores PS_COLLECTOR_RUN_WORKERS. Singleton with Recreate, so two loops
never overlap during a rollout.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ps.fullname" . }}-worker
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" "worker") | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ps.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ps.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $.Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with $w.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ps.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "ps.imagePullSecrets" . | nindent 6 }}
      {{- include "ps.podSecurityContext" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "ps.image" (dict "ctx" $ "image" $c.image) }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command:
            {{- toYaml $w.command | nindent 12 }}
          {{- include "ps.collectorEnvFrom" (dict "ctx" $ "secretName" (include "ps.collectorSecretName" .)) | nindent 10 }}
          env:
            - name: PS_WEBHOOK_WORKER_INTERVAL_SECONDS
              value: {{ toString (default 0 $w.webhookIntervalSeconds) | quote }}
            - name: PS_PROVIDER_USAGE_PULL_INTERVAL_SECONDS
              value: {{ toString (default 0 $w.providerUsagePullIntervalSeconds) | quote }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $w.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "ps.containerSecurityContext" . | nindent 10 }}
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "ps.collectorVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "ps.collectorVolumes" . | nindent 8 }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $w.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
