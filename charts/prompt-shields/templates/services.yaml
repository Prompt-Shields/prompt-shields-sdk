{{- range $component := list "gateway" "collector" }}
{{- $c := index $.Values $component }}
{{- if $c.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ps.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- with $c.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $c.service.type }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ps.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
{{- end }}
{{- end }}
