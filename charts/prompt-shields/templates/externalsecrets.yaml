{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- range $component := list "collector" "gateway" "migration" }}
{{- $spec := index $es $component }}
{{- $hook := false }}
{{- if eq $component "migration" }}
{{- /* The migration ExternalSecret is a hook (the Job runs before the
release's ordinary objects); without its own data it copies the collector's.
Deleted with its Secret (creationPolicy Owner) once every hook succeeded. */}}
{{- $hook = and $.Values.migration.enabled (eq (include "ps.migrationSecretMode" $) "eso") }}
{{- if and $hook (not (or $spec.data $spec.dataFrom)) }}
{{- $spec = $es.collector }}
{{- end }}
{{- end }}
{{- $existing := (index $.Values.secrets $component).existingSecret }}
{{- if and (or $spec.data $spec.dataFrom) (not $existing) (or (ne $component "migration") $hook) }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "ps.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
  {{- if $hook }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "ps.fullname" $ }}-{{ $component }}
    creationPolicy: Owner
  {{- with $spec.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $spec.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
