{{- if .Values.collector.enabled }}
{{- $c := .Values.collector }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ps.fullname" . }}-collector
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" "collector") | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "ps.selectorLabels" (dict "ctx" $ "component" "collector") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ps.selectorLabels" (dict "ctx" $ "component" "collector") | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if $.Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- end }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ps.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "ps.imagePullSecrets" . | nindent 6 }}
      {{- include "ps.podSecurityContext" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with $c.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "ps.image" (dict "ctx" $ "image" $c.image) }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          {{- with $c.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          {{- include "ps.collectorEnvFrom" (dict "ctx" $ "secretName" (include "ps.collectorSecretName" .)) | nindent 10 }}
          {{- if or $c.runWorkers.envName $c.extraEnv }}
          env:
            {{- with $c.runWorkers.envName }}
            - name: {{ . }}
              value: {{ toString $c.runWorkers.value | quote }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- include "ps.containerSecurityContext" . | nindent 10 }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $c.probes.startup.enabled }}
          startupProbe:
            {{- include "ps.httpProbe" (dict "probe" $c.probes.startup "port" "http") | nindent 12 }}
          {{- end }}
          {{- if $c.probes.liveness.enabled }}
          livenessProbe:
            {{- include "ps.httpProbe" (dict "probe" $c.probes.liveness "port" "http") | nindent 12 }}
          {{- end }}
          {{- if $c.probes.readiness.enabled }}
          readinessProbe:
            {{- include "ps.httpProbe" (dict "probe" $c.probes.readiness "port" "http") | nindent 12 }}
          {{- end }}
          {{- include "ps.preStop" $c.preStopSleepSeconds | nindent 10 }}
          volumeMounts:
            {{- include "ps.collectorVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "ps.collectorVolumes" . | nindent 8 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
{{- end }}
