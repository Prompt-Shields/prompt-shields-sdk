{{- /* Prometheus Operator ServiceMonitors (monitoring.coreos.com/v1). */ -}}
{{- range $component := list "gateway" "collector" }}
{{- $c := index $.Values $component }}
{{- if and $c.enabled $c.serviceMonitor.enabled }}
{{- if not $c.metrics.enabled }}
{{- fail (printf "%s.serviceMonitor.enabled needs %s.metrics.enabled" $component $component) }}
{{- end }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ps.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
    {{- with $c.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ps.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  endpoints:
    - port: http
      path: {{ $c.metrics.path }}
      interval: {{ $c.serviceMonitor.interval }}
      scrapeTimeout: {{ $c.serviceMonitor.scrapeTimeout }}
      {{- with include "ps.metricsTokenRef" (dict "ctx" $ "component" $component) }}
      authorization:
        type: Bearer
        credentials:
          {{- . | nindent 10 }}
      {{- end }}
{{- end }}
{{- end }}
