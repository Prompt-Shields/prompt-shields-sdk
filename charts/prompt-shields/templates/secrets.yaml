{{- include "ps.validate" . -}}
{{- /*
Chart-created Secrets (secrets.create): for development and CI only, since
the values are stored in the release history. A component with an
existingSecret or an ExternalSecret gets none.
*/ -}}
{{- if .Values.secrets.create }}
{{- range $component := list "collector" "gateway" }}
{{- $s := index $.Values.secrets $component }}
{{- $es := index $.Values.externalSecrets $component }}
{{- if and (not $s.existingSecret) (not (and $.Values.externalSecrets.enabled (or $es.data $es.dataFrom))) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ps.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $s.values }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
The migration Secret is a hook object so it exists before the pre-install
migration Job. Without migration values it carries the collector's
PS_DATABASE_URL (one role for both). See ps.migrationSecretMode.
*/}}
{{- if and .Values.migration.enabled (eq (include "ps.migrationSecretMode" .) "create") }}
{{- $m := .Values.secrets.migration.values }}
{{- if not $m }}
{{- $m = dict "PS_DATABASE_URL" (required "secrets.collector.values.PS_DATABASE_URL is required" .Values.secrets.collector.values.PS_DATABASE_URL) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ps.fullname" . }}-migration
  labels:
    {{- include "ps.labels" (dict "ctx" $ "component" "migration") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := $m }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
