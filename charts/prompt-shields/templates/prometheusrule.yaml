{{- /* Prometheus Operator alert rules: files/prometheus/alerts.yaml (a copy of deploy/prometheus/alerts.yaml). */ -}}
{{- if .Values.prometheusRule.enabled }}
{{- $rules := .Files.Get "files/prometheus/alerts.yaml" | fromYaml }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ps.fullname" . }}
  labels:
    {{- include "ps.labels" (dict "ctx" . "component" "monitoring") | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- toYaml $rules.groups | nindent 4 }}
{{- end }}
